title:
  en: Horse ride in the Palmeraie
  fr: Balade à cheval dans la Palmeraie
  es: Paseo a caballo por el Palmeral
  de: Ausritt im Palmenhain
  pt: Passeio a cavalo no Palmeiral
  ar: جولة على ظهر الخيل في النخيل
summary:
  en: An easy ride among the palm trees on the edge of Marrakech, for beginners and experienced riders, with a guide from the stable.
  fr: Une balade facile parmi les palmiers aux portes de Marrakech, pour débutants et cavaliers confirmés, avec un guide de l’écurie.
  es: Un paseo fácil entre palmeras a las afueras de Marrakech, para principiantes y jinetes con experiencia, con un guía de la cuadra.
  de: Ein leichter Ritt zwischen Palmen am Rand von Marrakesch, für Anfänger und erfahrene Reiter, mit einem Guide aus dem Stall.
  pt: Um passeio fácil entre palmeiras nos arredores de Marraquexe, para principiantes e cavaleiros experientes, com um guia da cavalariça.
  ar: جولة سهلة بين أشجار النخيل على أطراف مراكش، للمبتدئين وذوي الخبرة، مع مرشد من الإسطبل.
about:
  en: >-
    Calm horses, a guide who adapts to your level, and quiet tracks through the Palmeraie, with the Atlas on the horizon on clear days. Rides last one or two hours. A beach ride in Essaouira can also be arranged if you go there.
  fr: >-
    Des chevaux calmes, un guide qui s’adapte à votre niveau et des pistes tranquilles dans la Palmeraie, avec l’Atlas à l’horizon par temps clair. Balades d’une ou deux heures. Une balade sur la plage d’Essaouira est aussi possible si vous y allez.
  es: Caballos tranquilos, un guía que se adapta a su nivel y pistas tranquilas por el Palmeral, con el Atlas en el horizonte los días claros. Los paseos duran una o dos horas. También se puede organizar un paseo por la playa de Essaouira si va allí.
  de: Ruhige Pferde, ein Guide, der sich Ihrem Niveau anpasst, und stille Wege durch den Palmenhain, an klaren Tagen mit dem Atlas am Horizont. Die Ritte dauern ein bis zwei Stunden. Wenn Sie nach Essaouira fahren, lässt sich dort auch ein Strandritt organisieren.
  pt: Cavalos calmos, um guia que se adapta ao seu nível e trilhos tranquilos pelo Palmeiral, com o Atlas no horizonte nos dias limpos. Os passeios duram uma ou duas horas. Também se pode organizar um passeio na praia de Essaouira, se for lá.
  ar: >-
    خيول هادئة، ومرشد يتكيف مع مستواكم، ومسالك هادئة في النخيل مع الأطلس في الأفق في الأيام الصافية. تدوم الجولات ساعة أو ساعتين. يمكن أيضا ترتيب جولة على شاطئ الصويرة إذا ذهبتم إليها.
