summary:
  en: West of Imlil, over Tizi Mzik into the green Azzaden valley, to the highest waterfall of the Toubkal area.
  fr: À l’ouest d’Imlil, par le Tizi Mzik vers la verte vallée d’Azzaden, jusqu’à la plus haute cascade de la région du Toubkal.
  es: Al oeste de Imlil, por el Tizi Mzik hasta el verde valle de Azzaden y la cascada más alta de la zona del Toubkal.
  de: Westlich von Imlil über den Tizi Mzik ins grüne Azzaden-Tal, zum höchsten Wasserfall der Toubkal-Region.
  pt: A oeste de Imlil, pelo Tizi Mzik até ao verde vale de Azzaden e à cascata mais alta da região do Toubkal.
  ar: غرب إمليل، عبر تيزي مزيك نحو وادي أزادن الأخضر، حتى أعلى شلال في منطقة توبقال.
about:
  en: >-
    A varied loop on the quieter western side of Imlil. You cross Tizi Mzik into the Azzaden valley, sleep in simple mountain shelters and walk up past the shepherds’ huts of Tamsoult to the Ighouliden waterfall, which drops in several steps from the cliffs. Good for walkers who want real mountain views without going to the summit.
  fr: >-
    Une boucle variée sur le versant ouest, plus calme, d’Imlil. Vous passez le Tizi Mzik vers la vallée d’Azzaden, dormez dans des abris de montagne simples et montez, par les bergeries de Tamsoult, jusqu’à la cascade d’Ighouliden qui tombe en plusieurs sauts depuis les falaises. Idéal pour qui veut de vrais paysages de montagne sans aller au sommet.
  es: Una ruta variada por la vertiente oeste, más tranquila, de Imlil. Cruza el Tizi Mzik hasta el valle de Azzaden, duerme en sencillos refugios de montaña y sube por las cabañas de pastores de Tamsoult hasta la cascada de Ighouliden, que cae en varios saltos desde los acantilados. Para quien quiere auténticos paisajes de montaña sin subir a la cumbre.
  de: Eine abwechslungsreiche Runde auf der ruhigeren Westseite von Imlil. Sie überqueren den Tizi Mzik ins Azzaden-Tal, schlafen in einfachen Berghütten und steigen an den Hirtenhütten von Tamsoult vorbei zum Ighouliden-Wasserfall auf, der in mehreren Stufen von den Felsen stürzt. Für alle, die echte Bergblicke wollen, ohne auf den Gipfel zu gehen.
  pt: Um percurso variado na vertente oeste, mais calma, de Imlil. Atravessa o Tizi Mzik para o vale de Azzaden, dorme em abrigos de montanha simples e sobe pelas cabanas de pastores de Tamsoult até à cascata de Ighouliden, que cai em vários saltos das falésias. Para quem quer verdadeiras paisagens de montanha sem subir ao cume.
  ar: >-
    جولة متنوعة في الجهة الغربية الأهدأ من إمليل. تعبرون تيزي مزيك نحو وادي أزادن، وتبيتون في ملاجئ جبلية بسيطة، وتصعدون مرورا بأكواخ الرعاة في تامسولت حتى شلال إغوليدن الذي ينحدر على عدة مراحل من الجروف. مناسبة لمن يريد مناظر جبلية حقيقية دون الصعود إلى القمة.
