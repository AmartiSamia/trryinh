summary:
  en: Half a day in the old city with a licensed guide. The Bahia Palace, the souks, the craftsmen’s quarters and Jemaa el-Fna, without getting lost or pushed into shops.
  fr: Une demi-journée dans la vieille ville avec un guide officiel. Le palais de la Bahia, les souks, les quartiers d’artisans et Jemaa el-Fna, sans se perdre ni être poussé dans les boutiques.
  es: Medio día en la ciudad vieja con un guía oficial. El palacio de la Bahía, los zocos, los barrios de artesanos y Jemaa el-Fna, sin perderse ni ser empujado a las tiendas.
  de: Ein halber Tag in der Altstadt mit einem lizenzierten Guide. Bahia-Palast, Souks, Handwerkerviertel und Jemaa el-Fna, ohne sich zu verlaufen oder in Läden gedrängt zu werden.
  pt: Meio dia na cidade velha com um guia oficial. O palácio da Bahia, os souks, os bairros dos artesãos e Jemaa el-Fna, sem se perder nem ser empurrado para as lojas.
  ar: نصف يوم في المدينة القديمة مع مرشد معتمد. قصر الباهية، الأسواق، أحياء الحرفيين وساحة جامع الفنا، دون أن تضيعوا أو تُدفعوا إلى المتاجر.
about:
  en: >-
    The medina of Marrakech is easier and richer with someone who grew up in it. Your licensed guide starts at the Bahia Palace, walks you through the old Jewish quarter and the spice square, then into the souks of the dyers, metalworkers and leatherworkers, and ends at Jemaa el-Fna. You go at your pace; shopping only if you ask.
  fr: >-
    La médina de Marrakech est plus simple et plus riche avec quelqu’un qui y a grandi. Votre guide officiel commence au palais de la Bahia, traverse le mellah et la place des épices, puis les souks des teinturiers, ferronniers et maroquiniers, et termine à Jemaa el-Fna. À votre rythme ; des achats seulement si vous le demandez.
  es: La medina de Marrakech es más fácil y más rica con alguien que ha crecido en ella. Su guía oficial empieza en el palacio de la Bahía, le lleva por el antiguo barrio judío y la plaza de las especias, luego a los zocos de tintoreros, herreros y marroquineros, y termina en Jemaa el-Fna. A su ritmo; compras solo si usted lo pide.
  de: Die Medina von Marrakesch ist einfacher und reicher mit jemandem, der dort aufgewachsen ist. Ihr lizenzierter Guide beginnt am Bahia-Palast, führt Sie durch das alte jüdische Viertel und den Gewürzplatz, dann in die Souks der Färber, Schmiede und Lederhandwerker, und endet am Jemaa el-Fna. In Ihrem Tempo; Einkaufen nur, wenn Sie es wünschen.
  pt: A medina de Marraquexe é mais fácil e mais rica com alguém que lá cresceu. O seu guia oficial começa no palácio da Bahia, leva-o pelo antigo bairro judeu e pela praça das especiarias, depois aos souks dos tintureiros, ferreiros e artesãos do couro, e termina em Jemaa el-Fna. Ao seu ritmo; compras só se pedir.
  ar: >-
    مدينة مراكش العتيقة أسهل وأغنى برفقة شخص نشأ فيها. يبدأ مرشدكم المعتمد من قصر الباهية، ثم يمر بالملاح وساحة التوابل، ثم أسواق الصباغين والحدادين والدباغين، وينتهي في ساحة جامع الفنا. بإيقاعكم الخاص، ولا تسوق إلا إذا طلبتم ذلك.
