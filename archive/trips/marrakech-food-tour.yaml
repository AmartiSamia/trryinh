title:
  en: Marrakech street food tour
  fr: Tour street food à Marrakech
  es: Tour de comida callejera en Marrakech
  de: Streetfood-Tour in Marrakesch
  pt: Tour de comida de rua em Marraquexe
  ar: جولة أكل الشارع في مراكش
summary:
  en: An evening walk through the medina, eating what people in Marrakech actually eat. Msemen, harira, tangia, snail broth for the brave, and mint tea to finish.
  fr: Une balade du soir dans la médina pour manger ce que mangent vraiment les Marrakchis. Msemen, harira, tanjia, bouillon d’escargots pour les courageux, et thé à la menthe pour finir.
  es: Un paseo nocturno por la medina para comer lo que realmente comen en Marrakech. Msemen, harira, tanjia, caldo de caracoles para los valientes y té a la menta para terminar.
  de: Ein Abendspaziergang durch die Medina, bei dem Sie essen, was die Menschen in Marrakesch wirklich essen. Msemen, Harira, Tanjia, Schneckensuppe für Mutige und zum Abschluss Minztee.
  pt: Um passeio ao fim do dia pela medina, a comer o que se come de verdade em Marraquexe. Msemen, harira, tanjia, caldo de caracóis para os corajosos e chá de menta para terminar.
  ar: جولة مسائية في المدينة العتيقة لتذوق ما يأكله أهل مراكش فعلا. المسمن، الحريرة، الطنجية، مرق الببوش للشجعان، وشاي بالنعناع في الختام.
about:
  en: >-
    About ten tastings over three hours, in small stalls and family places away from the tourist menus. Your guide explains what you eat and how it is made, from the bread ovens to the tangia cooked slowly in the ashes of the hammam fire. Come hungry; vegetarians are welcome, just tell us.
  fr: >-
    Une dizaine de dégustations en trois heures, dans de petits stands et des adresses familiales loin des menus touristiques. Votre guide explique ce que vous mangez et comment c’est préparé, des fours à pain à la tanjia cuite lentement dans les cendres du feu du hammam. Venez le ventre vide ; les végétariens sont les bienvenus, dites-le-nous.
  es: Unas diez degustaciones en tres horas, en pequeños puestos y locales familiares lejos de los menús turísticos. Su guía le explica qué come y cómo se prepara, desde los hornos de pan hasta la tanjia cocinada lentamente en las cenizas del fuego del hammam. Venga con hambre; los vegetarianos son bienvenidos, solo díganoslo.
  de: Rund zehn Kostproben in drei Stunden, an kleinen Ständen und in Familienlokalen abseits der Touristenmenüs. Ihr Guide erklärt, was Sie essen und wie es zubereitet wird, von den Brotöfen bis zur Tanjia, die langsam in der Asche des Hammam-Feuers gart. Kommen Sie hungrig; Vegetarier sind willkommen, sagen Sie es uns einfach.
  pt: Cerca de dez provas em três horas, em pequenas bancas e casas de família longe dos menus turísticos. O guia explica o que come e como se faz, dos fornos de pão à tanjia cozinhada lentamente nas cinzas do fogo do hammam. Venha com fome; vegetarianos são bem-vindos, basta dizer-nos.
  ar: >-
    حوالي عشر تذوقات في ثلاث ساعات، في أكشاك صغيرة ومحلات عائلية بعيدا عن القوائم السياحية. يشرح لكم المرشد ما تأكلون وكيف يُحضَّر، من أفران الخبز إلى الطنجية المطبوخة ببطء في رماد نار الحمام. تعالوا جائعين، والنباتيون مرحب بهم، فقط أخبرونا.
