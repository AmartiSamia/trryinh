title:
  en: Lake Ifni and Toubkal circuit, 6 days
  fr: Circuit lac d’Ifni et Toubkal, 6 jours
  es: Circuito del lago Ifni y el Toubkal, 6 días
  de: Rundtour Ifni-See und Toubkal, 6 Tage
  pt: Circuito do lago Ifni e do Toubkal, 6 dias
  ar: جولة بحيرة إفني وتوبقال، 6 أيام
summary:
  en: The big loop around the Toubkal massif. Remote valleys, Berber villages, a night by Lake Ifni and the summit at the end, when you are well acclimatised.
  fr: La grande boucle autour du massif du Toubkal. Vallées isolées, villages berbères, une nuit au bord du lac d’Ifni et le sommet à la fin, bien acclimaté.
  es: La gran vuelta al macizo del Toubkal. Valles remotos, pueblos bereberes, una noche junto al lago Ifni y la cumbre al final, bien aclimatado.
  de: Die große Runde um das Toubkal-Massiv. Abgelegene Täler, Berberdörfer, eine Nacht am Ifni-See und am Ende der Gipfel, gut akklimatisiert.
  pt: A grande volta ao maciço do Toubkal. Vales remotos, aldeias berberes, uma noite junto ao lago Ifni e o cume no fim, bem aclimatado.
  ar: الجولة الكبرى حول جبال توبقال. وديان معزولة وقرى أمازيغية وليلة بجانب بحيرة إفني، والقمة في النهاية بعد تأقلم جيد.
about:
  en: >-
    Six days to really know the High Atlas. You leave Imlil eastwards to Tacheddirt, cross high passes into the quiet Ouarai valley, walk down to the village of Amsouzart and up to Lake Ifni, a turquoise lake closed in by rock walls. From there you cross Tizi n’Ouanoums (3,664 m) to the Toubkal refuge, and climb the summit on the last morning, better acclimatised than on any shorter trek. Mules carry the bags; you carry a daypack.
  fr: >-
    Six jours pour vraiment connaître le Haut Atlas. Vous quittez Imlil vers l’est jusqu’à Tacheddirt, franchissez des cols élevés vers la calme vallée de l’Ouarai, descendez au village d’Amsouzart et montez au lac d’Ifni, turquoise entre ses parois de roche. De là, vous passez le Tizi n’Ouanoums (3 664 m) jusqu’au refuge du Toubkal, et montez au sommet le dernier matin, mieux acclimaté que sur n’importe quel trek plus court. Les mules portent les bagages ; vous portez un sac de journée.
  es: Seis días para conocer de verdad el Alto Atlas. Sale de Imlil hacia el este hasta Tacheddirt, cruza puertos altos hacia el tranquilo valle de Ouarai, baja al pueblo de Amsouzart y sube al lago Ifni, un lago turquesa entre paredes de roca. Desde allí cruza el Tizi n’Ouanoums (3664 m) hasta el refugio del Toubkal y sube a la cumbre la última mañana, mejor aclimatado que en cualquier trek más corto. Las mulas llevan el equipaje; usted lleva una mochila de día.
  de: Sechs Tage, um den Hohen Atlas wirklich kennenzulernen. Sie verlassen Imlil ostwärts nach Tacheddirt, überqueren hohe Pässe ins stille Ouarai-Tal, steigen ab ins Dorf Amsouzart und hinauf zum Ifni-See, einem türkisfarbenen See zwischen Felswänden. Von dort überqueren Sie den Tizi n’Ouanoums (3.664 m) zur Toubkal-Hütte und besteigen am letzten Morgen den Gipfel, besser akklimatisiert als bei jedem kürzeren Trek. Maultiere tragen das Gepäck, Sie nur einen Tagesrucksack.
  pt: Seis dias para conhecer a sério o Alto Atlas. Sai de Imlil para leste até Tacheddirt, atravessa passos altos para o calmo vale de Ouarai, desce à aldeia de Amsouzart e sobe ao lago Ifni, um lago turquesa entre paredes de rocha. Daí atravessa o Tizi n’Ouanoums (3664 m) até ao refúgio do Toubkal e sobe ao cume na última manhã, mais bem aclimatado do que em qualquer trekking mais curto. As mulas levam a bagagem; leva só uma mochila de dia.
  ar: >-
    ستة أيام للتعرف حقا على الأطلس الكبير. تغادرون إمليل شرقا نحو تاشديرت، وتعبرون ممرات عالية نحو وادي أواراي الهادئ، ثم تنزلون إلى قرية أمسوزارت وتصعدون إلى بحيرة إفني الفيروزية بين جدرانها الصخرية. من هناك تعبرون ممر تيزي نوانومس (3664 م) إلى ملجأ توبقال، وتصعدون القمة في الصباح الأخير وأنتم أكثر تأقلما من أي رحلة أقصر. البغال تحمل الأمتعة وأنتم تحملون حقيبة يومية فقط.
