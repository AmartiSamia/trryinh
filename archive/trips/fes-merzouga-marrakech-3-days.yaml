title:
  en: Fes to Marrakech via the Merzouga desert, 3 days
  fr: De Fès à Marrakech par le désert de Merzouga, 3 jours
  es: De Fez a Marrakech por el desierto de Merzouga, 3 días
  de: Von Fès nach Marrakesch durch die Wüste von Merzouga, 3 Tage
  pt: De Fez a Marraquexe pelo deserto de Merzouga, 3 dias
  ar: من فاس إلى مراكش عبر صحراء مرزوكة، 3 أيام
summary:
  en: The best way to travel between Fes and Marrakech. Cedar forests of the Middle Atlas, a night in the Erg Chebbi dunes and the road of the kasbahs.
  fr: La plus belle façon de relier Fès à Marrakech. Forêts de cèdres du Moyen Atlas, nuit dans les dunes de l’erg Chebbi et route des kasbahs.
  es: La mejor forma de ir de Fez a Marrakech. Bosques de cedros del Atlas Medio, una noche en las dunas del Erg Chebbi y la ruta de las kasbahs.
  de: Die schönste Art, von Fès nach Marrakesch zu reisen. Zedernwälder im Mittleren Atlas, eine Nacht in den Dünen des Erg Chebbi und die Straße der Kasbahs.
  pt: A melhor forma de ir de Fez a Marraquexe. Florestas de cedros do Médio Atlas, uma noite nas dunas do Erg Chebbi e a estrada das kasbahs.
  ar: أجمل طريقة للتنقل بين فاس ومراكش. غابات الأرز في الأطلس المتوسط، ليلة في كثبان عرق الشبي وطريق القصبات.
about:
  en: >-
    Instead of the train, cross the country. You leave Fes through Ifrane and the cedar forests of the Middle Atlas, follow the Ziz valley down to the Sahara and ride camels to a camp in Erg Chebbi. Then the Todra and Dades gorges, Ouarzazate and the Tichka pass bring you to Marrakech. A 4-day version with more time on the way is possible on request.
  fr: >-
    Plutôt que le train, traversez le pays. Vous quittez Fès par Ifrane et les cèdres du Moyen Atlas, suivez la vallée du Ziz jusqu’au Sahara et rejoignez à dos de dromadaire un camp de l’erg Chebbi. Puis les gorges du Todra et du Dadès, Ouarzazate et le col du Tichka vous mènent à Marrakech. Une version en 4 jours, plus tranquille, est possible sur demande.
  es: En lugar del tren, cruce el país. Sale de Fez por Ifrane y los cedros del Atlas Medio, sigue el valle del Ziz hasta el Sáhara y llega en dromedario a un campamento en el Erg Chebbi. Después, las gargantas del Todra y del Dades, Ouarzazate y el puerto de Tichka le llevan a Marrakech. Bajo petición, versión de 4 días con más tiempo por el camino.
  de: "Statt mit dem Zug: Durchqueren Sie das Land. Sie verlassen Fès über Ifrane und die Zedernwälder des Mittleren Atlas, folgen dem Ziz-Tal bis in die Sahara und reiten auf Kamelen zu einem Camp im Erg Chebbi. Dann führen Sie die Todra- und Dadès-Schluchten, Ouarzazate und der Tichka-Pass nach Marrakesch. Auf Wunsch auch als 4-Tage-Version mit mehr Zeit unterwegs."
  pt: Em vez do comboio, atravesse o país. Sai de Fez por Ifrane e pelos cedros do Médio Atlas, segue o vale do Ziz até ao Sara e chega de dromedário a um acampamento no Erg Chebbi. Depois, as gargantas do Todra e do Dadès, Ouarzazate e o passo de Tichka levam-no a Marraquexe. A pedido, versão de 4 dias com mais tempo pelo caminho.
  ar: >-
    بدلا من القطار، اعبروا البلد. تغادرون فاس عبر إفران وغابات الأرز في الأطلس المتوسط، وتتبعون وادي زيز حتى الصحراء، ثم تركبون الجمال إلى مخيم في عرق الشبي. بعد ذلك تقودكم مضايق تودغى ودادس وورزازات وممر تيشكا إلى مراكش. نسخة من 4 أيام بوقت أكثر في الطريق ممكنة عند الطلب.
