summary:
  en: The largest car-free medina in the world, with a licensed guide from Fes. Bou Inania madrasa, the Chouara tannery, Al-Qarawiyyin and the craftsmen’s alleys.
  fr: La plus grande médina piétonne du monde, avec un guide officiel de Fès. Médersa Bou Inania, tannerie Chouara, Al-Qaraouiyine et ruelles des artisans.
  es: La medina sin coches más grande del mundo, con un guía oficial de Fez. La madrasa Bou Inania, la curtiduría Chouara, Al-Qarawiyyin y las callejuelas de los artesanos.
  de: Die größte autofreie Medina der Welt, mit einem lizenzierten Guide aus Fès. Medersa Bou Inania, Gerberei Chouara, Al-Qarawiyyin und die Gassen der Handwerker.
  pt: A maior medina sem carros do mundo, com um guia oficial de Fez. A madraça Bou Inania, os curtumes Chouara, Al-Qarawiyyin e as ruelas dos artesãos.
  ar: أكبر مدينة عتيقة خالية من السيارات في العالم، مع مرشد معتمد من فاس. مدرسة بوعنانية، دار الدباغة شوارة، القرويين وأزقة الحرفيين.
about:
  en: >-
    Fes el-Bali has more than 9,000 lanes, and a good guide makes the difference between a maze and a story. You enter by the Blue Gate, visit the Bou Inania madrasa, pass the Al-Qarawiyyin mosque and university, watch the tanners at work from a terrace above Chouara, and walk through the metalworkers’ square. A full or half day, as you like.
  fr: >-
    Fès el-Bali compte plus de 9 000 ruelles, et un bon guide fait la différence entre un labyrinthe et une histoire. Entrée par Bab Boujloud, visite de la médersa Bou Inania, passage devant la mosquée-université Al-Qaraouiyine, vue sur les tanneurs depuis une terrasse au-dessus de Chouara, puis la place des dinandiers. Journée ou demi-journée, au choix.
  es: Fez el-Bali tiene más de 9000 callejuelas, y un buen guía marca la diferencia entre un laberinto y una historia. Se entra por la Puerta Azul, se visita la madrasa Bou Inania, se pasa por la mezquita y universidad Al-Qarawiyyin, se ve a los curtidores trabajar desde una terraza sobre Chouara y se cruza la plaza de los caldereros. Día completo o medio día, como prefiera.
  de: Fès el-Bali hat mehr als 9.000 Gassen, und ein guter Guide macht aus einem Labyrinth eine Geschichte. Sie betreten die Altstadt durch das Blaue Tor, besuchen die Medersa Bou Inania, kommen an der Moschee und Universität Al-Qarawiyyin vorbei, sehen den Gerbern von einer Terrasse über Chouara zu und gehen über den Platz der Kupferschmiede. Ganz- oder halbtags, wie Sie möchten.
  pt: Fez el-Bali tem mais de 9000 ruelas, e um bom guia faz a diferença entre um labirinto e uma história. Entra pela Porta Azul, visita a madraça Bou Inania, passa pela mesquita e universidade Al-Qarawiyyin, vê os curtidores a trabalhar de um terraço sobre Chouara e atravessa a praça dos caldeireiros. Dia inteiro ou meio dia, como preferir.
  ar: >-
    تضم فاس البالي أكثر من 9000 زقاق، والمرشد الجيد يصنع الفرق بين متاهة وقصة. الدخول من باب بوجلود، زيارة مدرسة بوعنانية، المرور بجامع وجامعة القرويين، مشاهدة الدباغين من شرفة فوق شوارة، ثم ساحة الصفارين. يوم كامل أو نصف يوم حسب رغبتكم.
