summary:
  en: Morocco’s third-highest summit (4,071 m), from the green Aït Bouguemez valley. Long ridges, wide views and nights under canvas.
  fr: Le troisième sommet du Maroc (4 071 m), depuis la verte vallée des Aït Bouguemez. Longues crêtes, grands horizons et nuits sous tente.
  es: La tercera cumbre de Marruecos (4071 m), desde el verde valle de los Aït Bouguemez. Largas crestas, grandes vistas y noches en tienda.
  de: Marokkos dritthöchster Gipfel (4.071 m), vom grünen Tal der Aït Bouguemez aus. Lange Grate, weite Ausblicke und Nächte im Zelt.
  pt: O terceiro cume de Marrocos (4071 m), a partir do verde vale dos Aït Bouguemez. Longas cristas, grandes vistas e noites em tenda.
  ar: ثالث أعلى قمة في المغرب (4071 م)، انطلاقا من وادي آيت بوكماز الأخضر. سلاسل طويلة ومناظر واسعة وليالٍ في الخيام.
about:
  en: >-
    The M’Goun is a huge whaleback ridge in the Central High Atlas, far from Marrakech and far from the crowds. You start in the Aït Bouguemez, the "happy valley", climb to the Tarkeddit plateau and reach the summit along a long ridge with views over half of Morocco. A trek for walkers who like space and silence.
  fr: >-
    Le M’Goun est une immense crête en dos de baleine dans le Haut Atlas central, loin de Marrakech et loin de la foule. Départ de la vallée des Aït Bouguemez, la « vallée heureuse », montée au plateau de Tarkeddit et sommet par une longue crête avec vue sur la moitié du Maroc. Un trek pour ceux qui aiment l’espace et le silence.
  es: El M’Goun es una enorme cresta en forma de lomo de ballena en el Alto Atlas central, lejos de Marrakech y de la multitud. Empieza en los Aït Bouguemez, el «valle feliz», sube a la meseta de Tarkeddit y alcanza la cumbre por una larga cresta con vistas sobre medio Marruecos. Un trek para quienes aman el espacio y el silencio.
  de: Der M’Goun ist ein gewaltiger Walrücken im Zentralen Hohen Atlas, weit weg von Marrakesch und vom Trubel. Sie starten im Aït-Bouguemez-Tal, dem „glücklichen Tal“, steigen zur Hochebene von Tarkeddit auf und erreichen den Gipfel über einen langen Grat mit Blick über halb Marokko. Ein Trek für alle, die Weite und Stille lieben.
  pt: O M’Goun é uma enorme crista em forma de dorso de baleia no Alto Atlas central, longe de Marraquexe e das multidões. Começa nos Aït Bouguemez, o «vale feliz», sobe ao planalto de Tarkeddit e chega ao cume por uma longa crista com vista sobre meio Marrocos. Um trekking para quem gosta de espaço e de silêncio.
  ar: >-
    جبل مكون سلسلة ضخمة في الأطلس الكبير الأوسط، بعيدة عن مراكش وعن الزحام. تنطلقون من آيت بوكماز، "الوادي السعيد"، وتصعدون إلى هضبة تاركديت، ثم تبلغون القمة عبر سلسلة طويلة تطل على نصف المغرب. رحلة لمن يحب الفضاء والصمت.
