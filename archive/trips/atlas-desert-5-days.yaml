summary:
  en: The best of both worlds in five days. Two days of walking from Imlil with nights in the mountains, then the road over the Atlas to the Merzouga dunes.
  fr: Le meilleur des deux mondes en cinq jours. Deux jours de marche depuis Imlil avec nuits en montagne, puis la route de l’Atlas jusqu’aux dunes de Merzouga.
  es: Lo mejor de ambos mundos en cinco días. Dos días de marcha desde Imlil con noches en la montaña y luego la carretera del Atlas hasta las dunas de Merzouga.
  de: Das Beste aus beiden Welten in fünf Tagen. Zwei Wandertage ab Imlil mit Nächten in den Bergen, dann die Straße über den Atlas zu den Dünen von Merzouga.
  pt: O melhor dos dois mundos em cinco dias. Dois dias de caminhada a partir de Imlil com noites na montanha e depois a estrada do Atlas até às dunas de Merzouga.
  ar: أفضل ما في العالمين في خمسة أيام. يومان من المشي انطلاقا من إمليل مع ليالٍ في الجبل، ثم الطريق عبر الأطلس إلى كثبان مرزوكة.
about:
  en: >-
    Start where we live: two days of walking among the villages of the Imlil valleys, with a night in a guesthouse. Then the car takes you over the High Atlas to Aït Benhaddou, the Dades valley and Merzouga, where you ride camels into Erg Chebbi for a night at camp before driving back to Marrakech. Mountains, villages, kasbahs and dunes in one trip.
  fr: >-
    On commence là où nous vivons : deux jours de marche entre les villages des vallées d’Imlil, avec une nuit en gîte. Puis la voiture vous emmène par le Haut Atlas à Aït Benhaddou, la vallée du Dadès et Merzouga, où les dromadaires vous mènent dans l’erg Chebbi pour une nuit au camp avant le retour à Marrakech. Montagnes, villages, kasbahs et dunes en un seul voyage.
  es: "Empezamos donde vivimos: dos días de marcha entre los pueblos de los valles de Imlil, con una noche en una casa de huéspedes. Después el coche le lleva por el Alto Atlas a Aït Benhaddou, el valle del Dades y Merzouga, donde monta en dromedario hasta el Erg Chebbi para pasar la noche en un campamento antes de volver a Marrakech. Montañas, pueblos, kasbahs y dunas en un solo viaje."
  de: "Wir beginnen dort, wo wir leben: zwei Wandertage zwischen den Dörfern der Täler um Imlil, mit einer Nacht im Gästehaus. Dann bringt Sie das Auto über den Hohen Atlas nach Aït Benhaddou, ins Dadès-Tal und nach Merzouga, wo Sie mit Kamelen in den Erg Chebbi reiten und im Camp übernachten, bevor es zurück nach Marrakesch geht. Berge, Dörfer, Kasbahs und Dünen auf einer Reise."
  pt: "Começamos onde vivemos: dois dias de caminhada entre as aldeias dos vales de Imlil, com uma noite numa casa de hóspedes. Depois o carro leva-o pelo Alto Atlas até Aït Benhaddou, ao vale do Dadès e a Merzouga, onde segue de dromedário até ao Erg Chebbi para uma noite no acampamento antes de regressar a Marraquexe. Montanhas, aldeias, kasbahs e dunas numa só viagem."
  ar: >-
    نبدأ حيث نعيش: يومان من المشي بين قرى وديان إمليل مع ليلة في دار ضيافة. ثم تأخذكم السيارة عبر الأطلس الكبير إلى آيت بن حدو ووادي دادس ومرزوكة، حيث تركبون الجمال إلى عرق الشبي لقضاء ليلة في المخيم قبل العودة إلى مراكش. جبال وقرى وقصبات وكثبان في رحلة واحدة.
