summary:
  en: A gentler way to reach Lake Ifni, from the south side of the Toubkal massif. Village life in Amsouzart and a night by the lake.
  fr: Une façon plus douce de rejoindre le lac d’Ifni, par le versant sud du Toubkal. La vie du village à Amsouzart et une nuit au bord du lac.
  es: Una forma más suave de llegar al lago Ifni, por la vertiente sur del macizo del Toubkal. Vida de pueblo en Amsouzart y una noche junto al lago.
  de: Ein sanfterer Weg zum Ifni-See, von der Südseite des Toubkal-Massivs. Dorfleben in Amsouzart und eine Nacht am See.
  pt: Uma forma mais suave de chegar ao lago Ifni, pela vertente sul do maciço do Toubkal. Vida de aldeia em Amsouzart e uma noite junto ao lago.
  ar: طريقة أسهل للوصول إلى بحيرة إفني من الجهة الجنوبية لجبال توبقال. حياة القرية في أمسوزارت وليلة بجانب البحيرة.
about:
  en: >-
    Amsouzart sits on the southern side of the Toubkal massif, far from the busy Imlil trails. After a scenic drive you spend the first night in a village guesthouse, walk up the valley the next day to Lake Ifni and sleep by the water, then walk back down and drive to Marrakech. Moderate days, big landscapes and very few other walkers.
  fr: >-
    Amsouzart se trouve sur le versant sud du massif du Toubkal, loin des sentiers fréquentés d’Imlil. Après une belle route, première nuit dans un gîte du village ; le lendemain, montée dans la vallée jusqu’au lac d’Ifni et nuit au bord de l’eau ; puis descente et retour à Marrakech. Des journées modérées, de grands paysages et très peu de marcheurs.
  es: Amsouzart está en la vertiente sur del macizo del Toubkal, lejos de los senderos concurridos de Imlil. Tras una carretera preciosa, la primera noche es en una casa de huéspedes del pueblo; al día siguiente se sube por el valle hasta el lago Ifni y se duerme junto al agua, y después se baja y se vuelve a Marrakech. Jornadas moderadas, grandes paisajes y muy pocos caminantes.
  de: Amsouzart liegt auf der Südseite des Toubkal-Massivs, fern der belebten Wege um Imlil. Nach einer schönen Fahrt verbringen Sie die erste Nacht in einem Gästehaus im Dorf, wandern am nächsten Tag das Tal hinauf zum Ifni-See und übernachten am Wasser, dann geht es zurück und nach Marrakesch. Moderate Etappen, weite Landschaften und kaum andere Wanderer.
  pt: Amsouzart fica na vertente sul do maciço do Toubkal, longe dos trilhos movimentados de Imlil. Depois de uma estrada bonita, a primeira noite é numa casa de hóspedes da aldeia; no dia seguinte sobe o vale até ao lago Ifni e dorme junto à água; depois desce e regressa a Marraquexe. Etapas moderadas, grandes paisagens e muito poucos caminhantes.
  ar: >-
    تقع أمسوزارت في الجهة الجنوبية لجبال توبقال بعيدا عن مسالك إمليل المزدحمة. بعد طريق جميل تقضون الليلة الأولى في دار ضيافة بالقرية، وفي اليوم الموالي تصعدون الوادي إلى بحيرة إفني وتبيتون بجانب الماء، ثم تنزلون وتعودون إلى مراكش. أيام معتدلة ومناظر واسعة وقلة من المتنزهين.
