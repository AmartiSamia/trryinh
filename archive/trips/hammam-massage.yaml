summary:
  en: The Moroccan way to rest after a trek or a day in the souks. Steam, black soap, a full scrub with the kessa glove, then an argan oil massage.
  fr: La façon marocaine de se reposer après un trek ou une journée dans les souks. Vapeur, savon noir, gommage au gant kessa, puis massage à l’huile d’argan.
  es: La forma marroquí de descansar tras un trek o un día en los zocos. Vapor, jabón negro, exfoliación completa con el guante kessa y masaje con aceite de argán.
  de: Die marokkanische Art, sich nach einem Trek oder einem Tag in den Souks zu erholen. Dampf, schwarze Seife, ein gründliches Peeling mit dem Kessa-Handschuh und eine Massage mit Arganöl.
  pt: A forma marroquina de descansar depois de um trekking ou de um dia nos souks. Vapor, sabão preto, esfoliação completa com a luva kessa e massagem com óleo de argão.
  ar: الطريقة المغربية للاسترخاء بعد رحلة مشي أو يوم في الأسواق. البخار، الصابون البلدي، التكسيل بالكيس، ثم تدليك بزيت الأركان.
about:
  en: >-
    We book you into a clean, well-run hammam in the medina. An attendant takes you through the steam rooms, washes you with black soap and scrubs you head to toe, then you relax with mint tea before a massage with argan oil. Separate spaces for women and men; couples’ rooms on request.
  fr: >-
    Nous vous réservons un hammam propre et bien tenu dans la médina. Une préposée ou un préposé vous accompagne dans les salles de vapeur, vous lave au savon noir et vous gomme de la tête aux pieds, puis vous vous détendez avec un thé avant un massage à l’huile d’argan. Espaces séparés femmes et hommes ; cabines pour couples sur demande.
  es: Le reservamos un hammam limpio y bien llevado en la medina. Una persona le acompaña por las salas de vapor, le lava con jabón negro y le exfolia de pies a cabeza; después se relaja con un té a la menta antes de un masaje con aceite de argán. Espacios separados para mujeres y hombres; cabinas para parejas bajo petición.
  de: Wir buchen für Sie einen sauberen, gut geführten Hammam in der Medina. Eine Betreuerin oder ein Betreuer begleitet Sie durch die Dampfräume, wäscht Sie mit schwarzer Seife und peelt Sie von Kopf bis Fuß; danach entspannen Sie bei Minztee vor einer Massage mit Arganöl. Getrennte Bereiche für Frauen und Männer; Paarkabinen auf Anfrage.
  pt: Reservamos-lhe um hammam limpo e bem gerido na medina. Uma pessoa acompanha-o pelas salas de vapor, lava-o com sabão preto e esfolia-o da cabeça aos pés; depois relaxa com chá de menta antes de uma massagem com óleo de argão. Espaços separados para mulheres e homens; cabines para casais a pedido.
  ar: >-
    نحجز لكم في حمام نظيف ومنظم في المدينة العتيقة. يرافقكم مختص أو مختصة في غرف البخار، ويغسلكم بالصابون البلدي ويكسّلكم من الرأس إلى القدمين، ثم تسترخون مع كأس شاي قبل التدليك بزيت الأركان. فضاءات منفصلة للنساء والرجال، وغرف للأزواج عند الطلب.
