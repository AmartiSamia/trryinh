title:
  en: Hot-air balloon flight at sunrise
  fr: Vol en montgolfière au lever du soleil
  es: Vuelo en globo al amanecer
  de: Heißluftballonfahrt bei Sonnenaufgang
  pt: Voo de balão ao nascer do sol
  ar: رحلة بالمنطاد عند شروق الشمس
summary:
  en: Float over the villages and fields north of Marrakech as the sun comes up over the Atlas. About one hour in the air, then breakfast in a Berber tent.
  fr: Survolez les villages et les champs au nord de Marrakech pendant que le soleil se lève sur l’Atlas. Environ une heure de vol, puis petit-déjeuner sous une tente berbère.
  es: Sobrevuele los pueblos y campos al norte de Marrakech mientras sale el sol sobre el Atlas. Una hora de vuelo aproximadamente y después desayuno en una jaima bereber.
  de: Schweben Sie über Dörfer und Felder nördlich von Marrakesch, während die Sonne über dem Atlas aufgeht. Etwa eine Stunde in der Luft, danach Frühstück in einem Berberzelt.
  pt: Sobrevoe as aldeias e os campos a norte de Marraquexe enquanto o sol nasce sobre o Atlas. Cerca de uma hora no ar e depois pequeno-almoço numa tenda berbere.
  ar: حلّقوا فوق القرى والحقول شمال مراكش بينما تشرق الشمس فوق الأطلس. حوالي ساعة في الجو، ثم فطور في خيمة أمازيغية.
about:
  en: >-
    A very early pickup takes you to the launch site outside the city. While the balloon is inflated you have tea; then you rise slowly to watch the sun light up the Jbilet hills and the snowy High Atlas. After landing, a traditional breakfast and a certificate. Flights are run by a licensed balloon company; we organise the booking and the transfer.
  fr: >-
    Prise en charge très matinale vers le site de décollage hors de la ville. Thé pendant le gonflage, puis montée lente pour voir le soleil éclairer les collines des Jbilet et le Haut Atlas enneigé. Après l’atterrissage, petit-déjeuner traditionnel et certificat. Les vols sont assurés par une compagnie agréée ; nous organisons la réservation et le transfert.
  es: Una recogida muy temprana le lleva al lugar de despegue a las afueras de la ciudad. Mientras se infla el globo toma un té; después sube despacio para ver cómo el sol ilumina las colinas de Jbilet y el Alto Atlas nevado. Tras el aterrizaje, desayuno tradicional y certificado. Los vuelos los realiza una compañía de globos autorizada; nosotros organizamos la reserva y el traslado.
  de: Eine sehr frühe Abholung bringt Sie zum Startplatz außerhalb der Stadt. Während der Ballon gefüllt wird, gibt es Tee; dann steigen Sie langsam auf und sehen, wie die Sonne die Jbilet-Hügel und den verschneiten Hohen Atlas erleuchtet. Nach der Landung ein traditionelles Frühstück und eine Urkunde. Die Fahrten führt ein lizenziertes Ballonunternehmen durch; wir organisieren Buchung und Transfer.
  pt: Uma recolha muito cedo leva-o ao local de descolagem fora da cidade. Enquanto o balão enche, bebe um chá; depois sobe devagar para ver o sol iluminar as colinas de Jbilet e o Alto Atlas nevado. Depois da aterragem, pequeno-almoço tradicional e certificado. Os voos são feitos por uma empresa de balões licenciada; nós tratamos da reserva e do transfer.
  ar: >-
    يتم استقبالكم في وقت مبكر جدا إلى موقع الإقلاع خارج المدينة. تشربون الشاي أثناء نفخ المنطاد، ثم ترتفعون ببطء لمشاهدة الشمس تضيء تلال الجبيلات والأطلس الكبير المثلج. بعد الهبوط، فطور تقليدي وشهادة. تُنظَّم الرحلات من طرف شركة منطاد مرخصة، ونحن نتكفل بالحجز والنقل.
