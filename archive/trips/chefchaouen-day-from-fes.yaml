title:
  en: Chefchaouen day trip from Fes
  fr: Excursion à Chefchaouen depuis Fès
  es: Excursión a Chefchaouen desde Fez
  de: Tagesausflug nach Chefchaouen ab Fès
  pt: Excursão a Chefchaouen desde Fez
  ar: رحلة يومية إلى شفشاون من فاس
summary:
  en: The blue town of the Rif mountains. A day of free wandering in Chefchaouen’s painted lanes, with a viewpoint walk to the Spanish mosque at sunset.
  fr: La ville bleue des montagnes du Rif. Une journée libre dans les ruelles peintes de Chefchaouen, avec une marche jusqu’à la mosquée espagnole au coucher du soleil.
  es: El pueblo azul de las montañas del Rif. Un día libre por las callejuelas pintadas de Chefchaouen, con un paseo al mirador de la mezquita española al atardecer.
  de: Die blaue Stadt im Rifgebirge. Ein freier Tag in den bemalten Gassen von Chefchaouen, mit einem Spaziergang zur spanischen Moschee zum Sonnenuntergang.
  pt: A cidade azul das montanhas do Rif. Um dia livre pelas ruelas pintadas de Chefchaouen, com um passeio até ao miradouro da mesquita espanhola ao pôr do sol.
  ar: المدينة الزرقاء في جبال الريف. يوم حر في أزقة شفشاون الملونة، مع مشي إلى المسجد الإسباني عند الغروب.
about:
  en: >-
    About three and a half hours from Fes through olive groves and the Rif foothills. In Chefchaouen you have the day to explore the blue medina, the kasbah and the Outa el-Hammam square, and to walk up to the Spanish mosque for the view. Drive back to Fes in the evening.
  fr: >-
    Environ trois heures et demie depuis Fès, à travers oliveraies et contreforts du Rif. À Chefchaouen, la journée est à vous pour explorer la médina bleue, la kasbah et la place Outa el-Hammam, et monter à la mosquée espagnole pour la vue. Retour à Fès le soir.
  es: Unas tres horas y media desde Fez entre olivares y las estribaciones del Rif. En Chefchaouen tiene el día para descubrir la medina azul, la kasbah y la plaza Outa el-Hammam, y subir a la mezquita española para disfrutar de la vista. Regreso a Fez por la noche.
  de: Etwa dreieinhalb Stunden von Fès durch Olivenhaine und die Ausläufer des Rif. In Chefchaouen haben Sie den Tag, um die blaue Medina, die Kasbah und den Platz Outa el-Hammam zu entdecken und zur spanischen Moschee mit Aussicht hinaufzugehen. Abends Rückfahrt nach Fès.
  pt: Cerca de três horas e meia desde Fez, entre olivais e o sopé do Rif. Em Chefchaouen tem o dia para descobrir a medina azul, a kasbah e a praça Outa el-Hammam, e subir à mesquita espanhola para ver a vista. Regresso a Fez à noite.
  ar: >-
    حوالي ثلاث ساعات ونصف من فاس عبر حقول الزيتون وسفوح الريف. في شفشاون لديكم اليوم لاستكشاف المدينة الزرقاء والقصبة وساحة وطاء الحمام، والصعود إلى المسجد الإسباني للاستمتاع بالمنظر. العودة إلى فاس مساءً.
