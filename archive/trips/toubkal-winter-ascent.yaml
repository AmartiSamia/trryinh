goodToKnow:
  - en: "You need rigid or semi-rigid mountain boots that take crampons. Tell us your shoe size if you need to rent."
    fr: "Il faut des chaussures de montagne rigides ou semi-rigides compatibles crampons. Donnez-nous votre pointure pour une location."
    es: Necesita botas de montaña rígidas o semirrígidas que admitan crampones. Díganos su talla si necesita alquilarlas.
    de: Sie brauchen steigeisenfeste, steife oder halbsteife Bergschuhe. Nennen Sie uns Ihre Schuhgröße, wenn Sie welche mieten möchten.
    pt: Precisa de botas de montanha rígidas ou semirrígidas compatíveis com crampons. Diga-nos o seu número se precisar de alugar.
    ar: "تحتاجون إلى أحذية جبلية صلبة أو نصف صلبة تقبل المسامير الثلجية. أخبرونا بمقاس حذائكم إذا أردتم الكراء."
  - en: "Winter plans depend on snow and avalanche conditions. The guide may change the route or the day."
    fr: "Le programme d’hiver dépend de la neige et du risque d’avalanche. Le guide peut changer l’itinéraire ou le jour."
    es: El programa de invierno depende de la nieve y del riesgo de aludes. El guía puede cambiar la ruta o el día.
    de: Das Winterprogramm hängt von Schnee- und Lawinenlage ab. Der Guide kann Route oder Tag ändern.
    pt: O programa de inverno depende da neve e do risco de avalanche. O guia pode mudar o percurso ou o dia.
    ar: "يعتمد البرنامج الشتوي على حالة الثلج وخطر الانهيارات. قد يغير المرشد المسار أو اليوم."
