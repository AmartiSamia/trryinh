summary:
  en: Toubkal under snow, with crampons and ice axe and a guide who knows the mountain in winter. Short initiation to snow techniques at the refuge.
  fr: Le Toubkal sous la neige, avec crampons et piolet et un guide qui connaît la montagne en hiver. Courte initiation aux techniques de neige au refuge.
  es: El Toubkal nevado, con crampones y piolet y un guía que conoce la montaña en invierno. Breve iniciación a las técnicas de nieve en el refugio.
  de: Der Toubkal im Schnee, mit Steigeisen, Eispickel und einem Guide, der den Berg im Winter kennt. Kurze Einführung in Schneetechniken an der Hütte.
  pt: O Toubkal com neve, com crampons, piolet e um guia que conhece a montanha no inverno. Breve iniciação às técnicas de neve no refúgio.
  ar: توبقال تحت الثلج، بالمسامير الثلجية وفأس الجليد ومرشد يعرف الجبل في الشتاء. تدريب قصير على تقنيات الثلج في الملجأ.
about:
  en: >-
    From December to March the High Atlas turns white and Toubkal becomes a real winter climb. The route is the same as in summer, but the slopes above the refuge are covered in hard snow, so you walk with crampons and carry an ice axe. On arrival at the refuge your guide checks the gear and practises the basics with you: walking in crampons, using the axe, stopping a slip. Days are shorter and colder, so the pace and the turn-back time are set by the guide.
  fr: >-
    De décembre à mars, le Haut Atlas devient blanc et le Toubkal une vraie ascension hivernale. L’itinéraire est le même qu’en été, mais au-dessus du refuge les pentes sont couvertes de neige dure : on marche en crampons, piolet en main. À l’arrivée au refuge, votre guide vérifie le matériel et revoit avec vous les bases : marche en crampons, usage du piolet, arrêt d’une glissade. Les journées sont plus courtes et plus froides ; le rythme et l’heure de demi-tour sont fixés par le guide.
  es: "De diciembre a marzo el Alto Atlas se vuelve blanco y el Toubkal se convierte en una auténtica ascensión invernal. La ruta es la misma que en verano, pero las laderas por encima del refugio están cubiertas de nieve dura: se camina con crampones y se lleva piolet. Al llegar al refugio su guía revisa el material y practica con usted lo básico: andar con crampones, usar el piolet y detener un resbalón. Los días son más cortos y fríos, así que el ritmo y la hora de dar la vuelta los marca el guía."
  de: "Von Dezember bis März wird der Hohe Atlas weiß und der Toubkal zu einer echten Winterbesteigung. Die Route ist dieselbe wie im Sommer, doch oberhalb der Hütte liegen die Hänge unter hartem Schnee: Sie gehen mit Steigeisen und tragen einen Eispickel. An der Hütte prüft Ihr Guide die Ausrüstung und übt mit Ihnen die Grundlagen: Gehen mit Steigeisen, Umgang mit dem Pickel, einen Rutsch stoppen. Die Tage sind kürzer und kälter, deshalb bestimmt der Guide Tempo und Umkehrzeit."
  pt: "De dezembro a março o Alto Atlas fica branco e o Toubkal torna-se uma verdadeira subida de inverno. O percurso é o mesmo do verão, mas as encostas acima do refúgio estão cobertas de neve dura: caminha-se com crampons e leva-se piolet. Ao chegar ao refúgio, o guia verifica o equipamento e treina consigo o básico: andar com crampons, usar o piolet e travar um escorregão. Os dias são mais curtos e frios, por isso o ritmo e a hora de regresso são definidos pelo guia."
  ar: >-
    من دجنبر إلى مارس يكتسي الأطلس الكبير باللون الأبيض ويصبح صعود توبقال تسلقا شتويا حقيقيا. المسار هو نفسه كما في الصيف، لكن المنحدرات فوق الملجأ مغطاة بثلج صلب، فتمشون بالمسامير الثلجية وتحملون فأس الجليد. عند الوصول إلى الملجأ يتحقق المرشد من المعدات ويتدرب معكم على الأساسيات: المشي بالمسامير، استعمال الفأس، وإيقاف الانزلاق. الأيام أقصر وأبرد، لذلك يحدد المرشد الإيقاع ووقت العودة.
