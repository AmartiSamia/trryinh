# Site-wide FAQ. `home: true` shows the question on the home page.
# TODO(review-ar): Arabic answers need a native review.
# TODO(youssef): payment, deposit, cancellation, children and group-size answers
#   are written to stay true without the numbers. Add the real figures when known.

- id: how-to-book
  group: booking
  home: true
  q: { en: "How do I book a trip?", fr: "Comment réserver un voyage ?", es: "¿Cómo reservo un viaje?", de: "Wie buche ich eine Reise?", pt: "Como reservo uma viagem?", ar: "كيف أحجز رحلة؟" }
  a:
    en: "Choose a trip, pick your date and the number of travellers, then send the request on WhatsApp or by email. We check availability and reply with the final price. Nothing is paid online."
    fr: "Choisissez un voyage, une date et le nombre de voyageurs, puis envoyez la demande par WhatsApp ou par e-mail. Nous vérifions la disponibilité et vous répondons avec le prix final. Rien n’est payé en ligne."
    es: Elija un viaje, la fecha y el número de viajeros, y envíe la solicitud por WhatsApp o por correo. Comprobamos la disponibilidad y respondemos con el precio final. No se paga nada en línea.
    de: Wählen Sie eine Reise, Ihr Datum und die Zahl der Reisenden und senden Sie die Anfrage per WhatsApp oder E-Mail. Wir prüfen die Verfügbarkeit und antworten mit dem Endpreis. Online wird nichts bezahlt.
    pt: Escolha uma viagem, a data e o número de viajantes e envie o pedido pelo WhatsApp ou por e-mail. Verificamos a disponibilidade e respondemos com o preço final. Nada é pago online.
    ar: "اختاروا الرحلة والتاريخ وعدد المسافرين، ثم أرسلوا الطلب عبر واتساب أو البريد الإلكتروني. نتحقق من التوفر ونجيبكم بالسعر النهائي. لا يتم أي دفع عبر الإنترنت."

- id: how-fast
  group: booking
  q: { en: "How quickly will I get an answer?", fr: "En combien de temps aurai-je une réponse ?", es: "¿Cuándo recibiré respuesta?", de: "Wie schnell bekomme ich eine Antwort?", pt: "Quanto tempo demoram a responder?", ar: "متى سأتلقى الرد؟" }
  a:
    en: "Usually within a few hours on WhatsApp, every day of the week. In the mountains the network can drop for a while; we reply as soon as we are back in range."
    fr: "En général en quelques heures sur WhatsApp, tous les jours. En montagne, le réseau peut couper un moment ; nous répondons dès que nous captons."
    es: Normalmente en pocas horas por WhatsApp, todos los días de la semana. En la montaña la cobertura puede caer un rato; respondemos en cuanto volvemos a tener señal.
    de: Meist innerhalb weniger Stunden auf WhatsApp, an jedem Tag der Woche. In den Bergen kann das Netz eine Weile ausfallen; wir antworten, sobald wir wieder Empfang haben.
    pt: Normalmente poucas horas no WhatsApp, todos os dias da semana. Na montanha a rede pode falhar durante algum tempo; respondemos assim que voltamos a ter sinal.
    ar: "عادة في غضون ساعات قليلة على واتساب، كل أيام الأسبوع. في الجبل قد تنقطع الشبكة لبعض الوقت، فنرد بمجرد عودة التغطية."

- id: private-shared
  group: booking
  home: true
  q: { en: "What is the difference between shared and private?", fr: "Quelle différence entre partagé et privé ?", es: "¿Qué diferencia hay entre compartido y privado?", de: "Was ist der Unterschied zwischen Gruppe und privat?", pt: "Qual é a diferença entre partilhada e privada?", ar: "ما الفرق بين الرحلة المشتركة والخاصة؟" }
  a:
    en: "On a shared trip you travel with other guests in a small group, which keeps the price low. A private trip is just your own group, minimum 6 people, with your own guide and more freedom on timing."
    fr: "En partagé, vous voyagez en petit groupe avec d’autres voyageurs, ce qui garde un prix bas. Le voyage privé est réservé à votre groupe, 6 personnes minimum, avec votre propre guide et plus de liberté sur les horaires."
    es: "En un viaje compartido viaja con otros viajeros en un grupo pequeño, lo que mantiene el precio bajo. Un viaje privado es solo para su grupo, mínimo 6 personas, con su propio guía y más libertad de horarios."
    de: "Bei einer Gruppenreise reisen Sie mit anderen Gästen in einer kleinen Gruppe, das hält den Preis niedrig. Eine Privatreise ist nur für Ihre Gruppe, mindestens 6 Personen, mit eigenem Guide und mehr Freiheit bei den Zeiten."
    pt: "Numa viagem partilhada viaja com outros viajantes num grupo pequeno, o que mantém o preço baixo. Uma viagem privada é só para o seu grupo, mínimo 6 pessoas, com o seu próprio guia e mais liberdade de horários."
    ar: "في الرحلة المشتركة تسافرون مع ضيوف آخرين في مجموعة صغيرة، مما يبقي السعر منخفضا. أما الرحلة الخاصة فهي لمجموعتكم فقط، 6 أشخاص على الأقل، مع مرشد خاص ومرونة أكبر في المواعيد."

- id: group-size
  group: booking
  q: { en: "How big are the groups?", fr: "Quelle est la taille des groupes ?", es: "¿De qué tamaño son los grupos?", de: "Wie groß sind die Gruppen?", pt: "De que tamanho são os grupos?", ar: "ما حجم المجموعات؟" }
  a:
    en: "Small. The exact maximum depends on the trip and is confirmed when you book. Ask us if you want to know who else is on your date."
    fr: "Petite. Le maximum exact dépend du voyage et est confirmé à la réservation. Demandez-nous si vous voulez savoir qui d’autre est inscrit à votre date."
    es: Pequeños. El máximo exacto depende del viaje y se confirma al reservar. Pregúntenos si quiere saber quién más va en su fecha.
    de: Klein. Die genaue Höchstzahl hängt von der Reise ab und wird bei der Buchung bestätigt. Fragen Sie uns, wenn Sie wissen möchten, wer an Ihrem Termin noch dabei ist.
    pt: Pequenos. O máximo exato depende da viagem e é confirmado na reserva. Pergunte-nos se quiser saber quem mais vai na sua data.
    ar: "صغير. الحد الأقصى بالضبط يختلف حسب الرحلة ويُؤكَّد عند الحجز. اسألونا إذا أردتم معرفة من سيكون معكم في نفس التاريخ."

- id: payment
  group: payment
  home: true
  q: { en: "How and when do I pay?", fr: "Comment et quand payer ?", es: "¿Cómo y cuándo pago?", de: "Wie und wann bezahle ich?", pt: "Como e quando pago?", ar: "كيف ومتى أدفع؟" }
  a:
    en: "Nothing is paid on this website. When we confirm your trip we send you the final price and how to pay. Ask us for a written quote first if you need one."
    fr: "Rien ne se paie sur ce site. Quand nous confirmons votre voyage, nous vous indiquons le prix final et le mode de paiement. Demandez-nous un devis écrit si besoin."
    es: En esta web no se paga nada. Cuando confirmamos su viaje le enviamos el precio final y la forma de pago. Pídanos antes un presupuesto por escrito si lo necesita.
    de: Auf dieser Website wird nichts bezahlt. Wenn wir Ihre Reise bestätigen, senden wir Ihnen den Endpreis und die Zahlungsweise. Fragen Sie uns vorab nach einem schriftlichen Angebot, wenn Sie eines brauchen.
    pt: Neste site não se paga nada. Quando confirmamos a sua viagem, enviamos o preço final e a forma de pagamento. Peça-nos primeiro um orçamento por escrito, se precisar.
    ar: "لا يتم أي دفع على هذا الموقع. عندما نؤكد رحلتكم نرسل لكم السعر النهائي وطريقة الدفع. اطلبوا منا عرض سعر مكتوبا إذا احتجتم."

- id: cancellation
  group: payment
  q: { en: "What if I need to cancel?", fr: "Et si je dois annuler ?", es: "¿Y si tengo que cancelar?", de: "Was, wenn ich stornieren muss?", pt: "E se tiver de cancelar?", ar: "ماذا لو اضطررت إلى الإلغاء؟" }
  a:
    en: "Cancellation is free up to 48 hours before departure, and anything you have paid is refunded in full. Just tell us on WhatsApp or by email. If we have to cancel for weather or safety, we offer you another date."
    fr: "L’annulation est gratuite jusqu’à 48 heures avant le départ, et tout ce que vous avez payé vous est intégralement remboursé. Prévenez-nous simplement par WhatsApp ou e-mail. Si nous devons annuler pour la météo ou la sécurité, nous vous proposons une autre date."
    es: "La cancelación es gratuita hasta 48 horas antes de la salida, y le devolvemos íntegramente lo que haya pagado. Solo avísenos por WhatsApp o por correo. Si tenemos que cancelar por el tiempo o por seguridad, le proponemos otra fecha."
    de: "Die Stornierung ist bis 48 Stunden vor Abreise kostenlos, und alles, was Sie bezahlt haben, wird vollständig erstattet. Sagen Sie uns einfach per WhatsApp oder E-Mail Bescheid. Müssen wir wegen Wetter oder Sicherheit absagen, bieten wir Ihnen einen anderen Termin an."
    pt: "O cancelamento é gratuito até 48 horas antes da partida, e devolvemos na íntegra tudo o que tiver pago. Basta avisar-nos pelo WhatsApp ou por e-mail. Se tivermos de cancelar por causa do tempo ou da segurança, propomos-lhe outra data."
    ar: "الإلغاء مجاني حتى 48 ساعة قبل الانطلاق، ونرد لكم كامل المبلغ الذي دفعتموه. يكفي أن تخبرونا عبر واتساب أو البريد الإلكتروني. إذا اضطررنا إلى الإلغاء بسبب الطقس أو السلامة، نقترح عليكم تاريخا آخر."

- id: fitness
  group: safety
  home: true
  q: { en: "Am I fit enough for Toubkal?", fr: "Suis-je assez en forme pour le Toubkal ?", es: "¿Estoy en forma para el Toubkal?", de: "Bin ich fit genug für den Toubkal?", pt: "Tenho forma física suficiente para o Toubkal?", ar: "هل لياقتي كافية لصعود توبقال؟" }
  a:
    en: "If you can walk 6 hours on hills with breaks, you can usually reach the summit. The hard part is the long summit day and the altitude, not technique. Tell us about your experience and we will advise you honestly."
    fr: "Si vous pouvez marcher 6 h en dénivelé avec des pauses, vous pouvez en général atteindre le sommet. Le plus dur, c’est la longue journée du sommet et l’altitude, pas la technique. Parlez-nous de votre expérience, nous vous conseillerons honnêtement."
    es: Si puede caminar 6 horas por terreno con desnivel haciendo pausas, normalmente puede llegar a la cumbre. Lo difícil es el largo día de cumbre y la altitud, no la técnica. Cuéntenos su experiencia y le aconsejaremos con sinceridad.
    de: Wenn Sie mit Pausen 6 Stunden in hügeligem Gelände gehen können, erreichen Sie meist den Gipfel. Schwierig sind der lange Gipfeltag und die Höhe, nicht die Technik. Erzählen Sie uns von Ihrer Erfahrung, wir beraten Sie ehrlich.
    pt: Se consegue caminhar 6 horas em terreno com desnível, com pausas, em geral consegue chegar ao cume. O difícil é o longo dia do cume e a altitude, não a técnica. Fale-nos da sua experiência e aconselhamo-lo com honestidade.
    ar: "إذا كنتم تستطيعون المشي 6 ساعات في مرتفعات مع استراحات، فيمكنكم عادة بلوغ القمة. الصعب هو يوم القمة الطويل والارتفاع، وليس التقنية. أخبرونا بخبرتكم وسننصحكم بصدق."

- id: safety-guide
  group: safety
  q: { en: "Who guides the treks?", fr: "Qui encadre les treks ?", es: "¿Quién guía los treks?", de: "Wer führt die Treks?", pt: "Quem guia os trekkings?", ar: "من يرافق رحلات المشي؟" }
  a:
    en: "Our treks are led by mountain guides from the Imlil valleys with more than 12 years of experience on these trails. The guide decides on safety: if the weather or the group is not right for the summit, you turn back."
    fr: "Nos treks sont encadrés par des guides de montagne des vallées d’Imlil, qui ont plus de 12 ans d’expérience sur ces sentiers. Le guide décide pour la sécurité : si la météo ou le groupe ne permettent pas le sommet, on fait demi-tour."
    es: "Nuestros treks los dirigen guías de montaña de los valles de Imlil con más de 12 años de experiencia en estos senderos. El guía decide sobre la seguridad: si el tiempo o el grupo no permiten la cumbre, se da la vuelta."
    de: "Unsere Treks werden von Bergführern aus den Tälern um Imlil geführt, die über 12 Jahre Erfahrung auf diesen Wegen haben. Der Guide entscheidet über die Sicherheit: Passen Wetter oder Gruppe nicht für den Gipfel, kehren Sie um."
    pt: "Os nossos trekkings são guiados por guias de montanha dos vales de Imlil com mais de 12 anos de experiência nestes trilhos. O guia decide sobre a segurança: se o tempo ou o grupo não permitirem o cume, volta-se para trás."
    ar: "يقود رحلاتنا مرشدون جبليون من وديان إمليل بخبرة تتجاوز 12 سنة في هذه المسالك. المرشد هو من يقرر في أمور السلامة: إذا لم يكن الطقس أو حالة المجموعة مناسبين للقمة، نعود أدراجنا."

- id: insurance
  group: safety
  q: { en: "Do I need travel insurance?", fr: "Faut-il une assurance voyage ?", es: "¿Necesito un seguro de viaje?", de: "Brauche ich eine Reiseversicherung?", pt: "Preciso de seguro de viagem?", ar: "هل أحتاج إلى تأمين سفر؟" }
  a:
    en: "Yes, we strongly recommend insurance that covers trekking up to 4,200 m and medical evacuation."
    fr: "Oui, nous recommandons vivement une assurance couvrant le trek jusqu’à 4 200 m et l’évacuation médicale."
    es: Sí, recomendamos encarecidamente un seguro que cubra el trekking hasta 4200 m y la evacuación médica.
    de: Ja, wir empfehlen dringend eine Versicherung, die Trekking bis 4.200 m und medizinische Evakuierung abdeckt.
    pt: Sim, recomendamos vivamente um seguro que cubra trekking até 4200 m e evacuação médica.
    ar: "نعم، ننصح بشدة بتأمين يغطي المشي حتى 4200 متر والإجلاء الطبي."

- id: children-age
  group: children
  q: { en: "Can children come?", fr: "Les enfants peuvent-ils venir ?", es: "¿Pueden venir niños?", de: "Können Kinder mitkommen?", pt: "As crianças podem vir?", ar: "هل يمكن للأطفال المشاركة؟" }
  a:
    en: "Yes. The Imlil day hike and the Oukaïmeden day trip work well with children. The Toubkal summit is better for teenagers who already walk. Ask us about ages and child prices for your trip."
    fr: "Oui. La randonnée d’une journée à Imlil et l’excursion à Oukaïmeden conviennent bien aux enfants. Le sommet du Toubkal convient mieux aux adolescents qui marchent déjà. Demandez-nous pour l’âge et les prix enfants."
    es: "Sí. La caminata de un día en Imlil y la excursión a Oukaïmeden van bien con niños. La cumbre del Toubkal es más adecuada para adolescentes que ya caminan. Pregúntenos por las edades y los precios para niños."
    de: "Ja. Die Tageswanderung in Imlil und der Ausflug nach Oukaïmeden sind gut für Kinder. Der Toubkal-Gipfel eignet sich eher für Jugendliche, die schon wandern. Fragen Sie uns nach Alter und Kinderpreisen."
    pt: "Sim. A caminhada de um dia em Imlil e a excursão a Oukaïmeden são boas para crianças. O cume do Toubkal é mais indicado para adolescentes que já caminham. Pergunte-nos sobre idades e preços para crianças."
    ar: "نعم. رحلة المشي اليومية في إمليل والرحلة إلى أوكايمدن مناسبتان للأطفال. قمة توبقال أنسب للمراهقين المتعودين على المشي. اسألونا عن الأعمار وأسعار الأطفال."

- id: children-mules
  group: children
  q: { en: "What if my child gets tired on a trek?", fr: "Et si mon enfant est fatigué pendant le trek ?", es: "¿Y si mi hijo se cansa durante el trek?", de: "Und wenn mein Kind auf dem Trek müde wird?", pt: "E se o meu filho se cansar no trekking?", ar: "ماذا لو تعب طفلي خلال الرحلة؟" }
  a:
    en: "On village treks a mule can carry a tired child for part of the way. Tell us in advance so we plan for it."
    fr: "Sur les treks de villages, une mule peut porter un enfant fatigué sur une partie du chemin. Prévenez-nous pour que nous l’organisions."
    es: En los treks de pueblos, una mula puede llevar a un niño cansado parte del camino. Avísenos con antelación para organizarlo.
    de: Auf Dorftreks kann ein Maultier ein müdes Kind ein Stück tragen. Sagen Sie es uns vorher, damit wir es einplanen.
    pt: Nos trekkings entre aldeias, uma mula pode levar uma criança cansada durante parte do caminho. Avise-nos antes para organizarmos.
    ar: "في رحلات القرى يمكن لبغل أن يحمل طفلا متعبا لجزء من الطريق. أخبرونا مسبقا لنستعد لذلك."

- id: food-diet
  group: food
  q: { en: "Can you handle vegetarian or other diets?", fr: "Gérez-vous les régimes végétariens ou autres ?", es: "¿Pueden adaptarse a dietas vegetarianas u otras?", de: "Können Sie auf vegetarische oder andere Ernährung eingehen?", pt: "Conseguem adaptar-se a dietas vegetarianas ou outras?", ar: "هل يمكنكم مراعاة الأنظمة الغذائية النباتية أو غيرها؟" }
  a:
    en: "Yes. Vegetarian is easy in Morocco: tagines, couscous and salads. Tell us about allergies or other diets when you book."
    fr: "Oui. Le végétarien est facile au Maroc : tajines, couscous et salades. Signalez allergies ou autres régimes à la réservation."
    es: "Sí. Lo vegetariano es fácil en Marruecos: tajines, cuscús y ensaladas. Indíquenos alergias u otras dietas al reservar."
    de: "Ja. Vegetarisch ist in Marokko einfach: Tajines, Couscous und Salate. Nennen Sie uns Allergien oder andere Ernährungswünsche bei der Buchung."
    pt: "Sim. Comer vegetariano é fácil em Marrocos: tajines, cuscuz e saladas. Indique-nos alergias ou outras dietas na reserva."
    ar: "نعم. الطعام النباتي سهل في المغرب: الطواجن والكسكس والسلطات. أخبرونا بالحساسية أو الأنظمة الأخرى عند الحجز."

- id: food-water
  group: food
  q: { en: "Is the water safe to drink?", fr: "L’eau est-elle potable ?", es: "¿Se puede beber el agua?", de: "Kann man das Wasser trinken?", pt: "A água é potável?", ar: "هل الماء صالح للشرب؟" }
  a:
    en: "Drink bottled or filtered water. In the mountains we fill bottles at springs and treat the water; bring a refillable bottle to avoid plastic."
    fr: "Buvez de l’eau en bouteille ou filtrée. En montagne, nous remplissons aux sources et traitons l’eau ; prenez une gourde pour éviter le plastique."
    es: Beba agua embotellada o filtrada. En la montaña llenamos las botellas en manantiales y tratamos el agua; traiga una botella reutilizable para evitar el plástico.
    de: Trinken Sie Flaschenwasser oder gefiltertes Wasser. In den Bergen füllen wir die Flaschen an Quellen und bereiten das Wasser auf; bringen Sie eine nachfüllbare Flasche mit, um Plastik zu vermeiden.
    pt: Beba água engarrafada ou filtrada. Na montanha enchemos as garrafas nas nascentes e tratamos a água; traga uma garrafa reutilizável para evitar plástico.
    ar: "اشربوا ماء معبأ أو مصفى. في الجبل نملأ القوارير من العيون ونعالج الماء، فأحضروا قارورة قابلة لإعادة التعبئة لتجنب البلاستيك."

- id: weather-best
  group: weather
  q: { en: "When is the best time to visit?", fr: "Quelle est la meilleure période ?", es: "¿Cuál es la mejor época para ir?", de: "Wann ist die beste Reisezeit?", pt: "Qual é a melhor altura para ir?", ar: "ما أفضل وقت للزيارة؟" }
  a:
    en: "For Toubkal without snow, April to October. Spring and autumn are the most pleasant for walking. In winter (December–March) the summit is under snow and Oukaïmeden becomes a ski station. Imilchil is best from May to October."
    fr: "Pour le Toubkal sans neige, d’avril à octobre. Le printemps et l’automne sont les plus agréables pour marcher. En hiver (décembre–mars), le sommet est enneigé et Oukaïmeden devient une station de ski. Imilchil se visite surtout de mai à octobre."
    es: "Para el Toubkal sin nieve, de abril a octubre. La primavera y el otoño son lo más agradable para caminar. En invierno (diciembre–marzo) la cumbre está nevada y Oukaïmeden se convierte en estación de esquí. Imilchil, mejor de mayo a octubre."
    de: "Für den Toubkal ohne Schnee April bis Oktober. Frühling und Herbst sind zum Wandern am angenehmsten. Im Winter (Dezember–März) liegt der Gipfel unter Schnee und Oukaïmeden wird zum Skigebiet. Imilchil am besten von Mai bis Oktober."
    pt: "Para o Toubkal sem neve, de abril a outubro. A primavera e o outono são o mais agradável para caminhar. No inverno (dezembro–março) o cume tem neve e Oukaïmeden torna-se estância de esqui. Imilchil, melhor de maio a outubro."
    ar: "لتوبقال بدون ثلج: من أبريل إلى أكتوبر. الربيع والخريف أجمل فترات المشي. في الشتاء (دجنبر–مارس) تكون القمة مغطاة بالثلج وتصبح أوكايمدن محطة للتزلج. أفضل وقت لإملشيل من ماي إلى أكتوبر."

- id: weather-change
  group: weather
  q: { en: "What happens if the weather is bad?", fr: "Que se passe-t-il s’il fait mauvais ?", es: "¿Qué pasa si hace mal tiempo?", de: "Was passiert bei schlechtem Wetter?", pt: "O que acontece se o tempo estiver mau?", ar: "ماذا يحدث إذا كان الطقس سيئا؟" }
  a:
    en: "In the mountains the guide adapts the route or the day. If a trip cannot run safely, we offer another date; refund conditions are on our cancellation page."
    fr: "En montagne, le guide adapte l’itinéraire ou le jour. Si un voyage ne peut pas se faire en sécurité, nous proposons une autre date ; les conditions de remboursement sont sur notre page annulation."
    es: En la montaña el guía adapta la ruta o el día. Si un viaje no puede hacerse con seguridad, proponemos otra fecha; las condiciones de reembolso están en nuestra página de cancelación.
    de: In den Bergen passt der Guide Route oder Tag an. Kann eine Reise nicht sicher stattfinden, bieten wir einen anderen Termin an; die Erstattungsbedingungen stehen auf unserer Stornoseite.
    pt: Na montanha o guia adapta o percurso ou o dia. Se uma viagem não puder decorrer em segurança, propomos outra data; as condições de reembolso estão na nossa página de cancelamento.
    ar: "في الجبل يكيّف المرشد المسار أو اليوم. إذا تعذر تنظيم الرحلة بأمان، نقترح تاريخا آخر، وشروط الاسترداد موجودة في صفحة الإلغاء."
