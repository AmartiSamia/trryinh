    es: "Solo para caminantes con experiencia: se suben unos 2400 m en dos días. Si tiene dudas, elija el trek de 3 días."
    de: "Nur für erfahrene Wanderer: rund 2.400 Höhenmeter in zwei Tagen. Im Zweifel wählen Sie den 3-Tage-Trek."
    pt: "Só para caminhantes experientes: sobe cerca de 2400 m em dois dias. Em caso de dúvida, escolha o trekking de 3 dias."
    ar: "للمتنزهين ذوي الخبرة فقط: صعود حوالي 2400 متر في يومين. إذا كنتم مترددين، اختاروا رحلة الأيام الثلاثة."
