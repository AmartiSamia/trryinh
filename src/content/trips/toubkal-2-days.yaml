summary:
  en: The fast version of the Toubkal climb for fit walkers short on time. Up to the refuge on day one, summit and back to Marrakech on day two.
  fr: La version rapide de l’ascension du Toubkal pour marcheurs en forme et pressés. Montée au refuge le premier jour, sommet et retour à Marrakech le second.
  es: La versión rápida de la subida al Toubkal para caminantes en forma con poco tiempo. Subida al refugio el primer día; cumbre y vuelta a Marrakech el segundo.
  de: Die schnelle Variante des Toubkal-Aufstiegs für fitte Wanderer mit wenig Zeit. Am ersten Tag zur Hütte, am zweiten Gipfel und zurück nach Marrakesch.
  pt: A versão rápida da subida ao Toubkal para caminhantes em forma com pouco tempo. Subida ao refúgio no primeiro dia; cume e regresso a Marraquexe no segundo.
  ar: النسخة السريعة لصعود توبقال للمتنزهين ذوي اللياقة الجيدة والوقت القصير. الصعود إلى الملجأ في اليوم الأول، ثم القمة والعودة إلى مراكش في اليوم الثاني.
about:
  en: >-
    An early pickup in Marrakech gets you to Imlil for breakfast, then you walk up the Mizane valley, through the village of Aremd, to the Toubkal refuge. The next morning you leave before dawn for the summit, come back to the refuge and walk down to Imlil, where the car waits to take you back to Marrakech. Two big days: choose this version only if you walk in the mountains regularly.
  fr: >-
    Départ tôt de Marrakech pour un petit-déjeuner à Imlil, puis montée par la vallée de la Mizane, en traversant le village d’Aremd, jusqu’au refuge du Toubkal. Le lendemain, départ avant l’aube pour le sommet, retour au refuge et descente à Imlil, où la voiture vous attend pour Marrakech. Deux grosses journées : à choisir seulement si vous marchez régulièrement en montagne.
  es: "Una recogida temprana en Marrakech le lleva a Imlil para desayunar y luego sube por el valle del Mizane, atravesando el pueblo de Aremd, hasta el refugio del Toubkal. A la mañana siguiente sale antes del amanecer hacia la cumbre, vuelve al refugio y baja a Imlil, donde le espera el coche para volver a Marrakech. Dos días intensos: elija esta versión solo si camina por la montaña con regularidad."
  de: "Eine frühe Abholung in Marrakesch bringt Sie zum Frühstück nach Imlil, dann wandern Sie durch das Mizane-Tal und das Dorf Aremd zur Toubkal-Hütte. Am nächsten Morgen brechen Sie vor der Dämmerung zum Gipfel auf, kehren zur Hütte zurück und steigen nach Imlil ab, wo das Auto Sie nach Marrakesch bringt. Zwei große Tage: Wählen Sie diese Variante nur, wenn Sie regelmäßig in den Bergen wandern."
  pt: "Uma recolha cedo em Marraquexe leva-o a Imlil para o pequeno-almoço e depois sobe o vale do Mizane, atravessando a aldeia de Aremd, até ao refúgio do Toubkal. Na manhã seguinte sai antes do amanhecer para o cume, volta ao refúgio e desce a Imlil, onde o carro o espera para regressar a Marraquexe. Dois dias intensos: escolha esta versão só se caminha regularmente na montanha."
  ar: >-
    انطلاق مبكر من مراكش لتناول الفطور في إمليل، ثم الصعود عبر وادي ميزان مرورا بقرية أرمد إلى ملجأ توبقال. في الصباح الموالي تنطلقون قبل الفجر نحو القمة، ثم تعودون إلى الملجأ وتنزلون إلى إمليل حيث تنتظركم السيارة للعودة إلى مراكش. يومان شاقان: اختاروا هذه النسخة فقط إذا كنتم تمشون في الجبال بانتظام.
