summary:
  en: The legendary lakes of Isli and Tislit, high plateaus and Amazigh villages far from any crowd. Walk the land of the famous Imilchil wedding festival.
  fr: Les lacs légendaires d’Isli et de Tislit, les hauts plateaux et des villages amazighs loin de toute foule. Marchez sur la terre du célèbre moussem des fiançailles d’Imilchil.
  es: Los legendarios lagos de Isli y Tislit, mesetas altas y pueblos amazighs lejos de cualquier multitud. Camine por la tierra del famoso festival de bodas de Imilchil.
  de: Die legendären Seen Isli und Tislit, Hochebenen und Amazigh-Dörfer fernab jeder Menge. Wandern Sie im Land des berühmten Hochzeitsfestes von Imilchil.
  pt: Os lendários lagos de Isli e Tislit, planaltos e aldeias amazigh longe de qualquer multidão. Caminhe na terra do famoso festival de casamentos de Imilchil.
  ar: بحيرتا إيسلي وتيسليت الأسطوريتان، والهضاب العالية والقرى الأمازيغية بعيدا عن الزحام. امشوا في أرض موسم الخطوبة الشهير في إملشيل.
about:
  en: Imilchil sits at 2,200 m in the Eastern High Atlas, a land of wide plateaus, earth villages and two deep blue lakes. Legend says Isli and Tislit, "the groom" and "the bride", were formed by the tears of two lovers from rival tribes, and every September the region celebrates its famous wedding festival. Over four days you cross the Atlas to Imilchil, walk around both lakes with a local guide, visit villages of the Assif Melloul valley and sleep in family guesthouses, before the long, beautiful road back to Marrakech.
  fr: Imilchil se trouve à 2 200 m dans le Haut Atlas oriental, une terre de grands plateaux, de villages en terre et de deux lacs d’un bleu profond. La légende dit qu’Isli et Tislit, « le fiancé » et « la fiancée », sont nés des larmes de deux amoureux de tribus rivales, et chaque septembre la région célèbre son fameux moussem des fiançailles. En quatre jours, vous traversez l’Atlas jusqu’à Imilchil, marchez autour des deux lacs avec un guide local, visitez les villages de la vallée de l’Assif Melloul et dormez en gîtes familiaux, avant la longue et belle route du retour vers Marrakech.
  es: Imilchil está a 2200 m en el Alto Atlas oriental, tierra de grandes mesetas, pueblos de adobe y dos lagos de un azul profundo. Cuenta la leyenda que Isli y Tislit, «el novio» y «la novia», nacieron de las lágrimas de dos enamorados de tribus rivales, y cada septiembre la región celebra su famoso festival de bodas. En cuatro días cruza el Atlas hasta Imilchil, camina alrededor de los dos lagos con un guía local, visita los pueblos del valle del Assif Melloul y duerme en casas familiares, antes de la larga y bonita carretera de vuelta a Marrakech.
  de: Imilchil liegt auf 2.200 m im östlichen Hohen Atlas, einem Land weiter Hochebenen, Lehmdörfer und zweier tiefblauer Seen. Der Legende nach entstanden Isli und Tislit, „der Bräutigam“ und „die Braut“, aus den Tränen zweier Liebender verfeindeter Stämme, und jeden September feiert die Region ihr berühmtes Hochzeitsfest. In vier Tagen überqueren Sie den Atlas nach Imilchil, wandern mit einem einheimischen Guide um beide Seen, besuchen Dörfer im Assif-Melloul-Tal und übernachten in Familien-Gästehäusern, bevor es über die lange, schöne Straße zurück nach Marrakesch geht.
  pt: Imilchil fica a 2200 m no Alto Atlas oriental, terra de grandes planaltos, aldeias de terra e dois lagos de um azul profundo. Diz a lenda que Isli e Tislit, «o noivo» e «a noiva», nasceram das lágrimas de dois apaixonados de tribos rivais, e todos os setembros a região celebra o seu famoso festival de casamentos. Em quatro dias atravessa o Atlas até Imilchil, caminha à volta dos dois lagos com um guia local, visita aldeias do vale do Assif Melloul e dorme em casas de família, antes da longa e bonita estrada de regresso a Marraquexe.
  ar: تقع إملشيل على ارتفاع 2200 متر في الأطلس الكبير الشرقي، أرض الهضاب الواسعة والقرى الطينية وبحيرتين زرقاوين عميقتين. تقول الأسطورة إن إيسلي وتيسليت، "العريس" و"العروس"، تكونتا من دموع حبيبين من قبيلتين متخاصمتين، وفي كل شتنبر تحتفل المنطقة بموسم الخطوبة الشهير. في أربعة أيام تعبرون الأطلس إلى إملشيل، وتمشون حول البحيرتين مع مرشد محلي، وتزورون قرى وادي أسيف ملول وتبيتون في دور ضيافة عائلية، قبل طريق العودة الطويل والجميل إلى مراكش.
