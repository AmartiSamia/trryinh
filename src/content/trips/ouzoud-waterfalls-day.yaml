title:
  en: Ouzoud waterfalls day trip
  fr: Excursion aux cascades d’Ouzoud
  ar: رحلة يومية إلى شلالات أوزود
summary:
  en: Morocco’s highest waterfalls, 110 m of water dropping into a green gorge. Walk down with a local guide, take a boat to the foot of the falls, meet the macaques.
  fr: Les plus hautes cascades du Maroc, 110 m de chute dans une gorge verdoyante. Descente avec un guide local, barque jusqu’au pied des chutes, rencontre des macaques.
  ar: أعلى شلالات في المغرب، 110 أمتار من المياه المتدفقة في مضيق أخضر. نزول مع مرشد محلي، قارب إلى أسفل الشلالات ولقاء قردة المكاك.
about:
  en: >-
    A full day out of the city, about two and a half hours north-east of Marrakech. A local guide
    walks you down the olive-shaded path to the bottom of the falls, where small boats go close to
    the spray, and back up the other side past Barbary macaques. Lunch with a view of the water,
    then the drive back.
  fr: >-
    Une journée entière hors de la ville, à environ deux heures et demie au nord-est de Marrakech.
    Un guide local vous accompagne sur le sentier ombragé d’oliviers jusqu’au pied des chutes, où des
    barques approchent des embruns, puis remonte de l’autre côté en croisant les macaques. Déjeuner
    face à l’eau, puis retour.
  ar: >-
    يوم كامل خارج المدينة، على بعد حوالي ساعتين ونصف شمال شرق مراكش. يرافقكم مرشد محلي على مسار تظلله
    أشجار الزيتون حتى أسفل الشلالات حيث تقترب القوارب الصغيرة من رذاذ الماء، ثم تصعدون من الجهة الأخرى
    مرورا بقردة المكاك. غداء مطل على الماء ثم العودة.
