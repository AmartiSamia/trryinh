summary:
  en: Morocco’s highest waterfalls, 110 m of water dropping into a green gorge. Walk down with a local guide, take a boat to the foot of the falls, meet the macaques.
  fr: Les plus hautes cascades du Maroc, 110 m de chute dans une gorge verdoyante. Descente avec un guide local, barque jusqu’au pied des chutes, rencontre des macaques.
  es: Las cascadas más altas de Marruecos, 110 m de agua cayendo en un barranco verde. Bajada con un guía local, barca hasta el pie de las cascadas y encuentro con los macacos.
  de: "Marokkos höchste Wasserfälle: 110 m Wasser stürzen in eine grüne Schlucht. Abstieg mit einem einheimischen Guide, Bootsfahrt zum Fuß der Fälle und Begegnung mit den Makaken."
  pt: As cascatas mais altas de Marrocos, 110 m de água a cair num desfiladeiro verde. Descida com um guia local, barco até ao pé das quedas e encontro com os macacos.
  ar: أعلى شلالات في المغرب، 110 أمتار من المياه المتدفقة في مضيق أخضر. نزول مع مرشد محلي، قارب إلى أسفل الشلالات ولقاء قردة المكاك.
about:
  en: >-
    A full day out of the city, about two and a half hours north-east of Marrakech. A local guide walks you down the olive-shaded path to the bottom of the falls, where small boats go close to the spray, and back up the other side past Barbary macaques. Lunch with a view of the water, then the drive back.
  fr: >-
    Une journée entière hors de la ville, à environ deux heures et demie au nord-est de Marrakech. Un guide local vous accompagne sur le sentier ombragé d’oliviers jusqu’au pied des chutes, où des barques approchent des embruns, puis remonte de l’autre côté en croisant les macaques. Déjeuner face à l’eau, puis retour.
  es: Un día completo fuera de la ciudad, a unas dos horas y media al noreste de Marrakech. Un guía local le lleva por el sendero sombreado de olivos hasta el pie de las cascadas, donde pequeñas barcas se acercan a la espuma, y sube por el otro lado entre macacos de Berbería. Almuerzo con vistas al agua y regreso.
  de: Ein ganzer Tag außerhalb der Stadt, etwa zweieinhalb Stunden nordöstlich von Marrakesch. Ein einheimischer Guide führt Sie auf dem von Olivenbäumen beschatteten Weg hinab zum Fuß der Fälle, wo kleine Boote nahe an die Gischt fahren, und auf der anderen Seite an Berberaffen vorbei wieder hinauf. Mittagessen mit Blick aufs Wasser, dann Rückfahrt.
  pt: Um dia inteiro fora da cidade, a cerca de duas horas e meia a nordeste de Marraquexe. Um guia local leva-o pelo trilho à sombra das oliveiras até ao pé das cascatas, onde pequenos barcos se aproximam da espuma, e sobe pelo outro lado entre macacos-de-Gibraltar. Almoço com vista para a água e regresso.
  ar: >-
    يوم كامل خارج المدينة، على بعد حوالي ساعتين ونصف شمال شرق مراكش. يرافقكم مرشد محلي على مسار تظلله أشجار الزيتون حتى أسفل الشلالات حيث تقترب القوارب الصغيرة من رذاذ الماء، ثم تصعدون من الجهة الأخرى مرورا بقردة المكاك. غداء مطل على الماء ثم العودة.
