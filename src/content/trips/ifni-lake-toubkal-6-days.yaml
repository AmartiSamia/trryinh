title:
  en: Lake Ifni and Toubkal circuit, 6 days
  fr: Circuit lac d’Ifni et Toubkal, 6 jours
  ar: جولة بحيرة إفني وتوبقال، 6 أيام
summary:
  en: The big loop around the Toubkal massif. Remote valleys, Berber villages, a night by Lake Ifni and the summit at the end, when you are well acclimatised.
  fr: La grande boucle autour du massif du Toubkal. Vallées isolées, villages berbères, une nuit au bord du lac d’Ifni et le sommet à la fin, bien acclimaté.
  ar: الجولة الكبرى حول جبال توبقال. وديان معزولة وقرى أمازيغية وليلة بجانب بحيرة إفني، والقمة في النهاية بعد تأقلم جيد.
about:
  en: >-
    Six days to really know the High Atlas. You leave Imlil eastwards to Tacheddirt, cross high
    passes into the quiet Ouarai valley, walk down to the village of Amsouzart and up to Lake Ifni,
    a turquoise lake closed in by rock walls. From there you cross Tizi n’Ouanoums (3,664 m) to
    the Toubkal refuge, and climb the summit on the last morning, better acclimatised than on any
    shorter trek. Mules carry the bags; you carry a daypack.
  fr: >-
    Six jours pour vraiment connaître le Haut Atlas. Vous quittez Imlil vers l’est jusqu’à Tacheddirt,
    franchissez des cols élevés vers la calme vallée de l’Ouarai, descendez au village d’Amsouzart et
    montez au lac d’Ifni, turquoise entre ses parois de roche. De là, vous passez le Tizi n’Ouanoums
    (3 664 m) jusqu’au refuge du Toubkal, et montez au sommet le dernier matin, mieux acclimaté que sur
    n’importe quel trek plus court. Les mules portent les bagages ; vous portez un sac de journée.
  ar: >-
    ستة أيام للتعرف حقا على الأطلس الكبير. تغادرون إمليل شرقا نحو تاشديرت، وتعبرون ممرات عالية نحو وادي
    أواراي الهادئ، ثم تنزلون إلى قرية أمسوزارت وتصعدون إلى بحيرة إفني الفيروزية بين جدرانها الصخرية. من
    هناك تعبرون ممر تيزي نوانومس (3664 م) إلى ملجأ توبقال، وتصعدون القمة في الصباح الأخير وأنتم أكثر تأقلما
    من أي رحلة أقصر. البغال تحمل الأمتعة وأنتم تحملون حقيبة يومية فقط.
