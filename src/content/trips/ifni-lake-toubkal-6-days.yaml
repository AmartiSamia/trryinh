    text:
      en: "A short morning walk up to Lake Ifni, then a free afternoon by the water."
      fr: "Courte marche matinale jusqu’au lac d’Ifni, puis après-midi libre au bord de l’eau."
      ar: "مشي صباحي قصير إلى بحيرة إفني، ثم بعد ظهر حر بجانب الماء."
