title:
  en: Marrakech to Zagora desert, 2 days
  fr: Désert de Zagora depuis Marrakech, 2 jours
  ar: صحراء زاكورة من مراكش، يومان
summary:
  en: The shortest way to sleep in the desert from Marrakech. Aït Benhaddou, the Draa valley palm groves and a camel ride to a camp near Zagora.
  fr: Le moyen le plus court de dormir dans le désert depuis Marrakech. Aït Benhaddou, les palmeraies du Drâa et une balade à dos de dromadaire jusqu’à un camp près de Zagora.
  ar: أقصر طريقة للمبيت في الصحراء من مراكش. آيت بن حدو، واحات نخيل درعة وجولة على الجمال إلى مخيم قرب زاكورة.
about:
  en: >-
    If you only have two days, Zagora is the realistic choice. The dunes are smaller than in
    Merzouga, but the road is beautiful: the Tichka pass, Aït Benhaddou, then the long palm
    valley of the Draa with its earth villages. You ride camels to the camp for dinner and a night
    under the stars, and drive back to Marrakech the next day.
  fr: >-
    Avec seulement deux jours, Zagora est le choix réaliste. Les dunes sont plus petites qu’à Merzouga,
    mais la route est superbe : le col du Tichka, Aït Benhaddou, puis la longue vallée de palmiers du
    Drâa et ses villages en terre. Vous rejoignez le camp à dos de dromadaire pour le dîner et une nuit
    sous les étoiles, et rentrez à Marrakech le lendemain.
  ar: >-
    إذا كان لديكم يومان فقط، فزاكورة هي الخيار الواقعي. الكثبان أصغر من مرزوكة، لكن الطريق رائع: ممر
    تيشكا، آيت بن حدو، ثم وادي درعة الطويل بنخيله وقراه الطينية. تركبون الجمال إلى المخيم للعشاء وليلة
    تحت النجوم، وتعودون إلى مراكش في اليوم الموالي.
