summary:
  en: The shortest way to sleep in the desert from Marrakech. Aït Benhaddou, the Draa valley palm groves and a camel ride to a camp near Zagora.
  fr: Le moyen le plus court de dormir dans le désert depuis Marrakech. Aït Benhaddou, les palmeraies du Drâa et une balade à dos de dromadaire jusqu’à un camp près de Zagora.
  es: La forma más corta de dormir en el desierto desde Marrakech. Aït Benhaddou, los palmerales del valle del Draa y un paseo en dromedario hasta un campamento cerca de Zagora.
  de: Der kürzeste Weg zu einer Nacht in der Wüste ab Marrakesch. Aït Benhaddou, die Palmenhaine des Draa-Tals und ein Kamelritt zu einem Camp bei Zagora.
  pt: A forma mais curta de dormir no deserto desde Marraquexe. Aït Benhaddou, os palmeirais do vale do Draa e um passeio de dromedário até um acampamento perto de Zagora.
  ar: أقصر طريقة للمبيت في الصحراء من مراكش. آيت بن حدو، واحات نخيل درعة وجولة على الجمال إلى مخيم قرب زاكورة.
about:
  en: >-
    If you only have two days, Zagora is the realistic choice. The dunes are smaller than in Merzouga, but the road is beautiful: the Tichka pass, Aït Benhaddou, then the long palm valley of the Draa with its earth villages. You ride camels to the camp for dinner and a night under the stars, and drive back to Marrakech the next day.
  fr: >-
    Avec seulement deux jours, Zagora est le choix réaliste. Les dunes sont plus petites qu’à Merzouga, mais la route est superbe : le col du Tichka, Aït Benhaddou, puis la longue vallée de palmiers du Drâa et ses villages en terre. Vous rejoignez le camp à dos de dromadaire pour le dîner et une nuit sous les étoiles, et rentrez à Marrakech le lendemain.
  es: "Si solo tiene dos días, Zagora es la opción realista. Las dunas son más pequeñas que en Merzouga, pero la carretera es preciosa: el puerto de Tichka, Aït Benhaddou y luego el largo valle de palmeras del Draa con sus pueblos de adobe. Llega en dromedario al campamento para la cena y una noche bajo las estrellas, y vuelve a Marrakech al día siguiente."
  de: "Wenn Sie nur zwei Tage haben, ist Zagora die realistische Wahl. Die Dünen sind kleiner als in Merzouga, aber die Strecke ist herrlich: der Tichka-Pass, Aït Benhaddou, dann das lange Palmental des Draa mit seinen Lehmdörfern. Sie reiten auf Kamelen ins Camp zum Abendessen und zu einer Nacht unter Sternen und fahren am nächsten Tag zurück nach Marrakesch."
  pt: "Se tem só dois dias, Zagora é a escolha realista. As dunas são mais pequenas do que em Merzouga, mas a estrada é bonita: o passo de Tichka, Aït Benhaddou e depois o longo vale de palmeiras do Draa com as suas aldeias de terra. Chega de dromedário ao acampamento para jantar e passar a noite sob as estrelas, e regressa a Marraquexe no dia seguinte."
  ar: >-
    إذا كان لديكم يومان فقط، فزاكورة هي الخيار الواقعي. الكثبان أصغر من مرزوكة، لكن الطريق رائع: ممر تيشكا، آيت بن حدو، ثم وادي درعة الطويل بنخيله وقراه الطينية. تركبون الجمال إلى المخيم للعشاء وليلة تحت النجوم، وتعودون إلى مراكش في اليوم الموالي.
