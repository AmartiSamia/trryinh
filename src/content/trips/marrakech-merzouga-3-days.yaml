goodToKnow:
  - en: "Shared tours travel in a minibus with other travellers. The private option is your own car and driver, and you can stop where you like."
    fr: "Les circuits partagés voyagent en minibus avec d’autres voyageurs. L’option privée, c’est votre voiture et votre chauffeur, avec des arrêts où vous voulez."
    es: Los viajes compartidos se hacen en minibús con otros viajeros. La opción privada es su propio coche con conductor, y puede parar donde quiera.
    de: Gruppentouren fahren im Minibus mit anderen Reisenden. Bei der Privatoption haben Sie Ihr eigenes Auto mit Fahrer und halten, wo Sie möchten.
    pt: As viagens partilhadas fazem-se em minibus com outros viajantes. A opção privada é o seu próprio carro com motorista, e pode parar onde quiser.
    ar: "الرحلات المشتركة تكون في حافلة صغيرة مع مسافرين آخرين. الخيار الخاص يعني سيارتكم وسائقكم، مع التوقف حيث تشاؤون."
  - en: "Desert nights are cold from November to March. Bring a warm layer."
    fr: "Les nuits du désert sont froides de novembre à mars. Prévoyez une couche chaude."
    es: Las noches del desierto son frías de noviembre a marzo. Lleve una capa de abrigo.
    de: Von November bis März sind die Wüstennächte kalt. Nehmen Sie eine warme Schicht mit.
    pt: As noites no deserto são frias de novembro a março. Leve uma camada quente.
    ar: "ليالي الصحراء باردة من نونبر إلى مارس. أحضروا ملابس دافئة."
