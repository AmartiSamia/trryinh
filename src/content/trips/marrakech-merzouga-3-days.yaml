summary:
  en: Over the Atlas to the Sahara. Aït Benhaddou, the Dades and Todra gorges, a camel ride into the Erg Chebbi dunes and a night in a desert camp.
  fr: Par l’Atlas jusqu’au Sahara. Aït Benhaddou, les gorges du Dadès et du Todra, balade à dos de dromadaire dans les dunes de l’erg Chebbi et nuit en camp.
  es: Por el Atlas hasta el Sáhara. Aït Benhaddou, las gargantas del Dades y del Todra, paseo en dromedario por las dunas del Erg Chebbi y noche en un campamento.
  de: Über den Atlas in die Sahara. Aït Benhaddou, die Dadès- und Todra-Schluchten, ein Kamelritt in die Dünen des Erg Chebbi und eine Nacht im Wüstencamp.
  pt: Pelo Atlas até ao Sara. Aït Benhaddou, as gargantas do Dadès e do Todra, passeio de dromedário nas dunas do Erg Chebbi e noite num acampamento.
  ar: عبر الأطلس إلى الصحراء الكبرى. آيت بن حدو، مضايق دادس وتودغى، جولة على الجمال في كثبان عرق الشبي وليلة في مخيم صحراوي.
about:
  en: >-
    The classic desert journey from Marrakech. Day one crosses the Tizi n’Tichka pass and stops at the earth ksar of Aït Benhaddou before the night in the Dades valley. Day two follows the road of the kasbahs to the Todra gorge and on to Merzouga, where camels take you into the dunes for sunset and a night at camp. On day three you watch the sun rise over the sand and drive back to Marrakech. It is a lot of driving, but the landscapes change every hour.
  fr: >-
    Le voyage classique vers le désert depuis Marrakech. Le premier jour passe le col du Tizi n’Tichka et s’arrête au ksar en terre d’Aït Benhaddou avant la nuit dans la vallée du Dadès. Le deuxième jour suit la route des kasbahs jusqu’aux gorges du Todra puis Merzouga, où les dromadaires vous emmènent dans les dunes pour le coucher du soleil et la nuit au camp. Le troisième jour, lever du soleil sur le sable et retour à Marrakech. Beaucoup de route, mais le paysage change à chaque heure.
  es: El viaje clásico al desierto desde Marrakech. El primer día cruza el puerto de Tizi n’Tichka y para en el ksar de adobe de Aït Benhaddou antes de dormir en el valle del Dades. El segundo día sigue la ruta de las kasbahs hasta la garganta del Todra y después Merzouga, donde los dromedarios le llevan a las dunas para el atardecer y la noche en el campamento. El tercer día ve salir el sol sobre la arena y vuelve a Marrakech. Muchas horas de carretera, pero el paisaje cambia cada hora.
  de: Die klassische Wüstenreise ab Marrakesch. Am ersten Tag geht es über den Pass Tizi n’Tichka mit Halt am Lehm-Ksar Aït Benhaddou, übernachtet wird im Dadès-Tal. Am zweiten Tag folgen Sie der Straße der Kasbahs zur Todra-Schlucht und weiter nach Merzouga, wo Kamele Sie zum Sonnenuntergang in die Dünen und zur Nacht ins Camp bringen. Am dritten Tag sehen Sie die Sonne über dem Sand aufgehen und fahren zurück nach Marrakesch. Viel Fahrzeit, aber die Landschaft wechselt stündlich.
  pt: A viagem clássica ao deserto desde Marraquexe. No primeiro dia atravessa o passo de Tizi n’Tichka e para no ksar de terra de Aït Benhaddou antes da noite no vale do Dadès. No segundo dia segue a estrada das kasbahs até à garganta do Todra e depois Merzouga, onde os dromedários o levam às dunas para o pôr do sol e a noite no acampamento. No terceiro dia vê o sol nascer sobre a areia e regressa a Marraquexe. Muita estrada, mas a paisagem muda a cada hora.
  ar: >-
    الرحلة الكلاسيكية إلى الصحراء من مراكش. في اليوم الأول تعبرون ممر تيزي نتيشكا وتتوقفون عند قصر آيت بن حدو الطيني قبل المبيت في وادي دادس. في اليوم الثاني تتبعون طريق القصبات إلى مضيق تودغى ثم مرزوكة، حيث تأخذكم الجمال إلى الكثبان لمشاهدة الغروب والمبيت في المخيم. في اليوم الثالث تشاهدون شروق الشمس فوق الرمال وتعودون إلى مراكش. الطريق طويل، لكن المناظر تتغير كل ساعة.
