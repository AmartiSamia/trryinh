title:
  en: Marrakech to Merzouga desert, 3 days
  fr: Désert de Merzouga depuis Marrakech, 3 jours
  ar: صحراء مرزوكة من مراكش، 3 أيام
summary:
  en: Over the Atlas to the Sahara. Aït Benhaddou, the Dades and Todra gorges, a camel ride into the Erg Chebbi dunes and a night in a desert camp.
  fr: Par l’Atlas jusqu’au Sahara. Aït Benhaddou, les gorges du Dadès et du Todra, balade à dos de dromadaire dans les dunes de l’erg Chebbi et nuit en camp.
  ar: عبر الأطلس إلى الصحراء الكبرى. آيت بن حدو، مضايق دادس وتودغى، جولة على الجمال في كثبان عرق الشبي وليلة في مخيم صحراوي.
about:
  en: >-
    The classic desert journey from Marrakech. Day one crosses the Tizi n’Tichka pass and stops at the
    earth ksar of Aït Benhaddou before the night in the Dades valley. Day two follows the road of the
    kasbahs to the Todra gorge and on to Merzouga, where camels take you into the dunes for sunset
    and a night at camp. On day three you watch the sun rise over the sand and drive back to
    Marrakech. It is a lot of driving, but the landscapes change every hour.
  fr: >-
    Le voyage classique vers le désert depuis Marrakech. Le premier jour passe le col du Tizi n’Tichka
    et s’arrête au ksar en terre d’Aït Benhaddou avant la nuit dans la vallée du Dadès. Le deuxième
    jour suit la route des kasbahs jusqu’aux gorges du Todra puis Merzouga, où les dromadaires vous
    emmènent dans les dunes pour le coucher du soleil et la nuit au camp. Le troisième jour, lever du
    soleil sur le sable et retour à Marrakech. Beaucoup de route, mais le paysage change à chaque heure.
  ar: >-
    الرحلة الكلاسيكية إلى الصحراء من مراكش. في اليوم الأول تعبرون ممر تيزي نتيشكا وتتوقفون عند قصر آيت بن
    حدو الطيني قبل المبيت في وادي دادس. في اليوم الثاني تتبعون طريق القصبات إلى مضيق تودغى ثم مرزوكة،
    حيث تأخذكم الجمال إلى الكثبان لمشاهدة الغروب والمبيت في المخيم. في اليوم الثالث تشاهدون شروق الشمس
    فوق الرمال وتعودون إلى مراكش. الطريق طويل، لكن المناظر تتغير كل ساعة.
