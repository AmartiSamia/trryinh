title:
  en: Marrakech medina guided tour
  fr: Visite guidée de la médina de Marrakech
  ar: جولة مع مرشد في مدينة مراكش العتيقة
summary:
  en: Half a day in the old city with a licensed guide. The Bahia Palace, the souks, the craftsmen’s quarters and Jemaa el-Fna, without getting lost or pushed into shops.
  fr: Une demi-journée dans la vieille ville avec un guide officiel. Le palais de la Bahia, les souks, les quartiers d’artisans et Jemaa el-Fna, sans se perdre ni être poussé dans les boutiques.
  ar: نصف يوم في المدينة القديمة مع مرشد معتمد. قصر الباهية، الأسواق، أحياء الحرفيين وساحة جامع الفنا، دون أن تضيعوا أو تُدفعوا إلى المتاجر.
about:
  en: >-
    The medina of Marrakech is easier and richer with someone who grew up in it. Your licensed guide
    starts at the Bahia Palace, walks you through the old Jewish quarter and the spice square, then
    into the souks of the dyers, metalworkers and leatherworkers, and ends at Jemaa el-Fna. You go at
    your pace; shopping only if you ask.
  fr: >-
    La médina de Marrakech est plus simple et plus riche avec quelqu’un qui y a grandi. Votre guide
    officiel commence au palais de la Bahia, traverse le mellah et la place des épices, puis les souks
    des teinturiers, ferronniers et maroquiniers, et termine à Jemaa el-Fna. À votre rythme ; des
    achats seulement si vous le demandez.
  ar: >-
    مدينة مراكش العتيقة أسهل وأغنى برفقة شخص نشأ فيها. يبدأ مرشدكم المعتمد من قصر الباهية، ثم يمر بالملاح
    وساحة التوابل، ثم أسواق الصباغين والحدادين والدباغين، وينتهي في ساحة جامع الفنا. بإيقاعكم الخاص، ولا
    تسوق إلا إذا طلبتم ذلك.
