title:
  en: Aït Benhaddou and Ouarzazate day trip
  fr: Excursion à Aït Benhaddou et Ouarzazate
  ar: رحلة يومية إلى آيت بن حدو وورزازات
summary:
  en: Over the Tichka pass to the earth ksar of Aït Benhaddou and the kasbahs of Ouarzazate, the gateway to the desert.
  fr: Par le col du Tichka jusqu’au ksar en terre d’Aït Benhaddou et aux kasbahs de Ouarzazate, porte du désert.
  ar: عبر ممر تيشكا إلى قصر آيت بن حدو الطيني وقصبات ورزازات، بوابة الصحراء.
about:
  en: >-
    A long but spectacular day. The road climbs through Amazigh villages to the Tizi n’Tichka pass
    at 2,260 m, then drops to Aït Benhaddou, a fortified village of earth and straw on the old
    caravan route. A local guide takes you up through its lanes, then you continue to Ouarzazate
    and its kasbah before driving back over the mountains.
  fr: >-
    Une longue mais spectaculaire journée. La route monte par les villages amazighs jusqu’au col du
    Tizi n’Tichka à 2 260 m, puis descend vers Aït Benhaddou, village fortifié en terre et paille sur
    l’ancienne route des caravanes. Un guide local vous emmène dans ses ruelles, puis vous continuez
    vers Ouarzazate et sa kasbah avant de repasser les montagnes.
  ar: >-
    يوم طويل لكنه مذهل. يصعد الطريق عبر القرى الأمازيغية إلى ممر تيزي نتيشكا على ارتفاع 2260 مترا، ثم
    ينزل إلى آيت بن حدو، القرية المحصنة المبنية بالطين والتبن على طريق القوافل القديم. يرافقكم مرشد محلي
    في أزقتها، ثم تواصلون إلى ورزازات وقصبتها قبل العودة عبر الجبال.
