summary:
  en: Over the Tichka pass to the earth ksar of Aït Benhaddou and the kasbahs of Ouarzazate, the gateway to the desert.
  fr: Par le col du Tichka jusqu’au ksar en terre d’Aït Benhaddou et aux kasbahs de Ouarzazate, porte du désert.
  es: Por el puerto de Tichka hasta el ksar de adobe de Aït Benhaddou y las kasbahs de Ouarzazate, la puerta del desierto.
  de: Über den Tichka-Pass zum Lehm-Ksar Aït Benhaddou und zu den Kasbahs von Ouarzazate, dem Tor zur Wüste.
  pt: Pelo passo de Tichka até ao ksar de terra de Aït Benhaddou e às kasbahs de Ouarzazate, a porta do deserto.
  ar: عبر ممر تيشكا إلى قصر آيت بن حدو الطيني وقصبات ورزازات، بوابة الصحراء.
about:
  en: >-
    A long but spectacular day. The road climbs through Amazigh villages to the Tizi n’Tichka pass at 2,260 m, then drops to Aït Benhaddou, a fortified village of earth and straw on the old caravan route. A local guide takes you up through its lanes, then you continue to Ouarzazate and its kasbah before driving back over the mountains.
  fr: >-
    Une longue mais spectaculaire journée. La route monte par les villages amazighs jusqu’au col du Tizi n’Tichka à 2 260 m, puis descend vers Aït Benhaddou, village fortifié en terre et paille sur l’ancienne route des caravanes. Un guide local vous emmène dans ses ruelles, puis vous continuez vers Ouarzazate et sa kasbah avant de repasser les montagnes.
  es: Un día largo pero espectacular. La carretera sube entre pueblos amazighs hasta el puerto de Tizi n’Tichka, a 2260 m, y baja a Aït Benhaddou, un pueblo fortificado de tierra y paja en la antigua ruta de las caravanas. Un guía local le acompaña por sus callejuelas y luego sigue hasta Ouarzazate y su kasbah antes de volver por las montañas.
  de: Ein langer, aber spektakulärer Tag. Die Straße steigt durch Amazigh-Dörfer zum Pass Tizi n’Tichka auf 2.260 m und führt dann hinab nach Aït Benhaddou, einem befestigten Dorf aus Lehm und Stroh an der alten Karawanenroute. Ein einheimischer Guide führt Sie durch die Gassen, dann geht es weiter nach Ouarzazate und zu seiner Kasbah, bevor Sie über die Berge zurückfahren.
  pt: Um dia longo mas espetacular. A estrada sobe entre aldeias amazigh até ao passo de Tizi n’Tichka, a 2260 m, e desce até Aït Benhaddou, uma aldeia fortificada de terra e palha na antiga rota das caravanas. Um guia local leva-o pelas suas ruelas e depois segue para Ouarzazate e a sua kasbah antes de regressar pelas montanhas.
  ar: >-
    يوم طويل لكنه مذهل. يصعد الطريق عبر القرى الأمازيغية إلى ممر تيزي نتيشكا على ارتفاع 2260 مترا، ثم ينزل إلى آيت بن حدو، القرية المحصنة المبنية بالطين والتبن على طريق القوافل القديم. يرافقكم مرشد محلي في أزقتها، ثم تواصلون إلى ورزازات وقصبتها قبل العودة عبر الجبال.
