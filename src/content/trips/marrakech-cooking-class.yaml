category: culture
popularity: 66
title:
  en: Moroccan cooking class in Marrakech
  fr: Cours de cuisine marocaine à Marrakech
  ar: درس طبخ مغربي في مراكش
summary:
  en: Shop at the market, then cook a full Moroccan meal with a local cook. Salads, a tagine of your choice, bread and mint tea, and you eat what you make.
  fr: Courses au marché, puis un vrai repas marocain avec une cuisinière locale. Salades, tajine au choix, pain et thé à la menthe, et vous mangez ce que vous préparez.
  ar: التسوق من السوق ثم طبخ وجبة مغربية كاملة مع طباخة محلية. سلطات، طاجين من اختياركم، خبز وشاي بالنعناع، وتأكلون ما تطبخون.
about:
  en: >-
    A morning in the kitchen. You buy vegetables and spices with your host, learn which spice goes
    where, and cook step by step: cooked salads, a chicken or vegetable tagine, bread, and the right
    way to pour mint tea. You leave with the recipes and a full stomach.
  fr: >-
    Une matinée en cuisine. Vous achetez légumes et épices avec votre hôte, apprenez quelle épice va où,
    et cuisinez pas à pas : salades cuites, tajine au poulet ou aux légumes, pain, et la bonne façon de
    servir le thé à la menthe. Vous repartez avec les recettes et le ventre plein.
  ar: >-
    صباح في المطبخ. تشترون الخضر والتوابل مع مضيفتكم، وتتعلمون أي توابل لأي طبق، وتطبخون خطوة بخطوة:
    السلطات المطبوخة، طاجين بالدجاج أو بالخضر، الخبز، والطريقة الصحيحة لسكب الشاي بالنعناع. تغادرون
    بالوصفات وبطن ممتلئ.
