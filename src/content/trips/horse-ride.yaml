category: activity
popularity: 55
title:
  en: Horse ride in the Palmeraie
  fr: Balade à cheval dans la Palmeraie
  ar: جولة على ظهر الخيل في النخيل
summary:
  en: An easy ride among the palm trees on the edge of Marrakech, for beginners and experienced riders, with a guide from the stable.
  fr: Une balade facile parmi les palmiers aux portes de Marrakech, pour débutants et cavaliers confirmés, avec un guide de l’écurie.
  ar: جولة سهلة بين أشجار النخيل على أطراف مراكش، للمبتدئين وذوي الخبرة، مع مرشد من الإسطبل.
about:
  en: >-
    Calm horses, a guide who adapts to your level, and quiet tracks through the Palmeraie, with
    the Atlas on the horizon on clear days. Rides last one or two hours. A beach ride in Essaouira
    can also be arranged if you go there.
  fr: >-
    Des chevaux calmes, un guide qui s’adapte à votre niveau et des pistes tranquilles dans la Palmeraie,
    avec l’Atlas à l’horizon par temps clair. Balades d’une ou deux heures. Une balade sur la plage
    d’Essaouira est aussi possible si vous y allez.
  ar: >-
    خيول هادئة، ومرشد يتكيف مع مستواكم، ومسالك هادئة في النخيل مع الأطلس في الأفق في الأيام الصافية.
    تدوم الجولات ساعة أو ساعتين. يمكن أيضا ترتيب جولة على شاطئ الصويرة إذا ذهبتم إليها.
