title:
  en: Toubkal summit trek, 3 days
  fr: Ascension du Toubkal en 3 jours
  ar: صعود قمة توبقال في 3 أيام
summary:
  en: The classic ascent of North Africa’s highest peak (4,167 m) from Imlil, with a night in the village and a night at the refuge. Sunrise on the summit.
  fr: L’ascension classique du plus haut sommet d’Afrique du Nord (4 167 m) depuis Imlil, avec une nuit au village et une nuit au refuge. Lever du soleil au sommet.
  ar: الصعود الكلاسيكي لأعلى قمة في شمال إفريقيا (4167 مترا) انطلاقا من إمليل، مع ليلة في القرية وليلة في الملجأ. شروق الشمس من القمة.
about:
  en: >-
    This is the trek our guides walk more than any other. You leave Marrakech in the afternoon,
    sleep in a guesthouse in Imlil and set off the next morning up the Mizane valley, past the
    shrine of Sidi Chamharouch, to the Toubkal refuge at 3,207 m. On day three you start at 3 am
    with head torches and reach the summit around sunrise, then walk all the way down to Imlil and
    drive back to Marrakech for the evening. It is a real mountain day: long, steep in places and
    cold at the top, but no climbing skills are needed outside winter.
  fr: >-
    C’est le trek que nos guides parcourent le plus souvent. Vous quittez Marrakech l’après-midi, dormez
    dans un gîte à Imlil et partez le lendemain matin par la vallée de la Mizane, en passant par le
    sanctuaire de Sidi Chamharouch, jusqu’au refuge du Toubkal à 3 207 m. Le troisième jour, départ à
    3 h à la lampe frontale pour atteindre le sommet vers le lever du soleil, puis descente jusqu’à
    Imlil et retour à Marrakech le soir. C’est une vraie journée de montagne : longue, raide par
    endroits et froide au sommet, mais aucune technique d’escalade n’est nécessaire hors hiver.
  ar: >-
    هذه هي الرحلة التي يقطعها مرشدونا أكثر من أي رحلة أخرى. تغادرون مراكش بعد الظهر، وتبيتون في دار ضيافة
    بإمليل، ثم تنطلقون صباح اليوم التالي عبر وادي ميزان مرورا بضريح سيدي شمهروش حتى ملجأ توبقال على
    ارتفاع 3207 أمتار. في اليوم الثالث تنطلقون في الساعة الثالثة صباحا بمصابيح الرأس وتصلون إلى القمة
    مع شروق الشمس، ثم تنزلون إلى إمليل وتعودون إلى مراكش مساءً. إنه يوم جبلي حقيقي: طويل وشديد الانحدار
    في بعض المقاطع وبارد في القمة، لكنه لا يتطلب مهارات تسلق خارج فصل الشتاء.
