summary:
  en: The classic ascent of North Africa’s highest peak (4,167 m) from Imlil, with a night in the village and a night at the refuge. Sunrise on the summit.
  fr: L’ascension classique du plus haut sommet d’Afrique du Nord (4 167 m) depuis Imlil, avec une nuit au village et une nuit au refuge. Lever du soleil au sommet.
  es: La subida clásica al pico más alto del norte de África (4167 m) desde Imlil, con una noche en el pueblo y otra en el refugio. Amanecer en la cumbre.
  de: Der klassische Aufstieg auf den höchsten Gipfel Nordafrikas (4.167 m) ab Imlil, mit einer Nacht im Dorf und einer in der Hütte. Sonnenaufgang auf dem Gipfel.
  pt: A subida clássica ao pico mais alto do Norte de África (4167 m) a partir de Imlil, com uma noite na aldeia e outra no refúgio. Nascer do sol no cume.
  ar: الصعود الكلاسيكي لأعلى قمة في شمال إفريقيا (4167 مترا) انطلاقا من إمليل، مع ليلة في القرية وليلة في الملجأ. شروق الشمس من القمة.
about:
  en: >-
    This is the trek our guides walk more than any other. You leave Marrakech in the afternoon, sleep in a guesthouse in Imlil and set off the next morning up the Mizane valley, through the village of Aremd and past the shrine of Sidi Chamharouch, to the Toubkal refuge at 3,207 m. On day three you start at 3 am with head torches and reach the summit around sunrise, then walk all the way down to Imlil and drive back to Marrakech for the evening. It is a real mountain day: long, steep in places and cold at the top, but no climbing skills are needed outside winter.
  fr: >-
    C’est le trek que nos guides parcourent le plus souvent. Vous quittez Marrakech l’après-midi, dormez dans un gîte à Imlil et partez le lendemain matin par la vallée de la Mizane, en traversant le village d’Aremd puis le sanctuaire de Sidi Chamharouch, jusqu’au refuge du Toubkal à 3 207 m. Le troisième jour, départ à 3 h à la lampe frontale pour atteindre le sommet vers le lever du soleil, puis descente jusqu’à Imlil et retour à Marrakech le soir. C’est une vraie journée de montagne : longue, raide par endroits et froide au sommet, mais aucune technique d’escalade n’est nécessaire hors hiver.
  es: "Es el trek que más recorren nuestros guías. Sale de Marrakech por la tarde, duerme en una casa de huéspedes en Imlil y a la mañana siguiente sube por el valle del Mizane, atravesando el pueblo de Aremd y el santuario de Sidi Chamharouch, hasta el refugio del Toubkal a 3207 m. El tercer día sale a las 3 de la madrugada con linterna frontal y llega a la cumbre hacia el amanecer; después baja hasta Imlil y vuelve a Marrakech por la noche. Es un auténtico día de montaña: largo, empinado en algunos tramos y frío arriba, pero fuera del invierno no hace falta técnica de escalada."
  de: "Diesen Trek gehen unsere Guides häufiger als jeden anderen. Sie verlassen Marrakesch am Nachmittag, übernachten in einem Gästehaus in Imlil und brechen am nächsten Morgen ins Mizane-Tal auf, durch das Dorf Aremd und vorbei am Heiligtum Sidi Chamharouch bis zur Toubkal-Hütte auf 3.207 m. Am dritten Tag starten Sie um 3 Uhr mit Stirnlampe, erreichen den Gipfel gegen Sonnenaufgang, steigen dann ganz bis Imlil ab und sind abends zurück in Marrakesch. Ein echter Bergtag: lang, stellenweise steil und oben kalt, doch außerhalb des Winters braucht es keine Klettertechnik."
  pt: "É o trekking que os nossos guias fazem mais vezes. Sai de Marraquexe à tarde, dorme numa casa de hóspedes em Imlil e na manhã seguinte sobe o vale do Mizane, atravessando a aldeia de Aremd e o santuário de Sidi Chamharouch, até ao refúgio do Toubkal a 3207 m. No terceiro dia parte às 3 da manhã com lanterna frontal e chega ao cume por volta do nascer do sol; depois desce até Imlil e regressa a Marraquexe à noite. É um verdadeiro dia de montanha: longo, íngreme em alguns troços e frio lá em cima, mas fora do inverno não é preciso técnica de escalada."
  ar: >-
    هذه هي الرحلة التي يقطعها مرشدونا أكثر من أي رحلة أخرى. تغادرون مراكش بعد الظهر، وتبيتون في دار ضيافة بإمليل، ثم تنطلقون صباح اليوم التالي عبر وادي ميزان مرورا بقرية أرمد وضريح سيدي شمهروش حتى ملجأ توبقال على ارتفاع 3207 أمتار. في اليوم الثالث تنطلقون في الساعة الثالثة صباحا بمصابيح الرأس وتصلون إلى القمة مع شروق الشمس، ثم تنزلون إلى إمليل وتعودون إلى مراكش مساءً. إنه يوم جبلي حقيقي: طويل وشديد الانحدار في بعض المقاطع وبارد في القمة، لكنه لا يتطلب مهارات تسلق خارج فصل الشتاء.
