faq:
  - q: { en: Do I need climbing experience?, fr: Faut-il de l’expérience en escalade ?, es: "¿Necesito experiencia en escalada?", de: "Brauche ich Klettererfahrung?", pt: "Preciso de experiência em escalada?", ar: هل أحتاج إلى خبرة في التسلق؟ }
    a:
      en: No. From April to November it is a walk on steep, rocky paths. You need good fitness and good shoes, not technical skills.
      fr: Non. D’avril à novembre, c’est une marche sur des sentiers raides et caillouteux. Il faut une bonne condition physique et de bonnes chaussures, pas de technique.
      es: No. De abril a noviembre es una caminata por senderos empinados y pedregosos. Necesita buena forma física y buen calzado, no técnica.
      de: Nein. Von April bis November ist es eine Wanderung auf steilen, steinigen Wegen. Sie brauchen gute Kondition und gute Schuhe, keine Technik.
      pt: Não. De abril a novembro é uma caminhada por trilhos íngremes e pedregosos. Precisa de boa forma física e bom calçado, não de técnica.
      ar: لا. من أبريل إلى نونبر هو مشي على مسالك شديدة الانحدار وصخرية. تحتاجون إلى لياقة جيدة وحذاء جيد، وليس إلى مهارات تقنية.
  - q: { en: Will the altitude be a problem?, fr: L’altitude pose-t-elle problème ?, es: "¿Será un problema la altitud?", de: "Wird die Höhe ein Problem?", pt: "A altitude vai ser um problema?", ar: هل سيشكل الارتفاع مشكلة؟ }
    a:
      en: Most people feel the altitude above 3,500 m (short breath, mild headache). Going slowly, drinking a lot and sleeping at the refuge first help. Tell your guide how you feel.
      fr: La plupart des gens sentent l’altitude au-dessus de 3 500 m (souffle court, léger mal de tête). Marcher lentement, bien boire et dormir au refuge aident. Dites à votre guide comment vous vous sentez.
      es: La mayoría nota la altitud por encima de 3500 m (falta de aliento, ligero dolor de cabeza). Ir despacio, beber mucho y dormir antes en el refugio ayuda. Diga a su guía cómo se encuentra.
      de: Die meisten spüren die Höhe über 3.500 m (Kurzatmigkeit, leichte Kopfschmerzen). Langsam gehen, viel trinken und vorher in der Hütte schlafen hilft. Sagen Sie Ihrem Guide, wie es Ihnen geht.
      pt: A maioria das pessoas sente a altitude acima dos 3500 m (falta de ar, dor de cabeça ligeira). Andar devagar, beber muito e dormir primeiro no refúgio ajuda. Diga ao guia como se sente.
      ar: يشعر معظم الناس بالارتفاع فوق 3500 متر (ضيق في التنفس، صداع خفيف). المشي ببطء وشرب الكثير من الماء والمبيت في الملجأ أولا يساعد. أخبروا المرشد بما تشعرون به.
