    text:
      en: A steady climb up the Mizane valley through the Berber village of Aremd, with a rest near the checkpoint and lunch at Sidi Chamharouch. In the afternoon the path climbs to the refuge, where you sleep at 3,207 m.
      fr: Une montée régulière dans la vallée de la Mizane en traversant le village berbère d’Aremd, avec une pause près du poste de contrôle et le déjeuner à Sidi Chamharouch. L’après-midi, le sentier monte jusqu’au refuge, où vous dormez à 3 207 m.
      es: Una subida constante por el valle del Mizane atravesando el pueblo bereber de Aremd, con una pausa cerca del puesto de control y almuerzo en Sidi Chamharouch. Por la tarde el sendero sube al refugio, donde se duerme a 3207 m.
      de: Ein stetiger Aufstieg durch das Mizane-Tal und das Berberdorf Aremd, mit einer Pause nahe dem Kontrollposten und Mittagessen in Sidi Chamharouch. Am Nachmittag steigt der Weg zur Hütte, wo Sie auf 3.207 m übernachten.
      pt: Uma subida constante pelo vale do Mizane, atravessando a aldeia berbere de Aremd, com pausa perto do posto de controlo e almoço em Sidi Chamharouch. À tarde o trilho sobe até ao refúgio, onde dorme a 3207 m.
      ar: صعود منتظم في وادي ميزان مرورا بقرية أرمد الأمازيغية، مع استراحة قرب نقطة المراقبة وغداء في سيدي شمهروش. بعد الظهر يصعد المسار إلى الملجأ حيث تبيتون على ارتفاع 3207 أمتار.
