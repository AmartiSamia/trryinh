faq:
  - q: { en: Do I need climbing experience?, fr: Faut-il de l’expérience en escalade ?, ar: هل أحتاج إلى خبرة في التسلق؟ }
    a:
      en: No. From April to November it is a walk on steep, rocky paths. You need good fitness and good shoes, not technical skills.
      fr: Non. D’avril à novembre, c’est une marche sur des sentiers raides et caillouteux. Il faut une bonne condition physique et de bonnes chaussures, pas de technique.
      ar: لا. من أبريل إلى نونبر هو مشي على مسالك شديدة الانحدار وصخرية. تحتاجون إلى لياقة جيدة وحذاء جيد، وليس إلى مهارات تقنية.
  - q: { en: Will the altitude be a problem?, fr: L’altitude pose-t-elle problème ?, ar: هل سيشكل الارتفاع مشكلة؟ }
    a:
      en: Most people feel the altitude above 3,500 m (short breath, mild headache). Going slowly, drinking a lot and sleeping at the refuge first help. Tell your guide how you feel.
      fr: La plupart des gens sentent l’altitude au-dessus de 3 500 m (souffle court, léger mal de tête). Marcher lentement, bien boire et dormir au refuge aident. Dites à votre guide comment vous vous sentez.
      ar: يشعر معظم الناس بالارتفاع فوق 3500 متر (ضيق في التنفس، صداع خفيف). المشي ببطء وشرب الكثير من الماء والمبيت في الملجأ أولا يساعد. أخبروا المرشد بما تشعرون به.
