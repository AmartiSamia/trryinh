  - title: { en: Toubkal summit and return to Marrakech, fr: Sommet du Toubkal et retour à Marrakech, es: "Cumbre del Toubkal y regreso a Marrakech", de: "Toubkal-Gipfel und zurück nach Marrakesch", pt: "Cume do Toubkal e regresso a Marraquexe", ar: قمة توبقال والعودة إلى مراكش }
    text:
      en: An early start by head torch up the south cirque to the summit for sunrise. Back at the refuge for lunch, then down the valley to Imlil and the drive back to Marrakech.
      fr: Départ très matinal à la frontale par le cirque sud pour être au sommet au lever du soleil. Retour au refuge pour le déjeuner, puis descente vers Imlil et route vers Marrakech.
      es: Salida muy temprano con linterna frontal por el circo sur para llegar a la cumbre al amanecer. Vuelta al refugio para almorzar, bajada por el valle hasta Imlil y regreso a Marrakech.
      de: Sehr früher Aufbruch mit Stirnlampe durch das Südkar zum Gipfel bei Sonnenaufgang. Zurück zur Hütte zum Mittagessen, dann durch das Tal nach Imlil und Rückfahrt nach Marrakesch.
      pt: Partida muito cedo com lanterna frontal pelo circo sul para chegar ao cume ao nascer do sol. Regresso ao refúgio para almoçar, descida pelo vale até Imlil e regresso a Marraquexe.
      ar: انطلاق مبكر جدا بمصابيح الرأس عبر الحلبة الجنوبية للوصول إلى القمة مع الشروق. العودة إلى الملجأ للغداء، ثم النزول إلى إمليل والعودة بالسيارة إلى مراكش.
