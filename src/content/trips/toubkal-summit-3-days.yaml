goodToKnow:
  - en: The summit day is long (about 9–10 hours of walking). Walking regularly in the weeks before helps a lot.
    fr: La journée du sommet est longue (environ 9 à 10 h de marche). Marcher régulièrement les semaines précédentes aide beaucoup.
    es: El día de cumbre es largo (unas 9–10 horas de marcha). Caminar con regularidad las semanas previas ayuda mucho.
    de: Der Gipfeltag ist lang (etwa 9–10 Stunden Gehzeit). Regelmäßiges Wandern in den Wochen davor hilft sehr.
    pt: O dia do cume é longo (cerca de 9–10 horas de caminhada). Caminhar regularmente nas semanas anteriores ajuda muito.
    ar: يوم القمة طويل (حوالي 9 إلى 10 ساعات من المشي). المشي بانتظام في الأسابيع السابقة يساعد كثيرا.
  - en: From December to March the summit is under snow and the trip becomes a winter ascent with crampons. Ask us about winter dates.
    fr: De décembre à mars, le sommet est enneigé et le trek devient une ascension hivernale avec crampons. Demandez-nous pour les dates d’hiver.
    es: De diciembre a marzo la cumbre está nevada y el viaje se convierte en una ascensión invernal con crampones. Pregúntenos por las fechas de invierno.
    de: Von Dezember bis März liegt der Gipfel unter Schnee, und die Tour wird zur Winterbesteigung mit Steigeisen. Fragen Sie uns nach Winterterminen.
    pt: De dezembro a março o cume está coberto de neve e a viagem passa a ser uma subida de inverno com crampons. Pergunte-nos pelas datas de inverno.
    ar: من دجنبر إلى مارس تكون القمة مغطاة بالثلج وتصبح الرحلة صعودا شتويا بالمسامير الثلجية. اسألونا عن مواعيد الشتاء.
  - en: Weather decides. If the guide judges the summit unsafe, you turn back. Your safety comes first.
    fr: La météo décide. Si le guide juge le sommet dangereux, on fait demi-tour. Votre sécurité passe avant tout.
    es: Manda el tiempo. Si el guía considera que la cumbre no es segura, se da la vuelta. Su seguridad es lo primero.
    de: Das Wetter entscheidet. Hält der Guide den Gipfel für unsicher, kehren Sie um. Ihre Sicherheit geht vor.
    pt: Quem decide é o tempo. Se o guia considerar o cume inseguro, volta-se para trás. A sua segurança está em primeiro lugar.
    ar: الطقس هو الذي يقرر. إذا رأى المرشد أن القمة غير آمنة، نعود أدراجنا. سلامتكم أولا.
