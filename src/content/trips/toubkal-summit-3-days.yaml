      ar: صعود منتظم في وادي ميزان، مع استراحة قرب نقطة المراقبة وغداء في سيدي شمهروش. بعد الظهر يصعد المسار إلى الملجأ حيث تبيتون على ارتفاع 3207 أمتار.
