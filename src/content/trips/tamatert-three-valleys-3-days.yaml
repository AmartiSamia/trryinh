category: trekking
popularity: 60
title:
  en: Tamatert and the three valleys, 3 days
  fr: Tamatert et les trois vallées, 3 jours
  ar: تماترت والوديان الثلاثة، 3 أيام
summary:
  en: Village to village through the Imlil, Imnane and Ourika valleys. Guesthouse nights, terraced fields and easy-going mountain paths.
  fr: De village en village entre les vallées d’Imlil, d’Imnane et de l’Ourika. Nuits en gîte, cultures en terrasses et sentiers de montagne sans difficulté.
  ar: من قرية إلى قرية عبر وديان إمليل وإمنان وأوريكا. ليالٍ في دور الضيافة، حقول مدرجة ومسالك جبلية سهلة.
about:
  en: >-
    The best trek if you want to see how people live in the High Atlas. You cross Tizi n’Tamatert
    from Imlil into the Imnane valley, then over to the upper Ourika valley, sleeping in family
    guesthouses. Walks are 4–6 hours a day on good paths, with tea stops in villages and views of
    the Toubkal peaks behind you.
  fr: >-
    Le meilleur trek pour voir comment on vit dans le Haut Atlas. Vous passez le Tizi n’Tamatert
    d’Imlil vers la vallée d’Imnane, puis rejoignez la haute vallée de l’Ourika, en dormant dans des
    gîtes familiaux. 4 à 6 h de marche par jour sur de bons sentiers, avec des pauses thé dans les
    villages et les sommets du Toubkal derrière vous.
  ar: >-
    أفضل رحلة لرؤية كيف يعيش الناس في الأطلس الكبير. تعبرون تيزي نتماترت من إمليل إلى وادي إمنان، ثم إلى
    أعالي وادي أوريكا، وتبيتون في دور ضيافة عائلية. من 4 إلى 6 ساعات من المشي يوميا على مسالك جيدة، مع
    استراحات شاي في القرى وقمم توبقال خلفكم.
