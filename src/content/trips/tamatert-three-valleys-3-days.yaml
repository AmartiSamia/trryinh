summary:
  en: Village to village through the Imlil, Imnane and Ourika valleys. Guesthouse nights, terraced fields and easy-going mountain paths.
  fr: De village en village entre les vallées d’Imlil, d’Imnane et de l’Ourika. Nuits en gîte, cultures en terrasses et sentiers de montagne sans difficulté.
  es: De pueblo en pueblo por los valles de Imlil, Imnane y Ourika. Noches en casas de huéspedes, bancales y senderos de montaña cómodos.
  de: Von Dorf zu Dorf durch die Täler von Imlil, Imnane und Ourika. Nächte in Gästehäusern, Terrassenfelder und angenehme Bergwege.
  pt: De aldeia em aldeia pelos vales de Imlil, Imnane e Ourika. Noites em casas de hóspedes, socalcos e trilhos de montanha acessíveis.
  ar: من قرية إلى قرية عبر وديان إمليل وإمنان وأوريكا. ليالٍ في دور الضيافة، حقول مدرجة ومسالك جبلية سهلة.
about:
  en: >-
    The best trek if you want to see how people live in the High Atlas. You cross Tizi n’Tamatert from Imlil into the Imnane valley, then over to the upper Ourika valley, sleeping in family guesthouses. Walks are 4–6 hours a day on good paths, with tea stops in villages and views of the Toubkal peaks behind you.
  fr: >-
    Le meilleur trek pour voir comment on vit dans le Haut Atlas. Vous passez le Tizi n’Tamatert d’Imlil vers la vallée d’Imnane, puis rejoignez la haute vallée de l’Ourika, en dormant dans des gîtes familiaux. 4 à 6 h de marche par jour sur de bons sentiers, avec des pauses thé dans les villages et les sommets du Toubkal derrière vous.
  es: El mejor trek para ver cómo se vive en el Alto Atlas. Cruza el Tizi n’Tamatert desde Imlil al valle de Imnane y después pasa al alto valle del Ourika, durmiendo en casas familiares. Caminatas de 4–6 horas al día por buenos senderos, con paradas para el té en los pueblos y las cumbres del Toubkal a la espalda.
  de: Der beste Trek, um zu sehen, wie man im Hohen Atlas lebt. Sie überqueren den Tizi n’Tamatert von Imlil ins Imnane-Tal und wechseln dann ins obere Ourika-Tal, übernachtet wird in Familien-Gästehäusern. 4–6 Stunden Gehzeit pro Tag auf guten Wegen, mit Teepausen in den Dörfern und den Toubkal-Gipfeln im Rücken.
  pt: O melhor trekking para ver como se vive no Alto Atlas. Atravessa o Tizi n’Tamatert de Imlil para o vale de Imnane e depois passa para o alto vale de Ourika, dormindo em casas de família. Caminhadas de 4–6 horas por dia em bons trilhos, com paragens para chá nas aldeias e os cumes do Toubkal nas suas costas.
  ar: >-
    أفضل رحلة لرؤية كيف يعيش الناس في الأطلس الكبير. تعبرون تيزي نتماترت من إمليل إلى وادي إمنان، ثم إلى أعالي وادي أوريكا، وتبيتون في دور ضيافة عائلية. من 4 إلى 6 ساعات من المشي يوميا على مسالك جيدة، مع استراحات شاي في القرى وقمم توبقال خلفكم.
