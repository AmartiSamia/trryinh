title:
  en: Grand tour of Morocco, 12 days
  fr: Grand tour du Maroc, 12 jours
  ar: الجولة الكبرى في المغرب، 12 يوما
summary:
  en: The whole country in twelve days. Imperial cities, the blue town of Chefchaouen, the Sahara, the gorges and kasbahs, the High Atlas and Essaouira on the ocean.
  fr: Tout le pays en douze jours. Villes impériales, Chefchaouen la bleue, le Sahara, les gorges et kasbahs, le Haut Atlas et Essaouira sur l’océan.
  ar: البلد كله في اثني عشر يوما. المدن الإمبراطورية، شفشاون الزرقاء، الصحراء، المضايق والقصبات، الأطلس الكبير والصويرة على المحيط.
about:
  en: >-
    A private loop from Casablanca for travellers who want to see everything once. North to Rabat
    and Chefchaouen, then Fes and the Middle Atlas, south to the Merzouga dunes, west along the road
    of the kasbahs to Aït Benhaddou, a night in the mountains at Imlil, Marrakech and a final day by
    the sea in Essaouira. Your driver adapts the pace; every night is booked in advance.
  fr: >-
    Une boucle privée depuis Casablanca pour qui veut tout voir une fois. Au nord vers Rabat et
    Chefchaouen, puis Fès et le Moyen Atlas, au sud vers les dunes de Merzouga, à l’ouest par la route
    des kasbahs jusqu’à Aït Benhaddou, une nuit en montagne à Imlil, Marrakech et une dernière journée
    au bord de la mer à Essaouira. Votre chauffeur adapte le rythme ; chaque nuit est réservée à l’avance.
  ar: >-
    جولة خاصة من الدار البيضاء لمن يريد رؤية كل شيء مرة واحدة. شمالا إلى الرباط وشفشاون، ثم فاس والأطلس
    المتوسط، جنوبا إلى كثبان مرزوكة، غربا عبر طريق القصبات إلى آيت بن حدو، ليلة في الجبل بإمليل، ثم مراكش
    ويوم أخير على البحر في الصويرة. يتكيف السائق مع إيقاعكم، وكل ليلة محجوزة مسبقا.
