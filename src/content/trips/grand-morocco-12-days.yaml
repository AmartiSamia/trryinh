  ar: الجولة الكبرى في المغرب، 12 يوما
summary:
  en: The whole country in twelve days. Imperial cities, the blue town of Chefchaouen, the Sahara, the gorges and kasbahs, the High Atlas and Essaouira on the ocean.
  fr: Tout le pays en douze jours. Villes impériales, Chefchaouen la bleue, le Sahara, les gorges et kasbahs, le Haut Atlas et Essaouira sur l’océan.
  es: Todo el país en doce días. Ciudades imperiales, el pueblo azul de Chefchaouen, el Sáhara, las gargantas y kasbahs, el Alto Atlas y Essaouira junto al océano.
  de: Das ganze Land in zwölf Tagen. Königsstädte, die blaue Stadt Chefchaouen, die Sahara, Schluchten und Kasbahs, der Hohe Atlas und Essaouira am Meer.
  pt: O país inteiro em doze dias. Cidades imperiais, a cidade azul de Chefchaouen, o Sara, as gargantas e kasbahs, o Alto Atlas e Essaouira junto ao oceano.
  ar: البلد كله في اثني عشر يوما. المدن الإمبراطورية، شفشاون الزرقاء، الصحراء، المضايق والقصبات، الأطلس الكبير والصويرة على المحيط.
about:
  en: >-
    A private loop from Casablanca for travellers who want to see everything once. North to Rabat and Chefchaouen, then Fes and the Middle Atlas, south to the Merzouga dunes, west along the road of the kasbahs to Aït Benhaddou, a night in the mountains at Imlil, Marrakech and a final day by the sea in Essaouira. Your driver adapts the pace; every night is booked in advance.
  fr: >-
    Une boucle privée depuis Casablanca pour qui veut tout voir une fois. Au nord vers Rabat et Chefchaouen, puis Fès et le Moyen Atlas, au sud vers les dunes de Merzouga, à l’ouest par la route des kasbahs jusqu’à Aït Benhaddou, une nuit en montagne à Imlil, Marrakech et une dernière journée au bord de la mer à Essaouira. Votre chauffeur adapte le rythme ; chaque nuit est réservée à l’avance.
  es: Un circuito privado desde Casablanca para quien quiere verlo todo una vez. Al norte hacia Rabat y Chefchaouen, después Fez y el Atlas Medio, al sur hacia las dunas de Merzouga, al oeste por la ruta de las kasbahs hasta Aït Benhaddou, una noche en la montaña en Imlil, Marrakech y un último día junto al mar en Essaouira. Su conductor adapta el ritmo; todas las noches se reservan con antelación.
  de: Eine private Rundreise ab Casablanca für alle, die einmal alles sehen möchten. Nach Norden nach Rabat und Chefchaouen, dann Fès und der Mittlere Atlas, nach Süden zu den Dünen von Merzouga, westwärts über die Straße der Kasbahs nach Aït Benhaddou, eine Nacht in den Bergen in Imlil, Marrakesch und ein letzter Tag am Meer in Essaouira. Ihr Fahrer passt das Tempo an; alle Nächte sind im Voraus gebucht.
  pt: Um circuito privado desde Casablanca para quem quer ver tudo uma vez. A norte, Rabat e Chefchaouen; depois Fez e o Médio Atlas; a sul, as dunas de Merzouga; a oeste, a estrada das kasbahs até Aït Benhaddou, uma noite na montanha em Imlil, Marraquexe e um último dia junto ao mar em Essaouira. O motorista adapta o ritmo; todas as noites são reservadas com antecedência.
  ar: >-
    جولة خاصة من الدار البيضاء لمن يريد رؤية كل شيء مرة واحدة. شمالا إلى الرباط وشفشاون، ثم فاس والأطلس المتوسط، جنوبا إلى كثبان مرزوكة، غربا عبر طريق القصبات إلى آيت بن حدو، ليلة في الجبل بإمليل، ثم مراكش ويوم أخير على البحر في الصويرة. يتكيف السائق مع إيقاعكم، وكل ليلة محجوزة مسبقا.
