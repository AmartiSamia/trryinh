title:
  en: Atlas three valleys and Imlil day trip
  fr: Excursion trois vallées de l’Atlas et Imlil
  es: Excursión a los tres valles del Atlas e Imlil
  de: Tagesausflug in die drei Täler des Atlas und nach Imlil
  pt: Excursão aos três vales do Atlas e a Imlil
  ar: رحلة يومية إلى وديان الأطلس الثلاثة وإمليل
summary:
  en: An easy day in the mountains, with the village of Imlil as the highlight. Asni market town, Ouirgane, a short walk around Imlil and lunch with a view of Toubkal.
  fr: Une journée facile en montagne, avec le village d’Imlil en point d’orgue. Asni et son souk, Ouirgane, une courte balade autour d’Imlil et un déjeuner face au Toubkal.
  es: Un día tranquilo en la montaña con el pueblo de Imlil como gran momento. El mercado de Asni, Ouirgane, un paseo corto por Imlil y almuerzo con vistas al Toubkal.
  de: Ein entspannter Tag in den Bergen mit dem Dorf Imlil als Höhepunkt. Der Marktort Asni, Ouirgane, ein kurzer Spaziergang in Imlil und Mittagessen mit Blick auf den Toubkal.
  pt: Um dia tranquilo na montanha, com a aldeia de Imlil como ponto alto. O mercado de Asni, Ouirgane, um pequeno passeio em Imlil e almoço com vista para o Toubkal.
  ar: يوم سهل في الجبال، وقرية إمليل هي أبرز محطاته. سوق أسني، أوركان، جولة قصيرة حول إمليل وغداء مطل على توبقال.
about:
  en: >-
    Not a hike, a mountain day for everyone. You drive up the Moulay Brahim gorge to Asni, stop by the lake and hills of Ouirgane, then go up to Imlil for a gentle walk among walnut trees and earth houses, with tea in a village home. A good choice with children or older travellers.
  fr: >-
    Pas une randonnée, une journée en montagne pour tous. Route par les gorges de Moulay Brahim jusqu’à Asni, arrêt près du lac et des collines de Ouirgane, puis montée à Imlil pour une balade tranquille entre noyers et maisons en terre, avec un thé chez l’habitant. Idéal avec des enfants ou des voyageurs âgés.
  es: No es una caminata, es un día de montaña para todos. Se sube por las gargantas de Moulay Brahim hasta Asni, se para junto al lago y las colinas de Ouirgane y luego se sube a Imlil para un paseo tranquilo entre nogales y casas de tierra, con té en una casa del pueblo. Una buena opción con niños o personas mayores.
  de: Keine Wanderung, sondern ein Bergtag für alle. Sie fahren durch die Schlucht von Moulay Brahim nach Asni, halten am See und an den Hügeln von Ouirgane und fahren dann hinauf nach Imlil zu einem gemütlichen Spaziergang zwischen Walnussbäumen und Lehmhäusern, mit Tee in einem Dorfhaus. Gut geeignet mit Kindern oder älteren Reisenden.
  pt: Não é uma caminhada, é um dia de montanha para todos. Sobe pelas gargantas de Moulay Brahim até Asni, para junto ao lago e às colinas de Ouirgane e depois sobe a Imlil para um passeio calmo entre nogueiras e casas de terra, com chá numa casa da aldeia. Uma boa escolha com crianças ou viajantes mais velhos.
  ar: >-
    ليست رحلة مشي، بل يوم جبلي للجميع. الطريق عبر مضايق مولاي إبراهيم إلى أسني، توقف قرب بحيرة وتلال أوركان، ثم الصعود إلى إمليل لجولة هادئة بين أشجار الجوز والبيوت الطينية مع شاي في بيت قروي. خيار جيد مع الأطفال أو المسافرين المسنين.
