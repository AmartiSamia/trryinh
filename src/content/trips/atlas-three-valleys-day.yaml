category: day-trip
popularity: 70
title:
  en: Atlas three valleys and Imlil day trip
  fr: Excursion trois vallées de l’Atlas et Imlil
  ar: رحلة يومية إلى وديان الأطلس الثلاثة وإمليل
summary:
  en: An easy day in the mountains, with the village of Imlil as the highlight. Asni market town, Ouirgane, a short walk around Imlil and lunch with a view of Toubkal.
  fr: Une journée facile en montagne, avec le village d’Imlil en point d’orgue. Asni et son souk, Ouirgane, une courte balade autour d’Imlil et un déjeuner face au Toubkal.
  ar: يوم سهل في الجبال، وقرية إمليل هي أبرز محطاته. سوق أسني، أوركان، جولة قصيرة حول إمليل وغداء مطل على توبقال.
about:
  en: >-
    Not a hike, a mountain day for everyone. You drive up the Moulay Brahim gorge to Asni,
    stop by the lake and hills of Ouirgane, then go up to Imlil for a gentle walk among walnut trees
    and earth houses, with tea in a village home. A good choice with children or older travellers.
  fr: >-
    Pas une randonnée, une journée en montagne pour tous. Route par les gorges de Moulay Brahim
    jusqu’à Asni, arrêt près du lac et des collines de Ouirgane, puis montée à Imlil pour une balade
    tranquille entre noyers et maisons en terre, avec un thé chez l’habitant. Idéal avec des enfants
    ou des voyageurs âgés.
  ar: >-
    ليست رحلة مشي، بل يوم جبلي للجميع. الطريق عبر مضايق مولاي إبراهيم إلى أسني، توقف قرب بحيرة وتلال
    أوركان، ثم الصعود إلى إمليل لجولة هادئة بين أشجار الجوز والبيوت الطينية مع شاي في بيت قروي. خيار جيد
    مع الأطفال أو المسافرين المسنين.
