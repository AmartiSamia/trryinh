title:
  en: Amsouzart and Lake Ifni, 3 days
  fr: Amsouzart et lac d’Ifni, 3 jours
  ar: أمسوزارت وبحيرة إفني، 3 أيام
summary:
  en: A gentler way to reach Lake Ifni, from the south side of the Toubkal massif. Village life in Amsouzart and a night by the lake.
  fr: Une façon plus douce de rejoindre le lac d’Ifni, par le versant sud du Toubkal. La vie du village à Amsouzart et une nuit au bord du lac.
  ar: طريقة أسهل للوصول إلى بحيرة إفني من الجهة الجنوبية لجبال توبقال. حياة القرية في أمسوزارت وليلة بجانب البحيرة.
about:
  en: >-
    Amsouzart sits on the southern side of the Toubkal massif, far from the busy Imlil trails.
    After a scenic drive you spend the first night in a village guesthouse, walk up the valley the
    next day to Lake Ifni and sleep by the water, then walk back down and drive to Marrakech.
    Moderate days, big landscapes and very few other walkers.
  fr: >-
    Amsouzart se trouve sur le versant sud du massif du Toubkal, loin des sentiers fréquentés d’Imlil.
    Après une belle route, première nuit dans un gîte du village ; le lendemain, montée dans la vallée
    jusqu’au lac d’Ifni et nuit au bord de l’eau ; puis descente et retour à Marrakech. Des journées
    modérées, de grands paysages et très peu de marcheurs.
  ar: >-
    تقع أمسوزارت في الجهة الجنوبية لجبال توبقال بعيدا عن مسالك إمليل المزدحمة. بعد طريق جميل تقضون الليلة
    الأولى في دار ضيافة بالقرية، وفي اليوم الموالي تصعدون الوادي إلى بحيرة إفني وتبيتون بجانب الماء، ثم
    تنزلون وتعودون إلى مراكش. أيام معتدلة ومناظر واسعة وقلة من المتنزهين.
