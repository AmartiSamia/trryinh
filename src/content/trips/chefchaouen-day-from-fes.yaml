title:
  en: Chefchaouen day trip from Fes
  fr: Excursion à Chefchaouen depuis Fès
  ar: رحلة يومية إلى شفشاون من فاس
summary:
  en: The blue town of the Rif mountains. A day of free wandering in Chefchaouen’s painted lanes, with a viewpoint walk to the Spanish mosque at sunset.
  fr: La ville bleue des montagnes du Rif. Une journée libre dans les ruelles peintes de Chefchaouen, avec une marche jusqu’à la mosquée espagnole au coucher du soleil.
  ar: المدينة الزرقاء في جبال الريف. يوم حر في أزقة شفشاون الملونة، مع مشي إلى المسجد الإسباني عند الغروب.
about:
  en: >-
    About three and a half hours from Fes through olive groves and the Rif foothills. In
    Chefchaouen you have the day to explore the blue medina, the kasbah and the Outa el-Hammam
    square, and to walk up to the Spanish mosque for the view. Drive back to Fes in the evening.
  fr: >-
    Environ trois heures et demie depuis Fès, à travers oliveraies et contreforts du Rif. À Chefchaouen,
    la journée est à vous pour explorer la médina bleue, la kasbah et la place Outa el-Hammam, et
    monter à la mosquée espagnole pour la vue. Retour à Fès le soir.
  ar: >-
    حوالي ثلاث ساعات ونصف من فاس عبر حقول الزيتون وسفوح الريف. في شفشاون لديكم اليوم لاستكشاف المدينة
    الزرقاء والقصبة وساحة وطاء الحمام، والصعود إلى المسجد الإسباني للاستمتاع بالمنظر. العودة إلى فاس مساءً.
