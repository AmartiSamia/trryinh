title:
  en: Fes to Marrakech via the Merzouga desert, 3 days
  fr: De Fès à Marrakech par le désert de Merzouga, 3 jours
  ar: من فاس إلى مراكش عبر صحراء مرزوكة، 3 أيام
summary:
  en: The best way to travel between Fes and Marrakech. Cedar forests of the Middle Atlas, a night in the Erg Chebbi dunes and the road of the kasbahs.
  fr: La plus belle façon de relier Fès à Marrakech. Forêts de cèdres du Moyen Atlas, nuit dans les dunes de l’erg Chebbi et route des kasbahs.
  ar: أجمل طريقة للتنقل بين فاس ومراكش. غابات الأرز في الأطلس المتوسط، ليلة في كثبان عرق الشبي وطريق القصبات.
about:
  en: >-
    Instead of the train, cross the country. You leave Fes through Ifrane and the cedar forests of
    the Middle Atlas, follow the Ziz valley down to the Sahara and ride camels to a camp in Erg
    Chebbi. Then the Todra and Dades gorges, Ouarzazate and the Tichka pass bring you to Marrakech.
    A 4-day version with more time on the way is possible on request.
  fr: >-
    Plutôt que le train, traversez le pays. Vous quittez Fès par Ifrane et les cèdres du Moyen Atlas,
    suivez la vallée du Ziz jusqu’au Sahara et rejoignez à dos de dromadaire un camp de l’erg Chebbi.
    Puis les gorges du Todra et du Dadès, Ouarzazate et le col du Tichka vous mènent à Marrakech.
    Une version en 4 jours, plus tranquille, est possible sur demande.
  ar: >-
    بدلا من القطار، اعبروا البلد. تغادرون فاس عبر إفران وغابات الأرز في الأطلس المتوسط، وتتبعون وادي زيز
    حتى الصحراء، ثم تركبون الجمال إلى مخيم في عرق الشبي. بعد ذلك تقودكم مضايق تودغى ودادس وورزازات وممر
    تيشكا إلى مراكش. نسخة من 4 أيام بوقت أكثر في الطريق ممكنة عند الطلب.
