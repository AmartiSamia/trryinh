summary:
  en: Africa’s highest ski station, one hour from Marrakech. Snow and sledges in winter, green pastures, lakes and prehistoric rock engravings in summer.
  fr: La plus haute station de ski d’Afrique, à une heure de Marrakech. Neige et luges en hiver, pâturages verts, lacs et gravures rupestres préhistoriques en été.
  es: La estación de esquí más alta de África, a una hora de Marrakech. Nieve y trineos en invierno; prados verdes, lagos y grabados rupestres prehistóricos en verano.
  de: Afrikas höchstes Skigebiet, eine Stunde von Marrakesch. Schnee und Schlitten im Winter, grüne Almen, Seen und prähistorische Felsgravuren im Sommer.
  pt: A estância de esqui mais alta de África, a uma hora de Marraquexe. Neve e trenós no inverno; prados verdes, lagos e gravuras rupestres pré-históricas no verão.
  ar: أعلى محطة تزلج في إفريقيا، على بعد ساعة من مراكش. ثلج وزلاجات في الشتاء، ومراعٍ خضراء وبحيرات ونقوش صخرية من عصور ما قبل التاريخ في الصيف.
about:
  en: The road climbs from the Ourika valley through pine forests to Oukaïmeden, a high plateau at 2,600 m ringed by peaks above 3,000 m. In winter you can ski, rent a sledge or simply play in the snow. In summer, a local guide walks you across the shepherds’ pastures to rock engravings several thousand years old and to the small lake below the ridges. Lunch in a mountain restaurant, then back down to Marrakech.
  fr: La route monte depuis la vallée de l’Ourika à travers les forêts de pins jusqu’à Oukaïmeden, un haut plateau à 2 600 m entouré de sommets de plus de 3 000 m. En hiver, ski, luge ou simplement jeux dans la neige. En été, un guide local vous emmène à travers les pâturages des bergers jusqu’à des gravures rupestres vieilles de plusieurs millénaires et au petit lac sous les crêtes. Déjeuner dans un restaurant de montagne, puis retour à Marrakech.
  es: La carretera sube desde el valle del Ourika entre pinares hasta Oukaïmeden, una meseta a 2600 m rodeada de cumbres de más de 3000 m. En invierno puede esquiar, alquilar un trineo o simplemente jugar en la nieve. En verano, un guía local le lleva por los pastos de los pastores hasta grabados rupestres de varios miles de años y al pequeño lago bajo las crestas. Almuerzo en un restaurante de montaña y regreso a Marrakech.
  de: Die Straße steigt vom Ourika-Tal durch Kiefernwälder nach Oukaïmeden, einer Hochebene auf 2.600 m, umgeben von Gipfeln über 3.000 m. Im Winter können Sie Ski fahren, einen Schlitten leihen oder einfach im Schnee spielen. Im Sommer führt Sie ein einheimischer Guide über die Hirtenweiden zu jahrtausendealten Felsgravuren und zum kleinen See unter den Graten. Mittagessen in einem Bergrestaurant, dann zurück nach Marrakesch.
  pt: A estrada sobe do vale de Ourika entre pinhais até Oukaïmeden, um planalto a 2600 m rodeado de cumes acima dos 3000 m. No inverno pode esquiar, alugar um trenó ou simplesmente brincar na neve. No verão, um guia local leva-o pelas pastagens dos pastores até gravuras rupestres com milhares de anos e ao pequeno lago sob as cristas. Almoço num restaurante de montanha e regresso a Marraquexe.
  ar: يصعد الطريق من وادي أوريكا عبر غابات الصنوبر إلى أوكايمدن، هضبة على ارتفاع 2600 متر تحيط بها قمم تتجاوز 3000 متر. في الشتاء يمكنكم التزلج أو كراء زلاجة أو اللعب في الثلج. وفي الصيف يرافقكم مرشد محلي عبر مراعي الرعاة إلى نقوش صخرية عمرها آلاف السنين وإلى البحيرة الصغيرة تحت القمم. غداء في مطعم جبلي ثم العودة إلى مراكش.
