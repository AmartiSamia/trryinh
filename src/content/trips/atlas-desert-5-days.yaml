title:
  en: Atlas and Sahara, 5 days
  fr: Atlas et Sahara, 5 jours
  ar: الأطلس والصحراء، 5 أيام
summary:
  en: The best of both worlds in five days. Two days of walking from Imlil with nights in the mountains, then the road over the Atlas to the Merzouga dunes.
  fr: Le meilleur des deux mondes en cinq jours. Deux jours de marche depuis Imlil avec nuits en montagne, puis la route de l’Atlas jusqu’aux dunes de Merzouga.
  ar: أفضل ما في العالمين في خمسة أيام. يومان من المشي انطلاقا من إمليل مع ليالٍ في الجبل، ثم الطريق عبر الأطلس إلى كثبان مرزوكة.
about:
  en: >-
    Start where we live: two days of walking among the villages of the Imlil valleys, with a
    night in a guesthouse. Then the car takes you over the High Atlas to Aït Benhaddou, the Dades
    valley and Merzouga, where you ride camels into Erg Chebbi for a night at camp before driving
    back to Marrakech. Mountains, villages, kasbahs and dunes in one trip.
  fr: >-
    On commence là où nous vivons : deux jours de marche entre les villages des vallées d’Imlil, avec une
    nuit en gîte. Puis la voiture vous emmène par le Haut Atlas à Aït Benhaddou, la vallée du Dadès et
    Merzouga, où les dromadaires vous mènent dans l’erg Chebbi pour une nuit au camp avant le retour à
    Marrakech. Montagnes, villages, kasbahs et dunes en un seul voyage.
  ar: >-
    نبدأ حيث نعيش: يومان من المشي بين قرى وديان إمليل مع ليلة في دار ضيافة. ثم تأخذكم السيارة عبر
    الأطلس الكبير إلى آيت بن حدو ووادي دادس ومرزوكة، حيث تركبون الجمال إلى عرق الشبي لقضاء ليلة في المخيم
    قبل العودة إلى مراكش. جبال وقرى وقصبات وكثبان في رحلة واحدة.
