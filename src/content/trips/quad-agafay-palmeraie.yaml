title:
  en: Quad bike or buggy in Agafay or the Palmeraie
  fr: Quad ou buggy à Agafay ou dans la Palmeraie
  ar: الدراجة الرباعية أو الباجي في أكفاي أو النخيل
summary:
  en: Two hours on a quad or buggy through the palm grove or the stony hills of Agafay, with a stop for mint tea in a village.
  fr: Deux heures en quad ou en buggy dans la palmeraie ou les collines caillouteuses d’Agafay, avec une pause thé dans un village.
  ar: ساعتان على دراجة رباعية أو باجي عبر النخيل أو تلال أكفاي الحجرية، مع توقف لشرب الشاي في قرية.
about:
  en: >-
    A short, fun outing for when you need a break from the medina. After a safety briefing and
    with helmets and scarves provided, you follow a guide on tracks through the palm grove or the
    Agafay hills. No licence needed; children can ride as passengers.
  fr: >-
    Une sortie courte et amusante pour souffler loin de la médina. Après les consignes de sécurité,
    casque et chèche fournis, vous suivez un guide sur des pistes dans la palmeraie ou les collines
    d’Agafay. Pas de permis nécessaire ; les enfants peuvent monter en passagers.
  ar: >-
    خرجة قصيرة وممتعة للاستراحة من المدينة العتيقة. بعد تعليمات السلامة، ومع توفير الخوذة والوشاح، تتبعون
    مرشدا على مسالك في النخيل أو تلال أكفاي. لا حاجة إلى رخصة، ويمكن للأطفال الركوب كركاب.
