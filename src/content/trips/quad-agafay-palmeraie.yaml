summary:
  en: Two hours on a quad or buggy through the palm grove or the stony hills of Agafay, with a stop for mint tea in a village.
  fr: Deux heures en quad ou en buggy dans la palmeraie ou les collines caillouteuses d’Agafay, avec une pause thé dans un village.
  es: Dos horas en quad o buggy por el palmeral o las colinas pedregosas de Agafay, con parada para un té a la menta en un pueblo.
  de: Zwei Stunden mit Quad oder Buggy durch den Palmenhain oder die steinigen Hügel von Agafay, mit einer Teepause in einem Dorf.
  pt: Duas horas de moto-quatro ou buggy pelo palmeiral ou pelas colinas pedregosas de Agafay, com paragem para chá de menta numa aldeia.
  ar: ساعتان على دراجة رباعية أو باجي عبر النخيل أو تلال أكفاي الحجرية، مع توقف لشرب الشاي في قرية.
about:
  en: >-
    A short, fun outing for when you need a break from the medina. After a safety briefing and with helmets and scarves provided, you follow a guide on tracks through the palm grove or the Agafay hills. No licence needed; children can ride as passengers.
  fr: >-
    Une sortie courte et amusante pour souffler loin de la médina. Après les consignes de sécurité, casque et chèche fournis, vous suivez un guide sur des pistes dans la palmeraie ou les collines d’Agafay. Pas de permis nécessaire ; les enfants peuvent monter en passagers.
  es: Una salida corta y divertida para descansar de la medina. Tras las instrucciones de seguridad, con casco y pañuelo incluidos, sigue a un guía por pistas del palmeral o de las colinas de Agafay. No hace falta carné; los niños pueden ir de pasajeros.
  de: Ein kurzer, lustiger Ausflug als Pause von der Medina. Nach der Sicherheitseinweisung, mit Helm und Tuch, folgen Sie einem Guide auf Pisten durch den Palmenhain oder die Hügel von Agafay. Kein Führerschein nötig; Kinder können als Beifahrer mitfahren.
  pt: Uma saída curta e divertida para descansar da medina. Depois das instruções de segurança, com capacete e lenço incluídos, segue um guia por pistas no palmeiral ou nas colinas de Agafay. Não é preciso carta; as crianças podem ir como passageiras.
  ar: >-
    خرجة قصيرة وممتعة للاستراحة من المدينة العتيقة. بعد تعليمات السلامة، ومع توفير الخوذة والوشاح، تتبعون مرشدا على مسالك في النخيل أو تلال أكفاي. لا حاجة إلى رخصة، ويمكن للأطفال الركوب كركاب.
