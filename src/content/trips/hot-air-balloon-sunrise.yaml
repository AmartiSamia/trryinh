category: activity
popularity: 76
title:
  en: Hot-air balloon flight at sunrise
  fr: Vol en montgolfière au lever du soleil
  ar: رحلة بالمنطاد عند شروق الشمس
summary:
  en: Float over the villages and fields north of Marrakech as the sun comes up over the Atlas. About one hour in the air, then breakfast in a Berber tent.
  fr: Survolez les villages et les champs au nord de Marrakech pendant que le soleil se lève sur l’Atlas. Environ une heure de vol, puis petit-déjeuner sous une tente berbère.
  ar: حلّقوا فوق القرى والحقول شمال مراكش بينما تشرق الشمس فوق الأطلس. حوالي ساعة في الجو، ثم فطور في خيمة أمازيغية.
about:
  en: >-
    A very early pickup takes you to the launch site outside the city. While the balloon is
    inflated you have tea; then you rise slowly to watch the sun light up the Jbilet hills and the
    snowy High Atlas. After landing, a traditional breakfast and a certificate. Flights are run by a
    licensed balloon company; we organise the booking and the transfer.
  fr: >-
    Prise en charge très matinale vers le site de décollage hors de la ville. Thé pendant le gonflage,
    puis montée lente pour voir le soleil éclairer les collines des Jbilet et le Haut Atlas enneigé.
    Après l’atterrissage, petit-déjeuner traditionnel et certificat. Les vols sont assurés par une
    compagnie agréée ; nous organisons la réservation et le transfert.
  ar: >-
    يتم استقبالكم في وقت مبكر جدا إلى موقع الإقلاع خارج المدينة. تشربون الشاي أثناء نفخ المنطاد، ثم ترتفعون
    ببطء لمشاهدة الشمس تضيء تلال الجبيلات والأطلس الكبير المثلج. بعد الهبوط، فطور تقليدي وشهادة. تُنظَّم
    الرحلات من طرف شركة منطاد مرخصة، ونحن نتكفل بالحجز والنقل.
