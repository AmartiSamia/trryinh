title:
  en: Marrakech street food tour
  fr: Tour street food à Marrakech
  ar: جولة أكل الشارع في مراكش
summary:
  en: An evening walk through the medina, eating what people in Marrakech actually eat. Msemen, harira, tangia, snail broth for the brave, and mint tea to finish.
  fr: Une balade du soir dans la médina pour manger ce que mangent vraiment les Marrakchis. Msemen, harira, tanjia, bouillon d’escargots pour les courageux, et thé à la menthe pour finir.
  ar: جولة مسائية في المدينة العتيقة لتذوق ما يأكله أهل مراكش فعلا. المسمن، الحريرة، الطنجية، مرق الببوش للشجعان، وشاي بالنعناع في الختام.
about:
  en: >-
    About ten tastings over three hours, in small stalls and family places away from the tourist
    menus. Your guide explains what you eat and how it is made, from the bread ovens to the tangia
    cooked slowly in the ashes of the hammam fire. Come hungry; vegetarians are welcome, just tell us.
  fr: >-
    Une dizaine de dégustations en trois heures, dans de petits stands et des adresses familiales loin
    des menus touristiques. Votre guide explique ce que vous mangez et comment c’est préparé, des fours à
    pain à la tanjia cuite lentement dans les cendres du feu du hammam. Venez le ventre vide ; les
    végétariens sont les bienvenus, dites-le-nous.
  ar: >-
    حوالي عشر تذوقات في ثلاث ساعات، في أكشاك صغيرة ومحلات عائلية بعيدا عن القوائم السياحية. يشرح لكم
    المرشد ما تأكلون وكيف يُحضَّر، من أفران الخبز إلى الطنجية المطبوخة ببطء في رماد نار الحمام. تعالوا
    جائعين، والنباتيون مرحب بهم، فقط أخبرونا.
