title:
  en: Traditional hammam and massage
  fr: Hammam traditionnel et massage
  ar: حمام تقليدي وتدليك
summary:
  en: The Moroccan way to rest after a trek or a day in the souks. Steam, black soap, a full scrub with the kessa glove, then an argan oil massage.
  fr: La façon marocaine de se reposer après un trek ou une journée dans les souks. Vapeur, savon noir, gommage au gant kessa, puis massage à l’huile d’argan.
  ar: الطريقة المغربية للاسترخاء بعد رحلة مشي أو يوم في الأسواق. البخار، الصابون البلدي، التكسيل بالكيس، ثم تدليك بزيت الأركان.
about:
  en: >-
    We book you into a clean, well-run hammam in the medina. An attendant takes you through the
    steam rooms, washes you with black soap and scrubs you head to toe, then you relax with mint
    tea before a massage with argan oil. Separate spaces for women and men; couples’ rooms on request.
  fr: >-
    Nous vous réservons un hammam propre et bien tenu dans la médina. Une préposée ou un préposé vous
    accompagne dans les salles de vapeur, vous lave au savon noir et vous gomme de la tête aux pieds,
    puis vous vous détendez avec un thé avant un massage à l’huile d’argan. Espaces séparés femmes et
    hommes ; cabines pour couples sur demande.
  ar: >-
    نحجز لكم في حمام نظيف ومنظم في المدينة العتيقة. يرافقكم مختص أو مختصة في غرف البخار، ويغسلكم بالصابون
    البلدي ويكسّلكم من الرأس إلى القدمين، ثم تسترخون مع كأس شاي قبل التدليك بزيت الأركان. فضاءات منفصلة
    للنساء والرجال، وغرف للأزواج عند الطلب.
