category: trekking
popularity: 50
title:
  en: M’Goun summit trek, 4 days
  fr: Trek du M’Goun, 4 jours
  ar: رحلة قمة مكون، 4 أيام
summary:
  en: Morocco’s third-highest summit (4,071 m), from the green Aït Bouguemez valley. Long ridges, wide views and nights under canvas.
  fr: Le troisième sommet du Maroc (4 071 m), depuis la verte vallée des Aït Bouguemez. Longues crêtes, grands horizons et nuits sous tente.
  ar: ثالث أعلى قمة في المغرب (4071 م)، انطلاقا من وادي آيت بوكماز الأخضر. سلاسل طويلة ومناظر واسعة وليالٍ في الخيام.
about:
  en: >-
    The M’Goun is a huge whaleback ridge in the Central High Atlas, far from Marrakech and far from
    the crowds. You start in the Aït Bouguemez, the "happy valley", climb to the Tarkeddit plateau
    and reach the summit along a long ridge with views over half of Morocco. A trek for walkers
    who like space and silence.
  fr: >-
    Le M’Goun est une immense crête en dos de baleine dans le Haut Atlas central, loin de Marrakech
    et loin de la foule. Départ de la vallée des Aït Bouguemez, la « vallée heureuse », montée au
    plateau de Tarkeddit et sommet par une longue crête avec vue sur la moitié du Maroc. Un trek pour
    ceux qui aiment l’espace et le silence.
  ar: >-
    جبل مكون سلسلة ضخمة في الأطلس الكبير الأوسط، بعيدة عن مراكش وعن الزحام. تنطلقون من آيت بوكماز، "الوادي
    السعيد"، وتصعدون إلى هضبة تاركديت، ثم تبلغون القمة عبر سلسلة طويلة تطل على نصف المغرب. رحلة لمن يحب
    الفضاء والصمت.
