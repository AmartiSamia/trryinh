summary:
  en: A real taste of the High Atlas in one day. Walk from Imlil through Aroumd to the shrine of Sidi Chamharouch, with lunch in a village house.
  fr: Un vrai goût du Haut Atlas en une journée. Marche d’Imlil à Aroumd puis au sanctuaire de Sidi Chamharouch, avec déjeuner chez l’habitant.
  es: Un auténtico Alto Atlas en un solo día. Caminata desde Imlil por Aroumd hasta el santuario de Sidi Chamharouch, con almuerzo en una casa del pueblo.
  de: Der Hohe Atlas an einem Tag. Wanderung von Imlil über Aroumd zum Heiligtum Sidi Chamharouch, mit Mittagessen in einem Dorfhaus.
  pt: O verdadeiro Alto Atlas num só dia. Caminhada desde Imlil por Aroumd até ao santuário de Sidi Chamharouch, com almoço numa casa da aldeia.
  ar: لمحة حقيقية عن الأطلس الكبير في يوم واحد. مشي من إمليل عبر أرومد إلى ضريح سيدي شمهروش، مع غداء في بيت قروي.
about:
  en: >-
    Leave Marrakech in the morning and be walking in the mountains before 10. From Imlil the path climbs to Aroumd, the highest village of the valley, crosses the wide riverbed and follows the Mizane up to Sidi Chamharouch, a pilgrimage place built around a huge white rock. Lunch is tagine in a local house; back in Marrakech before dark.
  fr: >-
    Départ de Marrakech le matin et marche en montagne avant 10 h. D’Imlil, le sentier monte à Aroumd, le plus haut village de la vallée, traverse le large lit de la rivière et suit la Mizane jusqu’à Sidi Chamharouch, lieu de pèlerinage bâti autour d’un énorme rocher blanc. Déjeuner : tajine chez l’habitant ; retour à Marrakech avant la nuit.
  es: "Sale de Marrakech por la mañana y antes de las 10 ya camina por la montaña. Desde Imlil el sendero sube a Aroumd, el pueblo más alto del valle, cruza el ancho lecho del río y sigue el Mizane hasta Sidi Chamharouch, lugar de peregrinación construido junto a una enorme roca blanca. Almuerzo: tajín en una casa local; vuelta a Marrakech antes de que anochezca."
  de: Morgens Abfahrt in Marrakesch, vor 10 Uhr sind Sie schon in den Bergen unterwegs. Von Imlil steigt der Weg nach Aroumd, dem höchsten Dorf des Tals, quert das breite Flussbett und folgt dem Mizane bis Sidi Chamharouch, einem Wallfahrtsort an einem riesigen weißen Felsen. Mittags gibt es Tajine in einem Haus im Dorf; vor Einbruch der Dunkelheit sind Sie zurück in Marrakesch.
  pt: "Sai de Marraquexe de manhã e antes das 10 já está a caminhar na montanha. De Imlil o trilho sobe a Aroumd, a aldeia mais alta do vale, atravessa o largo leito do rio e segue o Mizane até Sidi Chamharouch, um local de peregrinação construído junto a uma enorme rocha branca. Almoço: tajine numa casa local; regresso a Marraquexe antes de anoitecer."
  ar: >-
    تغادرون مراكش صباحا وتبدؤون المشي في الجبال قبل العاشرة. من إمليل يصعد المسار إلى أرومد، أعلى قرية في الوادي، ثم يعبر مجرى النهر الواسع ويتبع وادي ميزان حتى سيدي شمهروش، مكان الزيارة المبني حول صخرة بيضاء ضخمة. الغداء طاجين في بيت محلي، والعودة إلى مراكش قبل حلول الظلام.
