title:
  en: Imlil and Sidi Chamharouch day hike
  fr: Randonnée d’une journée à Imlil et Sidi Chamharouch
  ar: رحلة مشي ليوم واحد إلى إمليل وسيدي شمهروش
summary:
  en: A real taste of the High Atlas in one day. Walk from Imlil through Aroumd to the shrine of Sidi Chamharouch, with lunch in a village house.
  fr: Un vrai goût du Haut Atlas en une journée. Marche d’Imlil à Aroumd puis au sanctuaire de Sidi Chamharouch, avec déjeuner chez l’habitant.
  ar: لمحة حقيقية عن الأطلس الكبير في يوم واحد. مشي من إمليل عبر أرومد إلى ضريح سيدي شمهروش، مع غداء في بيت قروي.
about:
  en: >-
    Leave Marrakech in the morning and be walking in the mountains before 10. From Imlil the path
    climbs to Aroumd, the highest village of the valley, crosses the wide riverbed and follows the
    Mizane up to Sidi Chamharouch, a pilgrimage place built around a huge white rock. Lunch is
    tagine in a local house; back in Marrakech before dark.
  fr: >-
    Départ de Marrakech le matin et marche en montagne avant 10 h. D’Imlil, le sentier monte à Aroumd,
    le plus haut village de la vallée, traverse le large lit de la rivière et suit la Mizane jusqu’à
    Sidi Chamharouch, lieu de pèlerinage bâti autour d’un énorme rocher blanc. Déjeuner : tajine chez
    l’habitant ; retour à Marrakech avant la nuit.
  ar: >-
    تغادرون مراكش صباحا وتبدؤون المشي في الجبال قبل العاشرة. من إمليل يصعد المسار إلى أرومد، أعلى قرية في
    الوادي، ثم يعبر مجرى النهر الواسع ويتبع وادي ميزان حتى سيدي شمهروش، مكان الزيارة المبني حول صخرة بيضاء
    ضخمة. الغداء طاجين في بيت محلي، والعودة إلى مراكش قبل حلول الظلام.
