itinerary:
  - title: { en: "Marrakech to the Toubkal refuge", fr: "De Marrakech au refuge du Toubkal", ar: "من مراكش إلى ملجأ توبقال" }
    text:
      en: "Morning drive to Imlil, then walk up the snowy Mizane valley to the refuge. Gear check before dinner."
      fr: "Route le matin vers Imlil, puis montée dans la vallée enneigée de la Mizane jusqu’au refuge. Vérification du matériel avant le dîner."
      ar: "التوجه صباحا إلى إمليل، ثم الصعود في وادي ميزان المثلج إلى الملجأ. فحص المعدات قبل العشاء."
    drive: 1 h 45
    walk: 6–7 h
    altitude: 3207
    sleep: { type: refuge, place: Toubkal refuge }
    meals: [lunch, dinner]
  - title: { en: "Snow skills and acclimatisation", fr: "Techniques de neige et acclimatation", ar: "تقنيات الثلج والتأقلم" }
    text:
      en: "A morning of practice on the slopes near the refuge, then an acclimatisation walk if conditions allow. Early night."
      fr: "Une matinée d’entraînement sur les pentes près du refuge, puis une marche d’acclimatation si les conditions le permettent. Coucher tôt."
      ar: "صباح من التدريب على المنحدرات القريبة من الملجأ، ثم مشي للتأقلم إذا سمحت الظروف. نوم مبكر."
