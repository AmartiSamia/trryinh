title:
  en: Toubkal winter ascent, 3 days
  fr: Toubkal en hiver, 3 jours
  ar: صعود توبقال في الشتاء، 3 أيام
summary:
  en: Toubkal under snow, with crampons and ice axe and a guide who knows the mountain in winter. Short initiation to snow techniques at the refuge.
  fr: Le Toubkal sous la neige, avec crampons et piolet et un guide qui connaît la montagne en hiver. Courte initiation aux techniques de neige au refuge.
  ar: توبقال تحت الثلج، بالمسامير الثلجية وفأس الجليد ومرشد يعرف الجبل في الشتاء. تدريب قصير على تقنيات الثلج في الملجأ.
about:
  en: >-
    From December to March the High Atlas turns white and Toubkal becomes a real winter climb.
    The route is the same as in summer, but the slopes above the refuge are covered in hard snow,
    so you walk with crampons and carry an ice axe. On arrival at the refuge your guide checks the
    gear and practises the basics with you: walking in crampons, using the axe, stopping a slip.
    Days are shorter and colder, so the pace and the turn-back time are set by the guide.
  fr: >-
    De décembre à mars, le Haut Atlas devient blanc et le Toubkal une vraie ascension hivernale.
    L’itinéraire est le même qu’en été, mais au-dessus du refuge les pentes sont couvertes de neige
    dure : on marche en crampons, piolet en main. À l’arrivée au refuge, votre guide vérifie le
    matériel et revoit avec vous les bases : marche en crampons, usage du piolet, arrêt d’une glissade.
    Les journées sont plus courtes et plus froides ; le rythme et l’heure de demi-tour sont fixés par le guide.
  ar: >-
    من دجنبر إلى مارس يكتسي الأطلس الكبير باللون الأبيض ويصبح صعود توبقال تسلقا شتويا حقيقيا. المسار هو
    نفسه كما في الصيف، لكن المنحدرات فوق الملجأ مغطاة بثلج صلب، فتمشون بالمسامير الثلجية وتحملون فأس
    الجليد. عند الوصول إلى الملجأ يتحقق المرشد من المعدات ويتدرب معكم على الأساسيات: المشي بالمسامير،
    استعمال الفأس، وإيقاف الانزلاق. الأيام أقصر وأبرد، لذلك يحدد المرشد الإيقاع ووقت العودة.
