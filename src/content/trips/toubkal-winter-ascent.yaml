    meals: [breakfast, lunch, dinner]
  - title: { en: "Summit and return", fr: "Sommet et retour", ar: "القمة والعودة" }
    text:
      en: "Early start in crampons to the summit, then the long walk down to Imlil and the drive to Marrakech."
      fr: "Départ matinal en crampons vers le sommet, puis longue descente jusqu’à Imlil et route vers Marrakech."
      ar: "انطلاق مبكر بالمسامير الثلجية نحو القمة، ثم نزول طويل إلى إمليل والعودة إلى مراكش."
