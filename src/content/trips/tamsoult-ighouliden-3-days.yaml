category: trekking
popularity: 65
title:
  en: Tamsoult and Ighouliden waterfall, 3 days
  fr: Tamsoult et cascade d’Ighouliden, 3 jours
  ar: تامسولت وشلال إغوليدن، 3 أيام
summary:
  en: West of Imlil, over Tizi Mzik into the green Azzaden valley, to the highest waterfall of the Toubkal area.
  fr: À l’ouest d’Imlil, par le Tizi Mzik vers la verte vallée d’Azzaden, jusqu’à la plus haute cascade de la région du Toubkal.
  ar: غرب إمليل، عبر تيزي مزيك نحو وادي أزادن الأخضر، حتى أعلى شلال في منطقة توبقال.
about:
  en: >-
    A varied loop on the quieter western side of Imlil. You cross Tizi Mzik into the Azzaden
    valley, sleep in simple mountain shelters and walk up past the shepherds’ huts of Tamsoult
    to the Ighouliden waterfall, which drops in several steps from the cliffs. Good for walkers
    who want real mountain views without going to the summit.
  fr: >-
    Une boucle variée sur le versant ouest, plus calme, d’Imlil. Vous passez le Tizi Mzik vers la
    vallée d’Azzaden, dormez dans des abris de montagne simples et montez, par les bergeries de
    Tamsoult, jusqu’à la cascade d’Ighouliden qui tombe en plusieurs sauts depuis les falaises.
    Idéal pour qui veut de vrais paysages de montagne sans aller au sommet.
  ar: >-
    جولة متنوعة في الجهة الغربية الأهدأ من إمليل. تعبرون تيزي مزيك نحو وادي أزادن، وتبيتون في ملاجئ جبلية
    بسيطة، وتصعدون مرورا بأكواخ الرعاة في تامسولت حتى شلال إغوليدن الذي ينحدر على عدة مراحل من الجروف.
    مناسبة لمن يريد مناظر جبلية حقيقية دون الصعود إلى القمة.
