category: culture
popularity: 65
title:
  en: Fes medina guided tour
  fr: Visite guidée de la médina de Fès
  ar: جولة مع مرشد في مدينة فاس العتيقة
summary:
  en: The largest car-free medina in the world, with a licensed guide from Fes. Bou Inania madrasa, the Chouara tannery, Al-Qarawiyyin and the craftsmen’s alleys.
  fr: La plus grande médina piétonne du monde, avec un guide officiel de Fès. Médersa Bou Inania, tannerie Chouara, Al-Qaraouiyine et ruelles des artisans.
  ar: أكبر مدينة عتيقة خالية من السيارات في العالم، مع مرشد معتمد من فاس. مدرسة بوعنانية، دار الدباغة شوارة، القرويين وأزقة الحرفيين.
about:
  en: >-
    Fes el-Bali has more than 9,000 lanes, and a good guide makes the difference between a maze and
    a story. You enter by the Blue Gate, visit the Bou Inania madrasa, pass the Al-Qarawiyyin mosque
    and university, watch the tanners at work from a terrace above Chouara, and walk through the
    metalworkers’ square. A full or half day, as you like.
  fr: >-
    Fès el-Bali compte plus de 9 000 ruelles, et un bon guide fait la différence entre un labyrinthe et
    une histoire. Entrée par Bab Boujloud, visite de la médersa Bou Inania, passage devant la mosquée-
    université Al-Qaraouiyine, vue sur les tanneurs depuis une terrasse au-dessus de Chouara, puis la
    place des dinandiers. Journée ou demi-journée, au choix.
  ar: >-
    تضم فاس البالي أكثر من 9000 زقاق، والمرشد الجيد يصنع الفرق بين متاهة وقصة. الدخول من باب بوجلود، زيارة
    مدرسة بوعنانية، المرور بجامع وجامعة القرويين، مشاهدة الدباغين من شرفة فوق شوارة، ثم ساحة الصفارين. يوم
    كامل أو نصف يوم حسب رغبتكم.
