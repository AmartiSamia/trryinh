title:
  en: Imperial cities of Morocco, 8 days
  fr: Les villes impériales du Maroc, 8 jours
  ar: المدن الإمبراطورية في المغرب، 8 أيام
summary:
  en: Casablanca, Rabat, Meknes, Volubilis, Fes and Marrakech with a private driver. History, medinas and Roman ruins, at a calm pace.
  fr: Casablanca, Rabat, Meknès, Volubilis, Fès et Marrakech avec chauffeur privé. Histoire, médinas et ruines romaines, à un rythme tranquille.
  ar: الدار البيضاء، الرباط، مكناس، وليلي، فاس ومراكش مع سائق خاص. تاريخ ومدن عتيقة وأطلال رومانية بإيقاع هادئ.
about:
  en: >-
    A private circuit through the four royal capitals of Morocco. You start in Casablanca with the
    Hassan II mosque, continue to Rabat, then Meknes and the Roman city of Volubilis, spend two full
    days in Fes, and end in Marrakech. Local licensed guides show you each medina; the driver handles
    the rest. Hotels or riads are chosen with you.
  fr: >-
    Un circuit privé à travers les quatre capitales royales du Maroc. Départ de Casablanca avec la mosquée
    Hassan II, puis Rabat, Meknès et la cité romaine de Volubilis, deux journées pleines à Fès, et fin à
    Marrakech. Des guides officiels locaux vous font découvrir chaque médina ; le chauffeur s’occupe du
    reste. Hôtels ou riads choisis avec vous.
  ar: >-
    جولة خاصة عبر العواصم الملكية الأربع للمغرب. تبدؤون من الدار البيضاء ومسجد الحسن الثاني، ثم الرباط،
    ثم مكناس ومدينة وليلي الرومانية، ويومان كاملان في فاس، والختام في مراكش. مرشدون محليون معتمدون يعرّفونكم
    بكل مدينة عتيقة، والسائق يتكفل بالباقي. الفنادق أو الرياضات تُختار معكم.
