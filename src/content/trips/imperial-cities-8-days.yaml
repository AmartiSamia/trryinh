summary:
  en: Casablanca, Rabat, Meknes, Volubilis, Fes and Marrakech with a private driver. History, medinas and Roman ruins, at a calm pace.
  fr: Casablanca, Rabat, Meknès, Volubilis, Fès et Marrakech avec chauffeur privé. Histoire, médinas et ruines romaines, à un rythme tranquille.
  es: Casablanca, Rabat, Mequinez, Volubilis, Fez y Marrakech con conductor privado. Historia, medinas y ruinas romanas, a un ritmo tranquilo.
  de: Casablanca, Rabat, Meknès, Volubilis, Fès und Marrakesch mit Privatfahrer. Geschichte, Medinas und römische Ruinen in ruhigem Tempo.
  pt: Casablanca, Rabat, Meknès, Volubilis, Fez e Marraquexe com motorista privado. História, medinas e ruínas romanas, a um ritmo calmo.
  ar: الدار البيضاء، الرباط، مكناس، وليلي، فاس ومراكش مع سائق خاص. تاريخ ومدن عتيقة وأطلال رومانية بإيقاع هادئ.
about:
  en: >-
    A private circuit through the four royal capitals of Morocco. You start in Casablanca with the Hassan II mosque, continue to Rabat, then Meknes and the Roman city of Volubilis, spend two full days in Fes, and end in Marrakech. Local licensed guides show you each medina; the driver handles the rest. Hotels or riads are chosen with you.
  fr: >-
    Un circuit privé à travers les quatre capitales royales du Maroc. Départ de Casablanca avec la mosquée Hassan II, puis Rabat, Meknès et la cité romaine de Volubilis, deux journées pleines à Fès, et fin à Marrakech. Des guides officiels locaux vous font découvrir chaque médina ; le chauffeur s’occupe du reste. Hôtels ou riads choisis avec vous.
  es: Un circuito privado por las cuatro capitales reales de Marruecos. Empieza en Casablanca con la mezquita Hassan II, sigue a Rabat, luego Mequinez y la ciudad romana de Volubilis, pasa dos días completos en Fez y termina en Marrakech. Guías locales oficiales le enseñan cada medina; el conductor se ocupa del resto. Los hoteles o riads se eligen con usted.
  de: Eine private Rundreise durch die vier Königsstädte Marokkos. Sie beginnen in Casablanca mit der Hassan-II.-Moschee, fahren weiter nach Rabat, dann nach Meknès und in die Römerstadt Volubilis, verbringen zwei volle Tage in Fès und enden in Marrakesch. Lizenzierte örtliche Guides zeigen Ihnen jede Medina; um den Rest kümmert sich der Fahrer. Hotels oder Riads wählen wir gemeinsam aus.
  pt: Um circuito privado pelas quatro capitais reais de Marrocos. Começa em Casablanca com a mesquita Hassan II, segue para Rabat, depois Meknès e a cidade romana de Volubilis, passa dois dias inteiros em Fez e termina em Marraquexe. Guias locais oficiais mostram-lhe cada medina; o motorista trata do resto. Os hotéis ou riads são escolhidos consigo.
  ar: >-
    جولة خاصة عبر العواصم الملكية الأربع للمغرب. تبدؤون من الدار البيضاء ومسجد الحسن الثاني، ثم الرباط، ثم مكناس ومدينة وليلي الرومانية، ويومان كاملان في فاس، والختام في مراكش. مرشدون محليون معتمدون يعرّفونكم بكل مدينة عتيقة، والسائق يتكفل بالباقي. الفنادق أو الرياضات تُختار معكم.
