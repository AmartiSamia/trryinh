summary:
  en: Sea air after the heat of Marrakech. The white-and-blue medina of Essaouira, its fishing port and ramparts, with a stop at an argan cooperative on the way.
  fr: L’air de la mer après la chaleur de Marrakech. La médina blanche et bleue d’Essaouira, son port et ses remparts, avec un arrêt dans une coopérative d’argan.
  es: Aire de mar después del calor de Marrakech. La medina blanca y azul de Essaouira, su puerto pesquero y sus murallas, con una parada en una cooperativa de argán por el camino.
  de: Meeresluft nach der Hitze von Marrakesch. Die weiß-blaue Medina von Essaouira, ihr Fischerhafen und die Stadtmauern, mit einem Stopp bei einer Arganöl-Kooperative unterwegs.
  pt: Ar do mar depois do calor de Marraquexe. A medina branca e azul de Essaouira, o porto de pesca e as muralhas, com paragem numa cooperativa de argão pelo caminho.
  ar: نسيم البحر بعد حرارة مراكش. مدينة الصويرة العتيقة البيضاء والزرقاء، مينائها وأسوارها، مع توقف في تعاونية للأركان.
about:
  en: >-
    Essaouira is a calm, windy port town on the Atlantic, about three hours west of Marrakech. On the way you stop at a women’s argan oil cooperative, and if you are lucky you will see the famous goats in the argan trees. In town you have free time to walk the ramparts, watch the fishing boats come in and eat grilled fish at the port.
  fr: >-
    Essaouira est un port calme et venté sur l’Atlantique, à environ trois heures à l’ouest de Marrakech. En chemin, arrêt dans une coopérative féminine d’huile d’argan, et avec un peu de chance les fameuses chèvres dans les arganiers. En ville, temps libre pour marcher sur les remparts, voir rentrer les bateaux de pêche et manger du poisson grillé au port.
  es: Essaouira es una ciudad portuaria tranquila y ventosa en el Atlántico, a unas tres horas al oeste de Marrakech. Por el camino se para en una cooperativa de mujeres de aceite de argán y, con suerte, verá las famosas cabras en los arganes. En la ciudad tiene tiempo libre para pasear por las murallas, ver entrar los barcos de pesca y comer pescado a la brasa en el puerto.
  de: Essaouira ist eine ruhige, windige Hafenstadt am Atlantik, etwa drei Stunden westlich von Marrakesch. Unterwegs halten Sie bei einer Frauenkooperative für Arganöl, und mit etwas Glück sehen Sie die berühmten Ziegen in den Arganbäumen. In der Stadt haben Sie Zeit für die Stadtmauern, die einlaufenden Fischerboote und gegrillten Fisch am Hafen.
  pt: Essaouira é uma cidade portuária calma e ventosa no Atlântico, a cerca de três horas a oeste de Marraquexe. Pelo caminho para numa cooperativa de mulheres de óleo de argão e, com sorte, vê as famosas cabras nas árvores de argão. Na cidade tem tempo livre para passear nas muralhas, ver chegar os barcos de pesca e comer peixe grelhado no porto.
  ar: >-
    الصويرة مدينة ساحلية هادئة وعاصفة على المحيط الأطلسي، على بعد حوالي ثلاث ساعات غرب مراكش. في الطريق تتوقفون في تعاونية نسائية لزيت الأركان، وقد تحالفكم الحظ لرؤية الماعز الشهير فوق أشجار الأركان. في المدينة لديكم وقت حر للمشي على الأسوار ومشاهدة قوارب الصيد وتناول السمك المشوي في الميناء.
