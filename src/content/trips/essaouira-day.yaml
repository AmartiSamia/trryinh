title:
  en: Essaouira day trip
  fr: Excursion à Essaouira
  ar: رحلة يومية إلى الصويرة
summary:
  en: Sea air after the heat of Marrakech. The white-and-blue medina of Essaouira, its fishing port and ramparts, with a stop at an argan cooperative on the way.
  fr: L’air de la mer après la chaleur de Marrakech. La médina blanche et bleue d’Essaouira, son port et ses remparts, avec un arrêt dans une coopérative d’argan.
  ar: نسيم البحر بعد حرارة مراكش. مدينة الصويرة العتيقة البيضاء والزرقاء، مينائها وأسوارها، مع توقف في تعاونية للأركان.
about:
  en: >-
    Essaouira is a calm, windy port town on the Atlantic, about three hours west of Marrakech.
    On the way you stop at a women’s argan oil cooperative, and if you are lucky you will see the
    famous goats in the argan trees. In town you have free time to walk the ramparts, watch the
    fishing boats come in and eat grilled fish at the port.
  fr: >-
    Essaouira est un port calme et venté sur l’Atlantique, à environ trois heures à l’ouest de Marrakech.
    En chemin, arrêt dans une coopérative féminine d’huile d’argan, et avec un peu de chance les
    fameuses chèvres dans les arganiers. En ville, temps libre pour marcher sur les remparts, voir
    rentrer les bateaux de pêche et manger du poisson grillé au port.
  ar: >-
    الصويرة مدينة ساحلية هادئة وعاصفة على المحيط الأطلسي، على بعد حوالي ثلاث ساعات غرب مراكش. في الطريق
    تتوقفون في تعاونية نسائية لزيت الأركان، وقد تحالفكم الحظ لرؤية الماعز الشهير فوق أشجار الأركان. في
    المدينة لديكم وقت حر للمشي على الأسوار ومشاهدة قوارب الصيد وتناول السمك المشوي في الميناء.
