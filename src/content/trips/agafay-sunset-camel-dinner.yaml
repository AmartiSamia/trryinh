title:
  en: Agafay desert sunset, camel ride and dinner
  fr: Coucher de soleil dans le désert d’Agafay, dromadaire et dîner
  ar: غروب الشمس في صحراء أكفاي، جولة على الجمل وعشاء
summary:
  en: The desert is 45 minutes from Marrakech. Ride a camel across the stony hills of Agafay at sunset, with the snowy Atlas behind, then dinner at a camp.
  fr: Le désert à 45 minutes de Marrakech. Balade à dos de dromadaire sur les collines d’Agafay au coucher du soleil, l’Atlas enneigé en fond, puis dîner au camp.
  ar: الصحراء على بعد 45 دقيقة من مراكش. جولة على الجمل فوق تلال أكفاي عند الغروب، والأطلس المثلج في الخلفية، ثم العشاء في المخيم.
about:
  en: >-
    Agafay is not a sand desert but a wide landscape of bare, golden hills, and on clear days the
    High Atlas stands white behind it. It is the easiest way to feel the desert without a long
    drive. You are picked up in the afternoon, ride camels for about an hour at sunset, then have
    dinner at a camp before driving back to Marrakech.
  fr: >-
    Agafay n’est pas un désert de sable mais un vaste paysage de collines nues et dorées, avec, par
    temps clair, l’Atlas tout blanc derrière. C’est la façon la plus simple de sentir le désert sans
    longue route. Prise en charge l’après-midi, environ une heure de dromadaire au coucher du soleil,
    puis dîner au camp avant le retour à Marrakech.
  ar: >-
    أكفاي ليست صحراء رملية بل منظر واسع من التلال الذهبية العارية، وفي الأيام الصافية يظهر الأطلس الكبير
    أبيضَ خلفها. إنها أسهل طريقة للإحساس بالصحراء دون طريق طويل. يتم استقبالكم بعد الظهر، وتركبون الجمال
    حوالي ساعة عند الغروب، ثم تتناولون العشاء في المخيم قبل العودة إلى مراكش.
