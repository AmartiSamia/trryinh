title:
  en: Agafay desert sunset, camel ride and dinner
  fr: Coucher de soleil dans le désert d’Agafay, dromadaire et dîner
  es: Atardecer en el desierto de Agafay, paseo en dromedario y cena
  de: Sonnenuntergang in der Agafay-Wüste, Kamelritt und Abendessen
  pt: Pôr do sol no deserto de Agafay, passeio de dromedário e jantar
  ar: غروب الشمس في صحراء أكفاي، جولة على الجمل وعشاء
summary:
  en: The desert is 45 minutes from Marrakech. Ride a camel across the stony hills of Agafay at sunset, with the snowy Atlas behind, then dinner at a camp.
  fr: Le désert à 45 minutes de Marrakech. Balade à dos de dromadaire sur les collines d’Agafay au coucher du soleil, l’Atlas enneigé en fond, puis dîner au camp.
  es: El desierto a 45 minutos de Marrakech. Paseo en dromedario por las colinas pedregosas de Agafay al atardecer, con el Atlas nevado al fondo, y cena en un campamento.
  de: Die Wüste liegt 45 Minuten von Marrakesch entfernt. Kamelritt über die steinigen Hügel von Agafay bei Sonnenuntergang, der verschneite Atlas im Hintergrund, danach Abendessen im Camp.
  pt: O deserto a 45 minutos de Marraquexe. Passeio de dromedário pelas colinas pedregosas de Agafay ao pôr do sol, com o Atlas nevado ao fundo, e jantar num acampamento.
  ar: الصحراء على بعد 45 دقيقة من مراكش. جولة على الجمل فوق تلال أكفاي عند الغروب، والأطلس المثلج في الخلفية، ثم العشاء في المخيم.
about:
  en: >-
    Agafay is not a sand desert but a wide landscape of bare, golden hills, and on clear days the High Atlas stands white behind it. It is the easiest way to feel the desert without a long drive. You are picked up in the afternoon, ride camels for about an hour at sunset, then have dinner at a camp before driving back to Marrakech.
  fr: >-
    Agafay n’est pas un désert de sable mais un vaste paysage de collines nues et dorées, avec, par temps clair, l’Atlas tout blanc derrière. C’est la façon la plus simple de sentir le désert sans longue route. Prise en charge l’après-midi, environ une heure de dromadaire au coucher du soleil, puis dîner au camp avant le retour à Marrakech.
  es: Agafay no es un desierto de arena, sino un amplio paisaje de colinas desnudas y doradas, y en los días claros el Alto Atlas se alza blanco detrás. Es la forma más fácil de sentir el desierto sin un largo trayecto. Le recogemos por la tarde, monta en dromedario cerca de una hora al atardecer y cena en un campamento antes de volver a Marrakech.
  de: Agafay ist keine Sandwüste, sondern eine weite Landschaft aus kahlen, goldenen Hügeln; an klaren Tagen steht dahinter weiß der Hohe Atlas. So erleben Sie die Wüste am einfachsten, ohne lange Fahrt. Abholung am Nachmittag, etwa eine Stunde Kamelritt bei Sonnenuntergang, dann Abendessen im Camp und Rückfahrt nach Marrakesch.
  pt: Agafay não é um deserto de areia, mas uma vasta paisagem de colinas nuas e douradas; nos dias limpos, o Alto Atlas ergue-se branco por trás. É a forma mais fácil de sentir o deserto sem uma longa viagem. É recolhido à tarde, anda de dromedário cerca de uma hora ao pôr do sol e janta num acampamento antes de regressar a Marraquexe.
  ar: >-
    أكفاي ليست صحراء رملية بل منظر واسع من التلال الذهبية العارية، وفي الأيام الصافية يظهر الأطلس الكبير أبيضَ خلفها. إنها أسهل طريقة للإحساس بالصحراء دون طريق طويل. يتم استقبالكم بعد الظهر، وتركبون الجمال حوالي ساعة عند الغروب، ثم تتناولون العشاء في المخيم قبل العودة إلى مراكش.
