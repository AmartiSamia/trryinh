summary:
  en: The green valley closest to Marrakech. A walk up to the Setti Fatma waterfalls with a local guide, a traditional Amazigh house and lunch by the river.
  fr: La vallée verte la plus proche de Marrakech. Montée aux cascades de Setti Fatma avec un guide local, une maison amazighe traditionnelle et déjeuner au bord de la rivière.
  es: El valle verde más cercano a Marrakech. Subida a las cascadas de Setti Fatma con un guía local, una casa amazigh tradicional y almuerzo junto al río.
  de: Das grüne Tal, das Marrakesch am nächsten liegt. Wanderung zu den Wasserfällen von Setti Fatma mit einem einheimischen Guide, ein traditionelles Amazigh-Haus und Mittagessen am Fluss.
  pt: O vale verde mais perto de Marraquexe. Subida às cascatas de Setti Fatma com um guia local, uma casa amazigh tradicional e almoço junto ao rio.
  ar: الوادي الأخضر الأقرب إلى مراكش. صعود إلى شلالات ستي فاطمة مع مرشد محلي، زيارة بيت أمازيغي تقليدي وغداء بجانب النهر.
about:
  en: >-
    One hour from Marrakech, the Ourika river cuts a green valley into the Atlas. You stop at a traditional Amazigh house to see how families live, then continue to Setti Fatma, where a local guide leads you on a rocky path up to the first of the seven waterfalls. Lunch is a tagine on a terrace over the river.
  fr: >-
    À une heure de Marrakech, la rivière Ourika creuse une vallée verte dans l’Atlas. Arrêt dans une maison amazighe traditionnelle pour voir comment vivent les familles, puis Setti Fatma, où un guide local vous conduit sur un sentier rocheux jusqu’à la première des sept cascades. Déjeuner : un tajine sur une terrasse au-dessus de la rivière.
  es: "A una hora de Marrakech, el río Ourika abre un valle verde en el Atlas. Se para en una casa amazigh tradicional para ver cómo viven las familias y luego sigue hasta Setti Fatma, donde un guía local le lleva por un sendero rocoso hasta la primera de las siete cascadas. Almuerzo: un tajín en una terraza sobre el río."
  de: "Eine Stunde von Marrakesch schneidet der Fluss Ourika ein grünes Tal in den Atlas. Sie besuchen ein traditionelles Amazigh-Haus, um zu sehen, wie Familien leben, und fahren weiter nach Setti Fatma, wo ein einheimischer Guide Sie über einen felsigen Pfad zum ersten der sieben Wasserfälle führt. Mittagessen: Tajine auf einer Terrasse über dem Fluss."
  pt: "A uma hora de Marraquexe, o rio Ourika abre um vale verde no Atlas. Para numa casa amazigh tradicional para ver como vivem as famílias e segue até Setti Fatma, onde um guia local o leva por um trilho rochoso até à primeira das sete cascatas. Almoço: um tajine num terraço sobre o rio."
  ar: >-
    على بعد ساعة من مراكش، يشق نهر أوريكا واديا أخضر في الأطلس. تتوقفون في بيت أمازيغي تقليدي لمعرفة كيف تعيش العائلات، ثم تواصلون إلى ستي فاطمة حيث يقودكم مرشد محلي على مسار صخري إلى أول الشلالات السبعة. الغداء طاجين على شرفة فوق النهر.
