category: day-trip
popularity: 75
title:
  en: Ourika valley and Setti Fatma waterfalls
  fr: Vallée de l’Ourika et cascades de Setti Fatma
  ar: وادي أوريكا وشلالات ستي فاطمة
summary:
  en: The green valley closest to Marrakech. A walk up to the Setti Fatma waterfalls with a local guide, a traditional Amazigh house and lunch by the river.
  fr: La vallée verte la plus proche de Marrakech. Montée aux cascades de Setti Fatma avec un guide local, une maison amazighe traditionnelle et déjeuner au bord de la rivière.
  ar: الوادي الأخضر الأقرب إلى مراكش. صعود إلى شلالات ستي فاطمة مع مرشد محلي، زيارة بيت أمازيغي تقليدي وغداء بجانب النهر.
about:
  en: >-
    One hour from Marrakech, the Ourika river cuts a green valley into the Atlas. You stop at a
    traditional Amazigh house to see how families live, then continue to Setti Fatma, where a local
    guide leads you on a rocky path up to the first of the seven waterfalls. Lunch is a tagine on a
    terrace over the river.
  fr: >-
    À une heure de Marrakech, la rivière Ourika creuse une vallée verte dans l’Atlas. Arrêt dans une
    maison amazighe traditionnelle pour voir comment vivent les familles, puis Setti Fatma, où un guide
    local vous conduit sur un sentier rocheux jusqu’à la première des sept cascades. Déjeuner : un
    tajine sur une terrasse au-dessus de la rivière.
  ar: >-
    على بعد ساعة من مراكش، يشق نهر أوريكا واديا أخضر في الأطلس. تتوقفون في بيت أمازيغي تقليدي لمعرفة كيف
    تعيش العائلات، ثم تواصلون إلى ستي فاطمة حيث يقودكم مرشد محلي على مسار صخري إلى أول الشلالات السبعة.
    الغداء طاجين على شرفة فوق النهر.
