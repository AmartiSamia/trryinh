goodToKnow:
  - en: "The path to the waterfalls is rocky and steep in places. Wear shoes with good grip."
    fr: "Le sentier des cascades est rocheux et raide par endroits. Portez des chaussures qui accrochent."
    es: El sendero a las cascadas es rocoso y empinado en algunos tramos. Lleve calzado que agarre bien.
    de: Der Weg zu den Wasserfällen ist stellenweise felsig und steil. Tragen Sie Schuhe mit gutem Profil.
    pt: O trilho para as cascatas é rochoso e íngreme em alguns troços. Use calçado com boa aderência.
    ar: "مسار الشلالات صخري ومنحدر في بعض الأماكن. ارتدوا أحذية بقبضة جيدة."
